<!DOCTYPE html>

<html lang="id">

<head>


<!-- =====================================================
     META
====================================================== -->

<meta

<title>STS | Petualangan Kelas 5</title>


<!-- =====================================================
     FONT GOOGLE
====================================================== -->

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* =====================================================
       HTML & BODY
    ====================================================== */

    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
    }

    body {

        min-height: 100vh;

        font-family:
            'Poppins',
            sans-serif;

        background:
            url('https://i.imgur.com/clG3P3n.png')
            no-repeat
            center
            center
            fixed;

        background-size: cover;

        color: #fff;

        overflow-x: hidden;
    }


    /* =====================================================
       NAVBAR
    ====================================================== */

    nav {

        width: 100%;

        display: flex;

        justify-content: flex-end;

        align-items: center;

        padding:
            .65rem
            1rem;

        box-shadow:
            0 3px 7px
            rgba(0, 0, 0, .18);
    }


    /* =====================================================
       NAVBAR KANAN
    ====================================================== */

    .nav-right {

        display: flex;

        align-items: center;

        justify-content: flex-end;

        gap: .35rem;

        flex-wrap: wrap;
    }


    /* =====================================================
       LINK NAVBAR
    ====================================================== */

    nav a {

        background:
            rgba(
                255,
                255,
                255,
                .95
            );

        padding:
            .4rem
            .7rem;

        border-radius: 7px;

        text-decoration: none;

        color: #0288d1;

        font-weight: 700;

        font-size: .75rem;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: .25rem;

        transition:
            transform .2s ease,
            box-shadow .2s ease;
    }


    /* =====================================================
       HOVER NAVBAR
    ====================================================== */

    nav a:hover {

        transform:
            translateY(-1px);

        box-shadow:
            0 4px 8px
            rgba(0, 0, 0, .18);
    }


    /* =====================================================
       HEADER
    ====================================================== */

    .hero-layout {

        width:
            calc(100% - 20px);

        max-width: 800px;

        margin:
            18px
            auto
            8px;

        display: flex;

        justify-content: center;

        align-items: center;
    }


    /* =====================================================
       BAGIAN JUDUL
    ====================================================== */

    .title-section {

        text-align: center;

        width: 100%;
    }


    /* =====================================================
       JUDUL UTAMA
    ====================================================== */

    .title-section h1 {

        font-size:
            clamp(
                1.2rem,
                3vw,
                1.8rem
            );

        background:
            rgba(
                255,
                255,
                255,
                .93
            );

        display: inline-block;

        padding:
            .45rem
            1rem;

        border-radius: 10px;

        color: #0288d1;

        box-shadow:
            0 3px 9px
            rgba(0, 0, 0, .18);
    }


    /* =====================================================
       SUBJUDUL
    ====================================================== */

    .subtitle {

        margin-top: 7px;

        background:
            rgba(
                255,
                255,
                255,
                .90
            );

        color: #555;

        display: inline-block;

        padding:
            .3rem
            .7rem;

        border-radius: 7px;

        font-size: .68rem;

        font-weight: 600;

        box-shadow:
            0 2px 6px
            rgba(0, 0, 0, .12);
    }


    /* =====================================================
       PEMBUNGKUS MENU STS
    ====================================================== */

    .sts-container {

        width:
            calc(100% - 30px);

        max-width: 650px;

        margin:
            18px
            auto;

        display: grid;

        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1fr);

        gap: 12px;

        align-items: stretch;
    }


    /* =====================================================
       KARTU STS
       
       PENTING:
       KARTU HANYA SEBAGAI TAMPILAN.
       KARTU TIDAK MEMILIKI LINK.
    ====================================================== */

    .sts-card {

        min-width: 0;

        background:
            rgba(
                255,
                255,
                255,
                .94
            );

        border-radius: 12px;

        padding:
            16px
            8px;

        text-align: center;

        color: #0288d1;

        box-shadow:
            0 4px 10px
            rgba(0, 0, 0, .18);

        border:
            2px
            solid
            rgba(
                255,
                255,
                255,
                .85
            );

        /*
         * Tidak menggunakan cursor pointer.
         * Kartu bukan tombol.
         */

        cursor: default;

        transition:
            box-shadow .2s ease;
    }


    /* =====================================================
       HOVER KARTU
       
       Tidak ada efek naik/klik pada kartu.
    ====================================================== */

    .sts-card:hover {

        box-shadow:
            0 4px 10px
            rgba(0, 0, 0, .18);

        background:
            rgba(
                255,
                255,
                255,
                .94
            );

        transform: none;
    }


    /* =====================================================
       IKON STS
    ====================================================== */

    .sts-icon {

        width: 52px;

        height: 52px;

        margin:
            0
            auto
            8px;

        border-radius: 50%;

        background:
            linear-gradient(
                135deg,
                #0288d1,
                #7b1fa2
            );

        display: flex;

        justify-content: center;

        align-items: center;

        font-size: 1.6rem;

        box-shadow:
            0 3px 7px
            rgba(0, 0, 0, .18);
    }


    /* =====================================================
       JUDUL KARTU
    ====================================================== */

    .sts-card h2 {

        font-size: 1rem;

        margin-bottom: 4px;

        color: #0288d1;
    }


    /* =====================================================
       KETERANGAN KARTU
    ====================================================== */

    .sts-card p {

        color: #555;

        font-size: .65rem;

        line-height: 1.35;

        margin-bottom: 9px;
    }


    /* =====================================================
       TOMBOL MULAI
       
       INILAH SATU-SATUNYA BAGIAN STS
       YANG MEMILIKI LINK.
    ====================================================== */

    .sts-button {

        display: inline-block;

        background:
            linear-gradient(
                45deg,
                #0288d1,
                #7b1fa2
            );

        color: #fff;

        padding:
            5px
            9px;

        border-radius: 7px;

        font-weight: 700;

        font-size: .62rem;

        box-shadow:
            0 2px 5px
            rgba(0, 0, 0, .16);

        pointer-events: auto;

        cursor: pointer;

        text-decoration: none;

        transition:
            transform .2s ease,
            box-shadow .2s ease;
    }


    /* =====================================================
       HOVER TOMBOL MULAI
    ====================================================== */

    .sts-button:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 4px 8px
            rgba(0, 0, 0, .22);
    }


    /* =====================================================
       SAAT TOMBOL DITEKAN
    ====================================================== */

    .sts-button:active {

        transform:
            translateY(0);
    }


    /* =====================================================
       FOCUS TOMBOL
    ====================================================== */

    .sts-button:focus-visible {

        outline:
            3px
            solid
            rgba(
                255,
                255,
                255,
                .95
            );

        outline-offset: 3px;
    }


    /* =====================================================
       TOMBOL KEMBALI
    ====================================================== */

    .back-container {

        display: flex;

        justify-content: center;

        margin:
            10px
            auto
            20px;
    }


    /* =====================================================
       LINK KEMBALI
    ====================================================== */

    .back-button {

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 5px;

        background:
            rgba(
                255,
                255,
                255,
                .95
            );

        color: #0288d1;

        text-decoration: none;

        padding:
            6px
            12px;

        border-radius: 7px;

        font-weight: 700;

        font-size: .7rem;

        box-shadow:
            0 3px 7px
            rgba(0, 0, 0, .15);

        transition: .2s;
    }


    /* =====================================================
       HOVER TOMBOL KEMBALI
    ====================================================== */

    .back-button:hover {

        transform:
            translateY(-1px);

        background:
            #dff6ff;
    }


    /* =====================================================
       AUDIO
    ====================================================== */

    audio {

        display: none;
    }


    /* =====================================================
       TABLET
    ====================================================== */

    @media (max-width: 768px) {

        /* NAVBAR */

        nav {

            padding:
                .5rem
                .7rem;
        }


        .nav-right {

            justify-content: center;

            width: 100%;

            gap: 4px;
        }


        nav a {

            font-size: .68rem;

            padding:
                .35rem
                .5rem;
        }


        /* HEADER */

        .hero-layout {

            width:
                calc(100% - 16px);

            margin:
                14px
                auto
                6px;
        }


        .title-section h1 {

            font-size: 1.15rem;

            padding:
                .4rem
                .75rem;
        }


        .subtitle {

            font-size: .62rem;

            padding:
                .25rem
                .55rem;
        }


        /* =================================================
           DUA KARTU TETAP SATU BARIS
        ================================================== */

        .sts-container {

            width:
                calc(100% - 20px);

            max-width: 600px;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 8px;

            margin:
                14px
                auto;
        }


        .sts-card {

            padding:
                12px
                6px;

            border-radius: 10px;
        }


        .sts-icon {

            width: 45px;

            height: 45px;

            font-size: 1.4rem;

            margin-bottom: 6px;
        }


        .sts-card h2 {

            font-size: .9rem;

            margin-bottom: 3px;
        }


        .sts-card p {

            font-size: .58rem;

            margin-bottom: 7px;
        }


        .sts-button {

            padding:
                5px
                7px;

            font-size: .56rem;
        }


        .back-container {

            margin:
                8px
                auto
                15px;
        }


        .back-button {

            font-size: .65rem;

            padding:
                6px
                10px;
        }

    }


    /* =====================================================
       HP KECIL
    ====================================================== */

    @media (max-width: 480px) {

        /* NAVBAR */

        nav {

            padding: .4rem;
        }


        nav a {

            font-size: .6rem;

            padding:
                .3rem
                .42rem;
        }


        /* HEADER */

        .hero-layout {

            width:
                calc(100% - 10px);

            margin:
                12px
                auto
                5px;
        }


        .title-section h1 {

            font-size: 1rem;

            padding:
                .35rem
                .6rem;

            border-radius: 8px;
        }


        .subtitle {

            font-size: .55rem;

            margin-top: 5px;

            padding:
                .22rem
                .45rem;
        }


        /* =================================================
           STS 1 DAN STS 2 TETAP KIRI - KANAN
        ================================================== */

        .sts-container {

            width:
                calc(100% - 12px);

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 6px;

            margin:
                12px
                auto;
        }


        .sts-card {

            padding:
                10px
                4px;

            border-radius: 9px;

            border-width: 1px;
        }


        .sts-icon {

            width: 40px;

            height: 40px;

            font-size: 1.25rem;

            margin-bottom: 5px;
        }


        .sts-card h2 {

            font-size: .8rem;

            margin-bottom: 2px;
        }


        .sts-card p {

            font-size: .52rem;

            line-height: 1.25;

            margin-bottom: 6px;
        }


        .sts-button {

            padding:
                4px
                5px;

            font-size: .5rem;

            border-radius: 6px;
        }


        .back-button {

            font-size: .58rem;

            padding:
                5px
                8px;
        }

    }


    /* =====================================================
       HP SANGAT KECIL
    ====================================================== */

    @media (max-width: 360px) {

        .sts-container {

            width:
                calc(100% - 8px);

            gap: 4px;
        }


        .sts-card {

            padding:
                8px
                3px;
        }


        .sts-icon {

            width: 36px;

            height: 36px;

            font-size: 1.1rem;
        }


        .sts-card h2 {

            font-size: .72rem;
        }


        .sts-card p {

            font-size: .46rem;
        }


        .sts-button {

            font-size: .44rem;

            padding:
                4px
                4px;
        }

    }

</style>


</head>

<body>


<!-- =====================================================
     NAVIGASI
====================================================== -->

<nav>

    <div class="nav-right">

        <a
            href="../index.html"
            class="nav-button"
        >
            🏠 Beranda
        </a>


        <a
            href="kelas.html"
            class="nav-button"
        >
            🏫 Kelas
        </a>


        <a
            href="Petualangan-Kelas-5.html"
            class="nav-button"
        >
            🗺️ Petualangan
        </a>

    </div>

</nav>


<!-- =====================================================
     HEADER STS
====================================================== -->

<section class="hero-layout">

    <div class="title-section">

        <h1>
            📝 Sumatif Tengah Semester
        </h1>


        <div>

            <span class="subtitle">
                Pilih menu STS untuk memulai petualangan
            </span>

        </div>

    </div>

</section>


<!-- =====================================================
     MENU STS
====================================================== -->

<div class="sts-container">


    <!-- =================================================
         STS 1
    ================================================== -->

    <div
        class="sts-card"
        data-halaman="STS 1"
    >

        <!-- IKON -->

        <div class="sts-icon">
            📝
        </div>


        <!-- JUDUL -->

        <h2>
            STS 1
        </h2>


        <!-- KETERANGAN -->

        <p>
            Masuk ke halaman
            Sumatif Tengah Semester 1.
        </p>


        <!-- =================================================
             HANYA TOMBOL INI YANG BISA DIKLIK
        ================================================== -->

        <a
            href="sts1.html"
            class="sts-button"
            data-halaman="STS 1"
            aria-label="Mulai STS 1"
        >
            🚀 Mulai STS 1
        </a>

    </div>


    <!-- =================================================
         STS 2
    ================================================== -->

    <div
        class="sts-card"
        data-halaman="STS 2"
    >

        <!-- IKON -->

        <div class="sts-icon">
            📚
        </div>


        <!-- JUDUL -->

        <h2>
            STS 2
        </h2>


        <!-- KETERANGAN -->

        <p>
            Masuk ke halaman
            Sumatif Tengah Semester 2.
        </p>


        <!-- =================================================
             HANYA TOMBOL INI YANG BISA DIKLIK
        ================================================== -->

        <a
            href="sts2.html"
            class="sts-button"
            data-halaman="STS 2"
            aria-label="Mulai STS 2"
        >
            🚀 Mulai STS 2
        </a>

    </div>


</div>


<!-- =====================================================
     TOMBOL KEMBALI
====================================================== -->

<div class="back-container">

    <a
        href="Petualangan-Kelas-5.html"
        class="back-button"
    >

        ← Kembali ke Petualangan

    </a>

</div>


<!-- =====================================================
     AUDIO KLIK
====================================================== -->

<audio
    id="clickSound"
    src="suara/button-press.mp3"
    preload="auto"
></audio>


<script>

    /* =====================================================
       AUDIO KLIK
    ====================================================== */

    const clickSound =
        document.getElementById(
            "clickSound"
        );


    /* =====================================================
       FUNGSI SUARA KLIK
    ====================================================== */

    function playClickSound() {

        if (!clickSound) {
            return;
        }

        clickSound.currentTime = 0;

        clickSound
            .play()
            .catch(function () {
                /*
                 * Browser dapat memblokir audio
                 * jika aturan autoplay terpenuhi.
                 * Tidak menghentikan navigasi.
                 */
            });

    }


    /* =====================================================
       SUARA UNTUK NAVIGASI
    ====================================================== */

    document
        .querySelectorAll(
            "nav a"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    playClickSound();

                }
            );

        });


    /* =====================================================
       SUARA UNTUK TOMBOL MULAI
    ====================================================== */

    document
        .querySelectorAll(
            ".sts-button"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    playClickSound();

                }
            );

        });


    /* =====================================================
       SUARA UNTUK TOMBOL KEMBALI
    ====================================================== */

    document
        .querySelectorAll(
            ".back-button"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    playClickSound();

                }
            );

        });


    /* =====================================================
       KEAMANAN KARTU STS
       
       Klik pada area kartu:
       - Tidak membuka halaman
       - Tidak melakukan navigasi
       - Tidak memainkan suara
       
       Klik tombol:
       - Tetap aktif
       - Membuka sts1.html / sts2.html
    ====================================================== */

    document
        .querySelectorAll(
            ".sts-card"
        )
        .forEach(function (card) {

            card.addEventListener(
                "click",
                function (event) {

                    /*
                     * Periksa apakah klik berasal
                     * dari tombol Mulai.
                     */

                    const tombol =
                        event.target.closest(
                            ".sts-button"
                        );


                    /*
                     * Jika bukan tombol Mulai,
                     * hentikan aksi.
                     */

                    if (!tombol) {

                        event.preventDefault();

                        event.stopPropagation();

                        return false;

                    }

                }
            );

        });


    /* =====================================================
       INFORMASI CONSOLE
    ====================================================== */

    console.log(
        "Halaman STS | Petualangan Kelas 5 aktif."
    );

    console.log(
        "Kartu STS tidak dapat diklik."
    );

    console.log(
        "Hanya tombol Mulai STS yang aktif."
    );

</script>


</body>

</html>
