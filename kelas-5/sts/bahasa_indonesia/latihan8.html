let dataNama = "";

let dataKelas = "";

let dataAbsen = "";

let indeks = 0;

let benar = 0;


/* =========================================================
   MULAI KUIS DARI SESSION ONLINE
========================================================= */

function mulaiKuisDariSession(data) {

    if (
        !data ||
        !data.nama ||
        !data.kelas ||
        !data.sessionId
    ) {

        return;

    }


    dataNama =
        data.nama || "";


    dataKelas =
        data.kelas || "";


    dataAbsen =
        data.nomorAbsen ||
        data.absen ||
        "";


    indeks = 0;

    benar = 0;

    bahasaIndonesiaNilaiSudahDikirim =
        false;

    bahasaIndonesiaPengirimanNilaiSedangBerjalan =
        false;


    const loading =
        document.getElementById(
            "onlineLoading"
        );


    if (loading) {

        loading.classList.add(
            "hidden"
        );

    }


    const areaKuis =
        document.getElementById(
            "areaKuis"
        );


    if (areaKuis) {

        areaKuis.classList.remove(
            "hidden"
        );

    }


    /*
       Acak urutan soal.
    */

    acakArray(soal);


    /*
       Acak pilihan jawaban setiap soal.
    */

    soal.forEach(
        function(s) {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    if (
        !Array.isArray(arr) ||
        arr.length < 2
    ) {

        return;

    }


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    if (
        !s ||
        !Array.isArray(s.a) ||
        s.a.length === 0
    ) {

        return;

    }


    const gabung =

        s.a.map(
            function(teks, i) {

                return {

                    teks:
                        teks,

                    benar:
                        i === s.k

                };

            }
        );


    acakArray(gabung);


    s.a =

        gabung.map(
            function(o) {

                return o.teks;

            }
        );


    s.k =

        gabung.findIndex(
            function(o) {

                return o.benar;

            }
        );

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal() {

    const quiz =
        document.getElementById(
            "quiz"
        );


    if (!quiz) {

        return;

    }


    /* =====================================================
       SELESAI
    ===================================================== */

    if (
        indeks >=
        soal.length
    ) {

        const nilai =

            soal.length > 0

                ?

                Math.round(

                    (
                        benar /
                        soal.length
                    ) *
                    100

                )

                :

                0;


        /* =================================================
           SIMPAN HASIL KE SERVER / DATABASE
        ================================================= */

        simpanNilaiKeServer(

            dataNama,

            dataKelas,

            dataAbsen,

            nilai,

            benar,

            soal.length

        );


        let kelasWarna =
            "nilai-merah";


        if (
            nilai >= 80
        ) {

            kelasWarna =
                "nilai-hijau";

        }

        else if (
            nilai >= 60
        ) {

            kelasWarna =
                "nilai-kuning";

        }


        quiz.innerHTML = `

            <div class="hasil-box">

                <h2>
                    🎉 Kuis Selesai!
                </h2>

                <p>
                    Hebat,
                    <b>${escapeHTML(dataNama)}</b>!
                </p>

                <p>
                    Jawaban benar:
                    <b>${benar}</b>
                    dari
                    <b>${soal.length}</b>
                    soal
                </p>

                <div>

                    <p>
                        <b>Nilai Kamu:</b>
                    </p>

                    <div
                        class="nilai-besar ${kelasWarna}"
                    >
                        ${nilai}
                    </div>

                </div>

                <div
                    id="statusPenyimpananNilai"
                    class="status-penyimpanan-nilai"
                >

                    🟡 Menyimpan nilai ke server...

                </div>

                <br>

                <button
                    type="button"
                    onclick="ulangiKuis()"
                >

                    🔄 Ulangi Kuis

                </button>

                <button
                    type="button"
                    onclick="keluarKuis()"
                >

                    ❌ Selesai

                </button>

            </div>

        `;


        return;

    }


    const s =
        soal[indeks];


    if (!s) {

        return;

    }


    quiz.innerHTML = `

        <div class="nomor-soal">

            📝 Soal
            ${indeks + 1}
            dari
            ${soal.length}

        </div>


        <div class="kotak-soal">

            ${s.q}

        </div>


        <div class="answers">

            ${s.a.map(

                function(j, i) {

                    return `

                        <label>

                            <input
                                type="radio"
                                name="jawaban"
                                value="${i}"
                                onclick="mainkanSuaraKlik()"
                            />

                            ${j}

                        </label>

                    `;

                }

            ).join('')}

        </div>


        <button
            type="button"
            onclick="periksaJawaban()"
        >

            ➡️ Next

        </button>

    `;

}


/* =========================================================
   ESCAPE HTML
   Mencegah nama siswa dimasukkan mentah ke innerHTML.
========================================================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value == null
                ? ""
                : value
        );


    return div.innerHTML;

}


/* =========================================================
   PERIKSA JAWABAN
========================================================= */

function periksaJawaban() {

    const jawaban =

        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if (!jawaban) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(

            "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +

            "Ayo pilih salah satu jawaban terlebih dahulu " +

            "sebelum lanjut ke soal berikutnya! 💡"

        );


        return;

    }


    if (

        parseInt(
            jawaban.value,
            10
        ) ===

        soal[indeks].k

    ) {

        benar++;

    }


    indeks++;


    mainkanSuaraNext();


    tampilkanSoal();

}


/* =========================================================
   PERINGATAN
========================================================= */

function tampilkanPeringatan(pesan) {

    const area =
        document.getElementById(
            "peringatanArea"
        );


    if (!area) {

        return;

    }


    area.innerHTML = `

        <div class="warning-overlay">

            <div class="warning-box">

                <h2>
                    🚀 Yuk, Jangan Lupa!
                </h2>

                <p>
                    ${pesan}
                </p>

                <button
                    type="button"
                    onclick="tutupPeringatan()"
                >

                    Oke 👍

                </button>

            </div>

        </div>

    `;

}


function tutupPeringatan() {

    const area =
        document.getElementById(
            "peringatanArea"
        );


    if (area) {

        area.innerHTML = "";

    }

}


/* =========================================================
   SIMPAN NILAI KE SERVER / DATABASE

   Google Form DIHAPUS.

   Nilai dikirim ke endpoint API yang sama dengan
   sistem session/heartbeat siswa.

   Action:
   "submitScore"

   Database/Google Sheet tetap menggunakan
   sistem server yang sama.
========================================================= */

const BAHASA_INDONESIA_SCORE_ACTION =
    "submitScore";


let bahasaIndonesiaNilaiSudahDikirim =
    false;


let bahasaIndonesiaPengirimanNilaiSedangBerjalan =
    false;


/* =========================================================
   FUNGSI SIMPAN NILAI
========================================================= */

async function simpanNilaiKeServer(

    nama,
    kelas,
    absen,
    nilai,
    jumlahBenar,
    totalSoal

) {

    /* -----------------------------------------------------
       Jangan menyimpan dua kali pada satu pengerjaan.
    ----------------------------------------------------- */

    if (
        bahasaIndonesiaNilaiSudahDikirim ||
        bahasaIndonesiaPengirimanNilaiSedangBerjalan
    ) {

        return {

            success:
                true,

            duplicate:
                true

        };

    }


    bahasaIndonesiaPengirimanNilaiSedangBerjalan =
        true;


    const loginData =
        bahasaIndonesiaGetLoginData();


    const sessionId =
        loginData &&
        loginData.sessionId
            ? loginData.sessionId
            : "";


    const nilaiAman =
        Math.max(
            0,
            Math.min(
                100,
                Number(nilai) || 0
            )
        );


    const benarAman =
        Math.max(
            0,
            Number(jumlahBenar) || 0
        );


    const totalAman =
        Math.max(
            0,
            Number(totalSoal) || 0
        );


    const persentase =
        totalAman > 0
            ? Number(
                (
                    benarAman /
                    totalAman *
                    100
                ).toFixed(2)
            )
            : nilaiAman;


    const payload = {

        action:
            BAHASA_INDONESIA_SCORE_ACTION,

        sessionId:
            sessionId,

        nama:
            nama ||
            (
                loginData &&
                loginData.nama
            ) ||
            "",

        kelas:
            kelas ||
            (
                loginData &&
                loginData.kelas
            ) ||
            "",

        nomorAbsen:
            absen ||
            (
                loginData &&
                (
                    loginData.nomorAbsen ||
                    loginData.absen
                )
            ) ||
            "",

        absen:
            absen ||
            (
                loginData &&
                (
                    loginData.absen ||
                    loginData.nomorAbsen
                )
            ) ||
            "",

        namaKuis:
            "Soal Latihan 8 UTS 1 Bahasa Indonesia Kelas 5",

        quizName:
            "Soal Latihan 8 UTS 1 Bahasa Indonesia Kelas 5",

        nilai:
            nilaiAman,

        skor:
            nilaiAman,

        score:
            nilaiAman,

        benar:
            benarAman,

        jumlahBenar:
            benarAman,

        totalSoal:
            totalAman,

        jumlahSoal:
            totalAman,

        persentase:
            persentase,

        percentage:
            persentase,

        halaman:
            BAHASA_INDONESIA_HALAMAN_UTAMA,

        sumber:
            "Petualangan Kelas 5",

        waktu:
            new Date().toISOString(),

        timestamp:
            Date.now(),

        jenis:
            "hasil_kuis"

    };


    console.log(
        "========================================"
    );


    console.log(
        "📤 MENGIRIM NILAI BAHASA_INDONESIA KE SERVER"
    );


    console.log(
        "🆔 Session ID:",
        payload.sessionId
    );


    console.log(
        "👤 Nama:",
        payload.nama
    );


    console.log(
        "🏫 Kelas:",
        payload.kelas
    );


    console.log(
        "🔢 Absen:",
        payload.nomorAbsen
    );


    console.log(
        "📝 Kuis:",
        payload.namaKuis
    );


    console.log(
        "🎯 Nilai:",
        payload.nilai
    );


    console.log(
        "✅ Benar:",
        payload.benar,
        "/",
        payload.totalSoal
    );


    try {

        const result =
            await bahasaIndonesiaRequestJSONP(
                payload,
                15000
            );


        console.log(
            "📥 RESPONS SERVER NILAI BAHASA_INDONESIA:",
            result
        );


        if (
            result &&
            result.success === true
        ) {

            bahasaIndonesiaNilaiSudahDikirim =
                true;


            console.log(
                "✅ NILAI BAHASA_INDONESIA BERHASIL DISIMPAN DI SERVER / DATABASE"
            );


            bahasaIndonesiaTampilkanStatusPenyimpananNilai(
                true,
                result.message ||
                "Nilai BAHASA_INDONESIA berhasil tersimpan di server."
            );


            return result;

        }


        const message =
            result &&
            result.message
                ? result.message
                : "Server belum mengonfirmasi penyimpanan nilai BAHASA_INDONESIA.";


        console.warn(
            "⚠️ NILAI BAHASA_INDONESIA BELUM DIKONFIRMASI SERVER:",
            result
        );


        bahasaIndonesiaTampilkanStatusPenyimpananNilai(
            false,
            message
        );


        return result || {

            success:
                false,

            message:
                message

        };


    } catch (error) {

        console.error(
            "❌ GAGAL MENGIRIM NILAI BAHASA_INDONESIA KE SERVER:",
            error
        );


        bahasaIndonesiaTampilkanStatusPenyimpananNilai(
            false,
            "Nilai belum tersimpan. Periksa koneksi lalu coba lagi."
        );


        return {

            success:
                false,

            error:
                String(error)

        };


    } finally {

        bahasaIndonesiaPengirimanNilaiSedangBerjalan =
            false;

    }

}


/* =========================================================
   STATUS PENYIMPANAN NILAI DI HALAMAN HASIL
========================================================= */

function bahasaIndonesiaTampilkanStatusPenyimpananNilai(
    berhasil,
    pesan
) {

    const element =
        document.getElementById(
            "statusPenyimpananNilai"
        );


    if (!element) {

        return;

    }


    if (berhasil) {

        element.innerHTML =
            "🟢 " +
            (
                pesan ||
                "Nilai BAHASA_INDONESIA tersimpan di server."
            );


    } else {

        element.innerHTML =
            "🟠 " +
            (
                pesan ||
                "Nilai BAHASA_INDONESIA belum tersimpan di server."
            ) +

            `<br>
            <button
                type="button"
                onclick="kirimUlangNilaiKeServer()"
            >
                🔁 Kirim Lagi
            </button>`;

    }


    element.classList.toggle(
        "status-nilai-gagal",
        !berhasil
    );

}

/* =====================================================
   SISTEM ONLINE SISWA - BAHASA_INDONESIA

   Mengikuti sistem online pada halaman
   STS utama dan Petualangan Kelas 5.

   Fungsi:
   - Membaca identitas siswa
   - Memeriksa sessionId
   - Cek sesi server
   - Batas sesi client 24 jam
   - Heartbeat setiap 20 detik
   - Heartbeat saat aktivitas
   - Heartbeat saat tab aktif kembali
   - Status online
   - Proteksi navigasi
===================================================== */


/* =====================================================
   KONFIGURASI API
===================================================== */

const BAHASA_INDONESIA_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec";


/* =====================================================
   NAMA HALAMAN

   Siswa akan tercatat sedang berada
   pada halaman BAHASA_INDONESIA.
===================================================== */

const BAHASA_INDONESIA_HALAMAN_UTAMA =
    "Soal Latihan 8 UTS 1 Bahasa Indonesia Kelas 5";


/* =====================================================
   INTERVAL HEARTBEAT

   Setiap 20 detik.
===================================================== */

const BAHASA_INDONESIA_HEARTBEAT_INTERVAL =
    20000;


/* =====================================================
   BATAS SESI CLIENT

   Maksimal 24 jam.
===================================================== */

const BAHASA_INDONESIA_SESSION_MAX_AGE =
    24 * 60 * 60 * 1000;


/* =====================================================
   KUNCI STORAGE

   Tetap sama dengan sistem identitas
   Petualangan Kelas 5 dan STS utama.

   JANGAN DIUBAH agar session tetap terbaca.
===================================================== */

const BAHASA_INDONESIA_LOGIN_STORAGE_KEY =
    "identitasPetualanganKelas5";


/* =====================================================
   VARIABEL HEARTBEAT
===================================================== */

let bahasaIndonesiaHeartbeatTimer =
    null;


let bahasaIndonesiaLastHeartbeat =
    0;


let bahasaIndonesiaActivityTimer =
    null;


let bahasaIndonesiaSedangLogout =
    false;


let bahasaIndonesiaSedangRedirect =
    false;


/* =====================================================
   BACA DATA LOGIN
===================================================== */

function bahasaIndonesiaGetLoginData() {

    const storages = [

        window.localStorage,

        window.sessionStorage

    ];


    for (
        const storage
        of storages
    ) {

        try {

            const raw =
                storage.getItem(
                    BAHASA_INDONESIA_LOGIN_STORAGE_KEY
                );


            if (!raw) {

                continue;

            }


            const data =
                JSON.parse(
                    raw
                );


            if (
                data &&
                typeof data === "object"
            ) {

                return data;

            }


        } catch (error) {

            console.log(
                "BAHASA_INDONESIA: gagal membaca data login:",
                error
            );

        }

    }


    return null;

}


/* =====================================================
   SIMPAN DATA LOGIN
===================================================== */

function bahasaIndonesiaSaveLoginData(
    data
) {

    if (!data) {

        return;

    }


    try {

        localStorage.setItem(
            BAHASA_INDONESIA_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "BAHASA_INDONESIA: gagal menyimpan localStorage:",
            error
        );

    }


    try {

        sessionStorage.setItem(
            BAHASA_INDONESIA_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "BAHASA_INDONESIA: gagal menyimpan sessionStorage:",
            error
        );

    }

}


/* =====================================================
   HAPUS DATA LOGIN
===================================================== */

function bahasaIndonesiaClearLoginData() {

    try {

        localStorage.removeItem(
            BAHASA_INDONESIA_LOGIN_STORAGE_KEY
        );

    } catch (error) {}


    try {

        sessionStorage.removeItem(
            BAHASA_INDONESIA_LOGIN_STORAGE_KEY
        );

    } catch (error) {}

}


/* =====================================================
   CEK DATA LOGIN LENGKAP
===================================================== */

function bahasaIndonesiaLoginDataIsComplete(
    data
) {

    return Boolean(

        data &&

        data.nama &&

        data.kelas &&

        data.sessionId

    );

}


/* =====================================================
   CEK SESI CLIENT 24 JAM
===================================================== */

function bahasaIndonesiaClientSessionExpired(
    data
) {

    if (
        !data ||
        !data.loginAt
    ) {

        return true;

    }


    const loginTime =
        Number(
            data.loginAt
        );


    if (
        !Number.isFinite(
            loginTime
        )
    ) {

        return true;

    }


    return (

        Date.now() -
        loginTime

    ) >=
        BAHASA_INDONESIA_SESSION_MAX_AGE;

}


/* =====================================================
   TAMPILKAN DATA SISWA
===================================================== */

function bahasaIndonesiaTampilkanDataSiswa(
    data
) {

    if (!data) {

        return;

    }


    const namaElement =
        document.getElementById(
            "namaSiswaLogin"
        );

    const absenElement =

        );

        namaElement.textContent =
            data.nama ||
            "-";

    }


    if (kelasElement) {

        kelasElement.textContent =
            data.kelas ||

    }


    if (absenElement) {

        absenElement.textContent =

            data.absen ||

    }

}


/* =====================================================
   STATUS ONLINE
===================================================== */

function bahasaIndonesiaSetStatusOnline(
    online,
    text
) {

    const statusElement =
        document.getElementById(
            "statusOnline"
        );


    if (!statusElement) {

        return;

    }


    if (online) {

        statusElement.textContent =
            text ||
            "🟢 Online";


        statusElement.classList.remove(
            "offline"
        );


    } else {

        statusElement.textContent =
            text ||
            "🔴 Offline";


        statusElement.classList.add(
            "offline"
        );

    }

}


/* =====================================================
   JSONP REQUEST
===================================================== */

function bahasaIndonesiaRequestJSONP(
    params,
    timeout
) {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "bahasaIndonesiaOnlineCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            let selesai =
                false;


            const script =
                document.createElement(
                    "script"
                );


            const query =
                new URLSearchParams(
                    params || {}
                );


            query.set(
                "callback",
                callbackName
            );


            query.set(
                "t",
                Date.now()
            );


            let timer;


            function cleanup() {

                if (timer) {

                    clearTimeout(
                        timer
                    );

                }


                try {

                    delete window[
                        callbackName
                    ];

                } catch (error) {

                    window[
                        callbackName
                    ] =
                        undefined;

                }


                if (
                    script.parentNode
                ) {

                    script.parentNode.removeChild(
                        script
                    );

                }

            }


            timer =
                setTimeout(
                    function() {

                        if (selesai) {

                            return;

                        }


                        selesai =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "Request JSONP timeout"
                            )
                        );

                    },
                    timeout || 10000
                );


            window[
                callbackName
            ] =
                function(data) {

                    if (selesai) {

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    resolve(
                        data
                    );

                };


            script.onerror =
                function() {

                    if (selesai) {

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "JSONP gagal dimuat"
                        )
                    );

                };


            script.src =
                BAHASA_INDONESIA_API_URL +
                "?" +
                query.toString();


            script.async =
                true;


            document
                .head
                .appendChild(
                    script
                );

        }
    );

}


/* =====================================================
   REDIRECT KE HALAMAN IDENTITAS

   Karena halaman ini berada di:

   /kelas-5/sts/

   maka identitas berada di:

   /kelas-5/identitas.html
===================================================== */

function bahasaIndonesiaRedirectKeIdentitas(
    alasan
) {

    if (
        bahasaIndonesiaSedangRedirect
    ) {

        return;

    }


    bahasaIndonesiaSedangRedirect =
        true;


    clearInterval(
        bahasaIndonesiaHeartbeatTimer
    );


    bahasaIndonesiaHeartbeatTimer =
        null;


    bahasaIndonesiaClearLoginData();


    let url =
        "../../identitas.html";


    if (alasan) {

        url +=
            "?alasan=" +
            encodeURIComponent(
                alasan
            );

    }


    window.location.replace(
        url
    );

}


/* =====================================================
   CEK SESI KE SERVER
===================================================== */

async function bahasaIndonesiaCheckSession() {

    const loginData =
        bahasaIndonesiaGetLoginData();


    /* -------------------------------------------------
       Tidak ada data login
    ------------------------------------------------- */

    if (
        !bahasaIndonesiaLoginDataIsComplete(
            loginData
        )
    ) {

        bahasaIndonesiaRedirectKeIdentitas(
            "login"
        );

        return false;

    }


    /* -------------------------------------------------
       Cek masa sesi 24 jam
    ------------------------------------------------- */

    if (
        bahasaIndonesiaClientSessionExpired(
            loginData
        )
    ) {

        bahasaIndonesiaRedirectKeIdentitas(
            "expired"
        );

        return false;

    }


    try {

        const result =
            await bahasaIndonesiaRequestJSONP(
                {

                    action:
                        "checksession",

                    sessionId:
                        loginData.sessionId

                },
                10000
            );


        console.log(
            "BAHASA_INDONESIA - hasil checksession:",
            result
        );


        /* -------------------------------------------------
           Session tidak valid
        ------------------------------------------------- */

        if (
            !result ||
            result.success !== true ||
            result.loggedIn !== true
        ) {

            bahasaIndonesiaRedirectKeIdentitas(
                "invalid"
            );

            return false;

        }


        /* -------------------------------------------------
           Jika server memberikan session terbaru
        ------------------------------------------------- */

        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            bahasaIndonesiaSaveLoginData(
                updated
            );


            bahasaIndonesiaTampilkanDataSiswa(
                updated
            );

        }


        bahasaIndonesiaSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;


    } catch (error) {

        /*
           Error jaringan sementara tidak
           langsung mengeluarkan siswa.
        */

        console.warn(
            "BAHASA_INDONESIA: cek sesi sementara gagal:",
            error
        );


        bahasaIndonesiaSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;

    }

}


/* =====================================================
   KIRIM HEARTBEAT
===================================================== */

async function bahasaIndonesiaSendHeartbeat() {

    /* -------------------------------------------------
       Jangan kirim ketika redirect
       atau proses logout.
    ------------------------------------------------- */

    if (
        bahasaIndonesiaSedangRedirect ||
        bahasaIndonesiaSedangLogout
    ) {

        return;

    }


    /* -------------------------------------------------
       Ambil data login
    ------------------------------------------------- */

    const loginData =
        bahasaIndonesiaGetLoginData();


    /* -------------------------------------------------
       Pastikan login lengkap
    ------------------------------------------------- */

    if (
        !bahasaIndonesiaLoginDataIsComplete(
            loginData
        )
    ) {

        console.warn(
            "BAHASA_INDONESIA: heartbeat dihentikan karena data login tidak lengkap."
        );


        bahasaIndonesiaRedirectKeIdentitas(
            "login"
        );


        return;

    }


    /* -------------------------------------------------
       Cek sesi 24 jam
    ------------------------------------------------- */

    if (
        bahasaIndonesiaClientSessionExpired(
            loginData
        )
    ) {

        console.warn(
            "BAHASA_INDONESIA: sesi lokal sudah expired."
        );


        bahasaIndonesiaRedirectKeIdentitas(
            "expired"
        );


        return;

    }


    /* -------------------------------------------------
       Hindari heartbeat terlalu rapat

       Minimal 5 detik antar request.
    ------------------------------------------------- */

    const now =
        Date.now();


    if (
        now -
        bahasaIndonesiaLastHeartbeat
        < 5000
    ) {

        return;

    }


    bahasaIndonesiaLastHeartbeat =
        now;


    /* -------------------------------------------------
       Tampilkan status online
    ------------------------------------------------- */

    bahasaIndonesiaSetStatusOnline(
        true,
        "🟢 Online"
    );


    /* =================================================
       DEBUG
    ================================================= */

    console.log(
        "========================================"
    );


    console.log(
        "📡 BAHASA_INDONESIA MENGIRIM HEARTBEAT"
    );


    console.log(
        "🕐 Waktu:",
        new Date()
            .toLocaleTimeString()
    );


    console.log(
        "🆔 Session ID:",
        loginData.sessionId
    );


    console.log(
        "👤 Nama:",
        loginData.nama
    );


    console.log(
        "🏫 Kelas:",
        loginData.kelas
    );


    console.log(
        "🔢 Absen:",
        loginData.nomorAbsen ||
        loginData.absen ||
        "-"
    );


    console.log(
        "📄 Halaman:",
        BAHASA_INDONESIA_HALAMAN_UTAMA
    );


    /* =================================================
       REQUEST HEARTBEAT
    ================================================= */

    try {

        const result =
            await bahasaIndonesiaRequestJSONP(
                {

                    action:
                        "heartbeat",

                    sessionId:
                        loginData.sessionId,

                    nama:
                        loginData.nama,

                    kelas:
                        loginData.kelas,

                    nomorAbsen:
                        loginData.nomorAbsen ||
                        loginData.absen ||
                        "",

                    halaman:
                        BAHASA_INDONESIA_HALAMAN_UTAMA,

                    sumber:
                        "Petualangan Kelas 5"

                },
                10000
            );


        /* =================================================
           DEBUG RESPONS
        ================================================= */

        console.log(
            "📥 RESPONS SERVER BAHASA_INDONESIA:",
            result
        );


        console.log(
            "✅ Success:",
            result &&
            result.success
        );


        console.log(
            "📊 Status:",
            result &&
            result.status
        );


        console.log(
            "📝 Message:",
            result &&
            result.message
        );


        /* =================================================
           CEK SESSION DARI SERVER
        ================================================= */

        if (
            result &&
            result.session
        ) {

            console.log(
                "----------------------------------------"
            );


            console.log(
                "🆔 Session ID SERVER:",
                result.session.sessionId
            );


            console.log(
                "👤 Nama SERVER:",
                result.session.nama
            );


            console.log(
                "🏫 Kelas SERVER:",
                result.session.kelas
            );


            console.log(
                "🔢 Absen SERVER:",
                result.session.nomorAbsen
            );


            console.log(
                "📄 Halaman SERVER:",
                result.session.halaman
            );


            console.log(
                "🕐 Login At SERVER:",
                result.session.loginAt
            );


            console.log(
                "🕐 Last Seen SERVER:",
                result.session.lastSeen
            );


            console.log(
                "🟢 Status SERVER:",
                result.session.status
            );


            console.log(
                "----------------------------------------"
            );

        }


        /* =================================================
           CEK HASIL HEARTBEAT
        ================================================= */

        if (
            !result ||
            result.success !== true
        ) {

            const status =
                String(
                    (
                        result &&
                        result.status
                    ) ||
                    ""
                ).toLowerCase();


            console.warn(
                "BAHASA_INDONESIA: heartbeat tidak berhasil.",
                result
            );


            /* ---------------------------------------------
               Session benar-benar invalid
            --------------------------------------------- */

            if (

                status ===
                    "expired"

                ||

                status ===
                    "not_logged_in"

                ||

                status ===
                    "invalid_session"

            ) {

                console.error(
                    "🚨 BAHASA_INDONESIA: SESSION TIDAK VALID / EXPIRED"
                );


                bahasaIndonesiaRedirectKeIdentitas(
                    "expired"
                );


                return;

            }


            /*
               Error lain tidak langsung
               menghapus sesi.
            */

            bahasaIndonesiaSetStatusOnline(
                true,
                "🟢 Online"
            );


            return;

        }


        /* =================================================
           SIMPAN DATA SESSION TERBARU
        ================================================= */

        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            console.log(
                "🔍 SESSION ID SEBELUM:",
                loginData.sessionId
            );


            console.log(
                "🔍 SESSION ID SESUDAH:",
                updated.sessionId
            );


            if (
                loginData.sessionId !==
                updated.sessionId
            ) {

                console.warn(
                    "⚠️ PERINGATAN: SESSION ID BERUBAH!"
                );

            } else {

                console.log(
                    "✅ Session ID tetap sama."
                );

            }


            bahasaIndonesiaSaveLoginData(
                updated
            );


            bahasaIndonesiaTampilkanDataSiswa(
                updated
            );

        }


        /* =================================================
           STATUS ONLINE
        ================================================= */

        bahasaIndonesiaSetStatusOnline(
            true,
            "🟢 Online"
        );


        /* =================================================
           LOG BERHASIL
        ================================================= */

        console.log(
            "🟢 BAHASA_INDONESIA ONLINE:",
            new Date()
                .toLocaleTimeString()
        );


        console.log(
            "========================================"
        );


    } catch (error) {

        /*
           Internet/API sementara gagal.
           Jangan logout.
        */

        console.warn(
            "BAHASA_INDONESIA: heartbeat gagal sementara:",
            error
        );


        bahasaIndonesiaSetStatusOnline(
            true,
            "🟢 Online"
        );


        console.log(
            "Heartbeat berikutnya akan mencoba kembali."
        );


        console.log(
            "========================================"
        );

    }

}


/* =====================================================
   HEARTBEAT BERKALA
===================================================== */

function bahasaIndonesiaStartHeartbeat() {

    if (
        bahasaIndonesiaHeartbeatTimer
    ) {

        clearInterval(
            bahasaIndonesiaHeartbeatTimer
        );

    }


    /*
       Reset penanda heartbeat
       agar heartbeat pertama langsung dikirim.
    */

    bahasaIndonesiaLastHeartbeat =
        0;


    /*
       Kirim heartbeat langsung.
    */

    bahasaIndonesiaSendHeartbeat();


    /*
       Selanjutnya setiap 20 detik.
    */

    bahasaIndonesiaHeartbeatTimer =
        setInterval(
            function() {

                bahasaIndonesiaSendHeartbeat();

            },
            BAHASA_INDONESIA_HEARTBEAT_INTERVAL
        );

}


/* =====================================================
   AKTIVITAS SISWA
===================================================== */

function bahasaIndonesiaRegisterActivity() {

    clearTimeout(
        bahasaIndonesiaActivityTimer
    );


    bahasaIndonesiaActivityTimer =
        setTimeout(
            function() {

                bahasaIndonesiaSendHeartbeat();

            },
            300
        );

}


/* =====================================================
   EVENT AKTIVITAS SISWA
===================================================== */

const bahasaIndonesiaActivityEvents = [

    "click",

    "keydown",

    "scroll",

    "touchstart",

    "pointerdown"

];


bahasaIndonesiaActivityEvents.forEach(
    function(eventName) {

        document.addEventListener(
            eventName,
            bahasaIndonesiaRegisterActivity,
            {
                passive:
                    true
            }
        );

    }
);


/* =====================================================
   TAB KEMBALI AKTIF
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            bahasaIndonesiaSendHeartbeat();

        }

    }
);


/* =====================================================
   WINDOW KEMBALI AKTIF
===================================================== */

window.addEventListener(
    "focus",
    function() {

        bahasaIndonesiaSendHeartbeat();

    }
);


/* =====================================================
   SAAT HALAMAN DITINGGALKAN

   Tidak mengirim logout.

   Tujuannya agar perpindahan:

   STS utama
       ↓
   BAHASA_INDONESIA
       ↓
   Mata pelajaran

   tetap menggunakan session yang sama.
===================================================== */

window.addEventListener(
    "pagehide",
    function() {

        clearInterval(
            bahasaIndonesiaHeartbeatTimer
        );


        bahasaIndonesiaHeartbeatTimer =
            null;


        clearTimeout(
            bahasaIndonesiaActivityTimer
        );


        bahasaIndonesiaActivityTimer =
            null;

    }
);


/* =====================================================
   PROTEKSI NAVIGASI

   Menu tetap hanya dapat dibuka
   jika siswa mempunyai session valid.
===================================================== */

function bahasaIndonesiaProtectNavigation() {

    /* =================================================
       TOMBOL MATA PELAJARAN
    ================================================= */

    document
        .querySelectorAll(
            ".menu-button"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        const loginData =
                            bahasaIndonesiaGetLoginData();


                        /* ---------------------------------
                           Belum login
                        --------------------------------- */

                        if (
                            !bahasaIndonesiaLoginDataIsComplete(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            bahasaIndonesiaRedirectKeIdentitas(
                                "login"
                            );


                            return;

                        }


                        /* ---------------------------------
                           Session lokal expired
                        --------------------------------- */

                        if (
                            bahasaIndonesiaClientSessionExpired(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            bahasaIndonesiaRedirectKeIdentitas(
                                "expired"
                            );


                            return;

                        }


                        /*
                           Kirim heartbeat sebelum
                           siswa berpindah halaman.
                        */

                        bahasaIndonesiaSendHeartbeat();

                    }
                );

            }
        );


    /* =================================================
       NAVBAR
    ================================================= */

    document
        .querySelectorAll(
            ".nav a, nav a"
        )
        .forEach(
            function(link) {

                link.addEventListener(
                    "click",
                    function(event) {

                        const loginData =
                            bahasaIndonesiaGetLoginData();


                        if (
                            !bahasaIndonesiaLoginDataIsComplete(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            bahasaIndonesiaRedirectKeIdentitas(
                                "login"
                            );


                            return;

                        }


                        if (
                            bahasaIndonesiaClientSessionExpired(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            bahasaIndonesiaRedirectKeIdentitas(
                                "expired"
                            );


                            return;

                        }


                        bahasaIndonesiaSendHeartbeat();

                    }
                );

            }
        );


    /* =================================================
       TOMBOL KEMBALI
    ================================================= */

    const backButton =
        document.querySelector(
            ".back-button"
        );


    if (backButton) {

        backButton.addEventListener(
            "click",
            function(event) {

                const loginData =
                    bahasaIndonesiaGetLoginData();


                if (
                    !bahasaIndonesiaLoginDataIsComplete(
                        loginData
                    )
                ) {

                    event.preventDefault();


                    bahasaIndonesiaRedirectKeIdentitas(
                        "login"
                    );


                    return;

                }


                if (
                    bahasaIndonesiaClientSessionExpired(
                        loginData
                    )
                ) {

                    event.preventDefault();


                    bahasaIndonesiaRedirectKeIdentitas(
                        "expired"
                    );


                    return;

                }


                bahasaIndonesiaSendHeartbeat();

            }
        );

    }

}


/* =====================================================
   INISIALISASI SISTEM ONLINE BAHASA_INDONESIA
===================================================== */

async function bahasaIndonesiaInitializeOnline() {

    console.log(
        "🚀 Sistem online BAHASA_INDONESIA dimulai."
    );


    /* -------------------------------------------------
       Ambil data login
    ------------------------------------------------- */

    const loginData =
        bahasaIndonesiaGetLoginData();


    /* -------------------------------------------------
       Pastikan siswa sudah login
    ------------------------------------------------- */

    if (
        !bahasaIndonesiaLoginDataIsComplete(
            loginData
        )
    ) {

        bahasaIndonesiaRedirectKeIdentitas(
            "login"
        );


        return;

    }


    /* -------------------------------------------------
       Tampilkan data siswa
       sebelum server selesai diperiksa.
    ------------------------------------------------- */

    bahasaIndonesiaTampilkanDataSiswa(
        loginData
    );


    /* -------------------------------------------------
       Cek masa sesi lokal
    ------------------------------------------------- */

    if (
        bahasaIndonesiaClientSessionExpired(
            loginData
        )
    ) {

        bahasaIndonesiaRedirectKeIdentitas(
            "expired"
        );


        return;

    }


    /* -------------------------------------------------
       Periksa session ke server
    ------------------------------------------------- */

    const valid =
        await bahasaIndonesiaCheckSession();


    if (!valid) {

        return;

    }


    const sessionAktif =
        bahasaIndonesiaGetLoginData();


    if (
        !bahasaIndonesiaLoginDataIsComplete(
            sessionAktif
        )
    ) {

        bahasaIndonesiaRedirectKeIdentitas(
            "login"
        );

        return;

    }


    /* -------------------------------------------------
       Mulai kuis
    ------------------------------------------------- */

    mulaiKuisDariSession(
        sessionAktif
    );


    /* -------------------------------------------------
       Mulai heartbeat
    ------------------------------------------------- */

    bahasaIndonesiaStartHeartbeat();


    /* -------------------------------------------------
       Proteksi navigasi
    ------------------------------------------------- */

    bahasaIndonesiaProtectNavigation();


    /* -------------------------------------------------
       Console
    ------------------------------------------------- */

    console.log(
        "🟢 BAHASA_INDONESIA aktif dan sedang dibaca online oleh server."
    );


    console.log(
        "📄 Halaman online:",
        BAHASA_INDONESIA_HALAMAN_UTAMA
    );


    console.log(
        "⏱️ Heartbeat:",
        BAHASA_INDONESIA_HEARTBEAT_INTERVAL /
        1000,
        "detik"
    );


    console.log(
        "⏳ Maksimum sesi:",
        BAHASA_INDONESIA_SESSION_MAX_AGE /
        (60 * 60 * 1000),
        "jam"
    );

}
