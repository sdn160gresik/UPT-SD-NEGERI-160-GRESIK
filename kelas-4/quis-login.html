.options{

.option{

<script>

/* =========================================================

   ========================================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwk4odfq7ABr__CDR00YD4uAMLmvK2iPjaLLlJrpyA6BnOwJ9gUkncLdCVCzE670CFy/exec";


/* =========================================================

const bankSoal = [

{

    jawaban:[

},

{
    soal:"Urutkan bilangan <b>98.100, 98.010, 98.001</b> dari yang terkecil ke terbesar.",
    jawaban:[
        "98.001, 98.010, 98.100",
        "98.010, 98.001, 98.100",
        "98.100, 98.010, 98.001",
        "98.001, 98.100, 98.010"
    ],
    benar:0
},

{
    soal:"Urutkan bilangan <b>45.900, 45.090, 45.009</b> dari yang terkecil ke terbesar.",
    jawaban:[
        "45.009, 45.090, 45.900",
        "45.090, 45.009, 45.900",
        "45.900, 45.090, 45.009",
        "45.009, 45.900, 45.090"

    soal:"Perpustakaan sekolah memiliki <b>24.560</b> buku, sedangkan perpustakaan desa memiliki <b>23.950</b> buku. Perpustakaan manakah yang memiliki buku lebih banyak?",
    jawaban:[
        "Perpustakaan sekolah, karena 24.560 &gt; 23.950",
        "Perpustakaan desa, karena 23.950 &gt; 24.560",
        "Keduanya memiliki jumlah buku yang sama",

    ],

},

    jawaban:[
        "Pak Budi, selisih Rp18.000",
        "Pak Andi, selisih Rp18.000",
        "Pak Budi, selisih Rp12.000",
        "Pak Andi, selisih Rp12.000"

},

{

    jawaban:[
        "Merah → Hijau → Biru",
        "Hijau → Merah → Biru",
        "Biru → Merah → Hijau",
        "Merah → Biru → Hijau"
    ],
    benar:0
},

{
    soal:"Toko A menjual <b>45.750</b> pensil, Toko B menjual <b>54.570</b> pensil, dan Toko C menjual <b>45.705</b> pensil. Toko mana yang menjual pensil paling banyak?",
    jawaban:[
        "Toko A",
        "Toko B",
        "Toko C",
        "Semua sama banyak"
    ],
    benar:1
},

{
    soal:"Toko A menjual <b>45.750</b> pensil, Toko B menjual <b>54.570</b> pensil, dan Toko C menjual <b>45.705</b> pensil. Urutkan jumlah pensil dari yang paling sedikit ke paling banyak.",
    jawaban:[
        "45.705 → 45.750 → 54.570",
        "45.750 → 45.705 → 54.570",
        "54.570 → 45.750 → 45.705",
        "45.705 → 54.570 → 45.750"
    ],
    benar:0
}

];


/* =========================================================
   VARIABEL
   ========================================================= */

let soalAktif = [];
let nomor = 0;
let skorBenar = 0;
let jawabanDipilih = null;

let dataSiswa = {
    nama:"",
    kelas:"",
    absen:""
};


/* =========================================================
   ACAK ARRAY
   ========================================================= */

function acak(array){

    const hasil = [...array];

    for(let i = hasil.length - 1; i > 0; i--){

        const j =
            Math.floor(Math.random() * (i + 1));

        [hasil[i], hasil[j]] =
        [hasil[j], hasil[i]];
    }

    return hasil;
}


/* =========================================================
   MULAI KUIS
   ========================================================= */

function mulai(){

    const nama =
        document.getElementById("nama").value.trim();

    const kelas =
        document.getElementById("kelas").value.trim();

    const absen =
        document.getElementById("absen").value.trim();

    if(!nama || !kelas || !absen){

        alert("⚠️ Silakan lengkapi nama, kelas, dan nomor absen terlebih dahulu.");

        return;
    }

    dataSiswa = {
        nama:nama,
        kelas:kelas,
        absen:absen
    };

    soalAktif = acak(bankSoal);

    nomor = 0;
    skorBenar = 0;
    jawabanDipilih = null;

    document.getElementById("identitas").style.display = "none";

    document.getElementById("hasil").style.display = "none";

    document.getElementById("kuis").style.display = "block";

    tampilkanSoal();
}


/* =========================================================
   TAMPILKAN SOAL
   ========================================================= */

function tampilkanSoal(){

    const soal =
        soalAktif[nomor];

    jawabanDipilih = null;

    document.getElementById("nomorSoal").textContent =
        `Soal ${nomor + 1} dari ${soalAktif.length}`;

    document.getElementById("progressBar").style.width =
        `${((nomor + 1) / soalAktif.length) * 100}%`;

    document.getElementById("pertanyaan").innerHTML =
        soal.soal;

    const pilihan =
        document.getElementById("pilihan");

    pilihan.innerHTML = "";

    const pilihanAcak =
        acak(
            soal.jawaban.map(
                (teks,index)=>({
                    teks:teks,
                    index:index
                })
            )
        );

    pilihanAcak.forEach(item=>{

        const div =
            document.createElement("div");

        div.className = "option";

        div.innerHTML = item.teks;

        div.onclick = function(){

            document
                .querySelectorAll(".option")
                .forEach(el =>
                    el.classList.remove("selected")
                );

            div.classList.add("selected");

            jawabanDipilih = item.index;

            document.getElementById("infoJawaban").textContent =
                "Jawaban dipilih ✓";
        };

        pilihan.appendChild(div);

    });

    const tombol =
        document.getElementById("btnBerikutnya");

    if(nomor === soalAktif.length - 1){

        tombol.textContent =
            "🏁 Selesai";

    }else{

        tombol.textContent =
            "Berikutnya →";
    }

    document.getElementById("infoJawaban").textContent =
        "Pilih salah satu jawaban.";

}


/* =========================================================
   BERIKUTNYA
   ========================================================= */

function berikutnya(){

    if(jawabanDipilih === null){

        alert("⚠️ Pilih jawaban terlebih dahulu.");

        return;
    }

    const soal =
        soalAktif[nomor];

    if(jawabanDipilih === soal.benar){

        skorBenar++;

    }

    nomor++;

    if(nomor < soalAktif.length){

        tampilkanSoal();

    }else{

        selesai();

    }
}


/* =========================================================
   SELESAI
   ========================================================= */

function selesai(){

    const total =
        soalAktif.length;

    const nilai =
        Math.round(
            (skorBenar / total) * 100
        );

    document.getElementById("kuis").style.display =
        "none";

    document.getElementById("hasil").style.display =
        "block";

    document.getElementById("namaHasil").textContent =
        `Hebat, ${dataSiswa.nama}! 🍽️`;

    document.getElementById("nilai").textContent =
        nilai;

    document.getElementById("detailNilai").textContent =
        `${skorBenar} jawaban benar dari ${total} soal`;

    let pesan = "";

    if(nilai >= 90){

        pesan =
        "🌟 Luar biasa! Racikan bilanganmu sangat mantap. Kamu sudah sangat baik dalam membandingkan dan mengurutkan bilangan!";

    }else if(nilai >= 80){

        pesan =
        "👏 Bagus sekali! Pemahamanmu tentang bilangan sudah baik. Terus berlatih agar semakin jago!";

    }else if(nilai >= 70){

        pesan =
        "😊 Cukup baik! Kamu sudah mulai menguasai materi. Yuk latihan lagi supaya hasilnya semakin mantap!";

    }else{

        pesan =
        "💪 Jangan menyerah! Ayo pelajari kembali cara membandingkan dan mengurutkan bilangan, kemudian coba lagi.";

    }

    document.getElementById("pesanHasil").textContent =
        pesan;


    /* ================================================
       KIRIM HASIL KE GOOGLE SHEETS
       TANPA MENAMPILKAN REKAP DI HALAMAN
       ================================================ */

    const hasilBaru = {

        nama:dataSiswa.nama,

        kelas:dataSiswa.kelas,

        absen:dataSiswa.absen,

        benar:skorBenar,

        total:total,

        nilai:nilai,

        waktu:new Date().toLocaleString("id-ID")

    };

    kirimKeGoogleSheets(hasilBaru);

}


/* =========================================================
   KIRIM KE GOOGLE SHEETS
   ========================================================= */

function kirimKeGoogleSheets(data){

    try{

        const params =
            new URLSearchParams({

                nama:data.nama,

                kelas:data.kelas,

                absen:data.absen,

                benar:data.benar,

                total:data.total,

                nilai:data.nilai,

                waktu:data.waktu

            });

        const img =
            new Image();

        img.src =
            GOOGLE_SCRIPT_URL +
            "?" +
            params.toString();

    }catch(error){

        console.error(
            "Gagal mengirim hasil:",
            error
        );

    }

}
