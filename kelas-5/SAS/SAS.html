<title>Menu Pilihan Mata Pelajaran | UPT SD Negeri 160 Gresik</title>
<style>
  :root {
    --gold: #ffd86a;
    --focus: #fff5a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #123d35;
    font-family: "Trebuchet MS", Arial, sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }
  .stage {
    position: relative;
    width: min(100vw, 177.683vw);
    max-width: 1440px;
    aspect-ratio: 1672 / 941;
    margin: 0 auto;
    isolation: isolate;
    overflow: hidden;
    background: #73c8f3;
    box-shadow: 0 18px 60px rgba(0,0,0,.35);
  }
  .scene {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    user-select: none;
    -webkit-user-drag: none;
  }
  .hotspot {
    position: absolute;
    display: block;
    border: 2px solid transparent;
    border-radius: 22%;
    text-decoration: none;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    transform-origin: center;
  }
  .hotspot:hover {
    transform: scale(1.035) translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 0 0 3px rgba(255,245,168,.95),
                0 0 22px 9px rgba(255,222,93,.72),
                0 12px 18px rgba(0,0,0,.24);
    z-index: 5;
  }
  .hotspot:active {
    transform: scale(.975) translateY(3px);
    filter: brightness(1.12);
  }
  .hotspot:focus-visible {
    border: 4px solid var(--focus);
    box-shadow: 0 0 0 5px rgba(13,65,85,.85),
                0 0 25px 10px rgba(255,229,112,.9);
    z-index: 6;
  }
  .hotspot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    opacity: 0;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.32), transparent 65%);
    transition: opacity .18s ease;
    pointer-events: none;
  }
  .hotspot:hover::after { opacity: 1; }
  /* Area klik disesuaikan dengan posisi buku SAS 1 dan SAS 2 pada gambar baru. */
  .sas1 { left: 18.0%; top: 47.0%; width: 28.5%; height: 40.0%; }
  .sas2 { left: 51.5%; top: 47.0%; width: 28.5%; height: 40.0%; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 20;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px;
    color: #fff;
    background: rgba(10,43,39,.82);
    font-size: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.2);
    pointer-events: none;
    opacity: .92;
    white-space: nowrap;
  }
  @media (max-width: 700px) {
    body { align-items: flex-start; }
    .stage { width: 100vw; }
    .hotspot { border-radius: 20%; }
    .hint { bottom: 6px; font-size: 10px; padding: 6px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
