let dataNama = "";

let dataKelas = "";

let dataAbsen = "";

let indeks = 0;

let benar = 0;


/* =========================================================
   MULAI KUIS DARI SESSION ONLINE
========================================================= */

function mulaiKuisDariSession(data) {

    if (
        !data ||
        !data.nama ||
        !data.kelas ||
        !data.sessionId
    ) {

        return;

    }


    dataNama =
        data.nama || "";


    dataKelas =
        data.kelas || "";


    dataAbsen =
        data.nomorAbsen ||
        data.absen ||
        "";


    indeks = 0;

    benar = 0;

    pancasilaNilaiSudahDikirim = false;

    pancasilaPengirimanNilaiSedangBerjalan = false;


    const loading =
        document.getElementById(
            "onlineLoading"
        );


    if (loading) {

        loading.classList.add(
            "hidden"
        );

    }


    document
        .getElementById("areaKuis")
        .classList
        .remove("hidden");


    acakArray(soal);


    soal.forEach(
        s => {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}

/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    let gabung =

        s.a.map(
            (teks, i) => ({

                teks:
                    teks,

                benar:
                    i === s.k

            })
        );


    for (
        let i = gabung.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            gabung[i],
            gabung[j]
        ] = [

            gabung[j],
            gabung[i]

        ];

    }


    s.a =

        gabung.map(
            o =>
                o.teks
        );


    s.k =

        gabung.findIndex(
            o =>
                o.benar
        );

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal() {

    const quiz =
        document
            .getElementById("quiz");

    ===================================================== */

        indeks >=
        soal.length
    ) {

                    soal.length) *

        /* =====================================================

           Nilai tidak lagi dikirim ke Google Form.

           action "submitScore".
        ===================================================== */

        simpanNilaiKeServer(

            dataAbsen,

            nilai,

            benar,

            soal.length

        );


        let kelasWarna =

        if (

        ) {

            kelasWarna =

        }

        else if (

        ) {

            kelasWarna =

        }


        quiz.innerHTML = `

                </button>

                <button
                    onclick="keluarKuis()"

                </button>

        return;

    }


    const s =

    quiz.innerHTML = `

/* =========================================================
   PERIKSA JAWABAN
========================================================= */

function periksaJawaban() {

    const jawaban =

        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if (!jawaban) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(

            "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +

            "Ayo pilih salah satu jawaban terlebih dahulu " +

            "sebelum lanjut ke soal berikutnya! 💡"

        );


        return;

    }


    if (

        parseInt(
            jawaban.value
        ) ===

        soal[indeks].k

    ) {

        benar++;

    }


    indeks++;


    mainkanSuaraNext();


    tampilkanSoal();

}

    document
        .getElementById("peringatanArea")
        .innerHTML = "";

}


/* =========================================================
   SIMPAN NILAI KE SERVER / DATABASE

   Google Form DIHAPUS.

   Nilai dikirim ke endpoint API yang sama dengan
   sistem session/heartbeat siswa.

   PENTING:
   Endpoint Apps Script yang digunakan harus mengenali
   action = "submitScore" dan menulis payload ke
   database/Google Sheet yang digunakan oleh sistem server.
========================================================= */

const PANCASILA_SCORE_ACTION =
    "submitScore";


let pancasilaNilaiSudahDikirim =
    false;


let pancasilaPengirimanNilaiSedangBerjalan =
    false;


/* =========================================================
   FUNGSI SIMPAN NILAI
========================================================= */

async function simpanNilaiKeServer(

    nama,
    kelas,
    absen,
    nilai,
    jumlahBenar,
    totalSoal

){

    /* -------------------------------------------------
       Jangan menyimpan dua kali pada satu pengerjaan.
    ------------------------------------------------- */

    if(
        pancasilaNilaiSudahDikirim ||
        pancasilaPengirimanNilaiSedangBerjalan
    ){

        return {
            success: true,
            duplicate: true
        };

    }


    pancasilaPengirimanNilaiSedangBerjalan =
        true;


    const loginData =
        pancasilaGetLoginData();


    const sessionId =
        loginData &&
        loginData.sessionId
            ? loginData.sessionId
            : "";


    const nilaiAman =
        Math.max(
            0,
            Math.min(
                100,
                Number(nilai) || 0
            )
        );


    const benarAman =
        Math.max(
            0,
            Number(jumlahBenar) || 0
        );


    const totalAman =
        Math.max(
            0,
            Number(totalSoal) || 0
        );


    const persentase =
        totalAman > 0
            ? Number(
                (
                    benarAman /
                    totalAman *
                    100
                ).toFixed(2)
            )
            : nilaiAman;


    const payload = {

        action:
            PANCASILA_SCORE_ACTION,

        sessionId:
            sessionId,

        nama:
            nama ||
            (loginData && loginData.nama) ||
            "",

        kelas:
            kelas ||
            (loginData && loginData.kelas) ||
            "",

        nomorAbsen:
            absen ||
            (loginData && (
                loginData.nomorAbsen ||
                loginData.absen
            )) ||
            "",

        absen:
            absen ||
            (loginData && (
                loginData.absen ||
                loginData.nomorAbsen
            )) ||
            "",

        namaKuis:
            "Soal Latihan 1 STS 1 Pancasila Kelas 5",

        quizName:
            "Soal Latihan 1 STS 1 Pancasila Kelas 5",

        nilai:
            nilaiAman,

        skor:
            nilaiAman,

        score:
            nilaiAman,

        benar:
            benarAman,

        jumlahBenar:
            benarAman,

        totalSoal:
            totalAman,

        jumlahSoal:
            totalAman,

        persentase:
            persentase,

        percentage:
            persentase,

        halaman:
            PANCASILA_HALAMAN_UTAMA,

        sumber:
            "Petualangan Kelas 5",

        waktu:
            new Date().toISOString(),

        timestamp:
            Date.now(),

        jenis:
            "hasil_kuis"

    };


    console.log(
        "========================================"
    );


    console.log(
        "📤 MENGIRIM NILAI KE SERVER"
    );


    console.log(
        "🆔 Session ID:",
        payload.sessionId
    );


    console.log(
        "👤 Nama:",
        payload.nama
    );


    console.log(
        "🏫 Kelas:",
        payload.kelas
    );


    console.log(
        "🔢 Absen:",
        payload.nomorAbsen
    );


    console.log(
        "📝 Kuis:",
        payload.namaKuis
    );


    console.log(
        "🎯 Nilai:",
        payload.nilai
    );


    console.log(
        "✅ Benar:",
        payload.benar,
        "/",
        payload.totalSoal
    );


    try{

        const result =
            await pancasilaRequestJSONP(
                payload,
                15000
            );


        console.log(
            "📥 RESPONS SERVER NILAI:",
            result
        );


        if(
            result &&
            result.success === true
        ){

            pancasilaNilaiSudahDikirim =
                true;


            console.log(
                "✅ NILAI BERHASIL DISIMPAN DI SERVER / DATABASE"
            );


            pancasilaTampilkanStatusPenyimpananNilai(
                true,
                result.message ||
                "Nilai berhasil tersimpan di server."
            );


            return result;

        }


        const message =
            result &&
            result.message
                ? result.message
                : "Server belum mengonfirmasi penyimpanan nilai.";


        console.warn(
            "⚠️ NILAI BELUM DIKONFIRMASI SERVER:",
            result
        );


        pancasilaTampilkanStatusPenyimpananNilai(
            false,
            message
        );


        return result || {
            success: false,
            message: message
        };

    }catch(error){

            "❌ GAGAL MENGIRIM NILAI KE SERVER:",

        );

        };

}

/* =====================================================
   SISTEM ONLINE SISWA - Pancasila
     
   Mengikuti sistem online pada halaman
   STS utama dan Petualangan Kelas 5.
     
   Fungsi:
   - Membaca identitas siswa
   - Memeriksa sessionId
   - Cek sesi server
   - Batas sesi client 24 jam
   - Heartbeat setiap 20 detik
   - Heartbeat saat aktivitas
   - Heartbeat saat tab aktif kembali
   - Status online
   - Proteksi navigasi
===================================================== */


/* =====================================================
   KONFIGURASI API
===================================================== */

const PANCASILA_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec"; 
 
 
/* ===================================================== 
   NAMA HALAMAN 
      
   Siswa akan tercatat sedang berada 
   pada halaman Pancasila. 
===================================================== */ 
 
const PANCASILA_HALAMAN_UTAMA = 
    "STS 1 - Pancasila"; 
 
 
/* ===================================================== 
   INTERVAL HEARTBEAT 
      
   Setiap 20 detik. 
===================================================== */ 
 
const PANCASILA_HEARTBEAT_INTERVAL = 
    20000; 
 
 
/* ===================================================== 
   BATAS SESI CLIENT 
      
   Maksimal 24 jam. 
===================================================== */ 
 
const PANCASILA_SESSION_MAX_AGE = 
    24 * 60 * 60 * 1000; 
 
 
/* ===================================================== 
   KUNCI STORAGE 
      
   Sama dengan Petualangan Kelas 5 
   dan STS utama. 
===================================================== */ 
 
const PANCASILA_LOGIN_STORAGE_KEY = 
    "identitasPetualanganKelas5"; 
 
 
/* ===================================================== 
   VARIABEL HEARTBEAT 
===================================================== */ 
 
let pancasilaHeartbeatTimer = 
    null; 
 
 
let pancasilaLastHeartbeat = 
    0; 
 
 
let pancasilaActivityTimer = 
    null; 
 
 
let pancasilaSedangLogout = 
    false; 
 
 
let pancasilaSedangRedirect = 
    false; 
 
 
/* ===================================================== 
   BACA DATA LOGIN 
===================================================== */ 
 
function pancasilaGetLoginData(){ 
 
    const storages = [ 
 
        window.localStorage, 
 
        window.sessionStorage 
 
    ]; 
 
 
    for( 
        const storage 
        of storages 
    ){ 
 
        try{ 
 
            const raw = 
                storage.getItem( 
                    PANCASILA_LOGIN_STORAGE_KEY 
                ); 
 
 
            if( 
                !raw 
            ){ 
 
                continue; 
 
            } 
 
 
            const data = 
                JSON.parse( 
                    raw 
                ); 
 
 
            if( 
                data && 
                typeof data === "object" 
            ){ 
 
                return data; 
 
            } 
 
        }catch(error){ 
 
            console.log( 
                "Pancasila: gagal membaca data login:", 
                error 
            ); 
 
        } 
 
    } 
 
 
    return null; 
 
} 
 
 
/* ===================================================== 
   SIMPAN DATA LOGIN 
===================================================== */ 
 
function pancasilaSaveLoginData( 
    data 
){ 
 
    if( 
        !data 
    ){ 
 
        return; 
 
    } 
 
 
    try{ 
 
        localStorage.setItem( 
            PANCASILA_LOGIN_STORAGE_KEY, 
            JSON.stringify(data) 
        ); 
 
    }catch(error){ 
 
        console.log( 
            "Pancasila: gagal menyimpan localStorage:", 
            error 
        ); 
 
    } 
 
 
    try{ 
 
        sessionStorage.setItem( 
            PANCASILA_LOGIN_STORAGE_KEY, 
            JSON.stringify(data) 
        ); 
 
    }catch(error){ 
 
        console.log( 
            "Pancasila: gagal menyimpan sessionStorage:", 
            error 
        ); 
 
    } 
 
} 
 
 
/* ===================================================== 
   HAPUS DATA LOGIN 
===================================================== */ 
 
function pancasilaClearLoginData(){ 
 
    try{ 
 
        localStorage.removeItem( 
            PANCASILA_LOGIN_STORAGE_KEY 
        ); 
 
    }catch(error){} 
 
 
    try{ 
 
        sessionStorage.removeItem( 
            PANCASILA_LOGIN_STORAGE_KEY 
        ); 
 
    }catch(error){} 
 
} 
 
 
/* ===================================================== 
   CEK DATA LOGIN LENGKAP 
===================================================== */ 
 
function pancasilaLoginDataIsComplete( 
    data 
){ 
 
    return Boolean( 
 
        data && 
 
        data.nama && 
 
        data.kelas && 
 
        data.sessionId 
 
    ); 
 
} 
 
 
/* ===================================================== 
   CEK SESI CLIENT 24 JAM 
===================================================== */ 
 
function pancasilaClientSessionExpired( 
    data 
){ 
 
    if( 
        !data || 
        !data.loginAt 
    ){ 
 
        return true; 
 
    } 
 
 
    const loginTime = 
        Number( 
            data.loginAt 
        ); 
 
 
    if( 
        !Number.isFinite( 
            loginTime 
        ) 
    ){ 
 
        return true; 
 
    } 
 
 
    return ( 
 
        Date.now() - 
        loginTime 
 
    ) >= 
        PANCASILA_SESSION_MAX_AGE; 
 
} 
 
 
/* ===================================================== 
   TAMPILKAN DATA SISWA 
===================================================== */ 
 
function pancasilaTampilkanDataSiswa( 
    data 
){ 
 
    if( 
        !data 
    ){ 
 
        return; 
 
    } 
 
 
    const namaElement = 
        document.getElementById( 
            "namaSiswaLogin" 
        ); 
 
 
    const kelasElement = 
        document.getElementById( 
            "kelasSiswaLogin" 
        ); 
 
 
    const absenElement = 
        document.getElementById( 
            "absenSiswaLogin" 
        ); 
 
 
    if( 
        namaElement 
    ){ 
 
        namaElement.textContent = 
            data.nama || 
            "-"; 
 
    } 
 
 
    if( 
        kelasElement 
    ){ 
 
        kelasElement.textContent = 
            data.kelas || 
            "-"; 
 
    } 
 
 
    if( 
        absenElement 
    ){ 
 
        absenElement.textContent = 
            data.nomorAbsen || 
            data.absen || 
            "-"; 
 
    } 
 
} 
 
 
/* ===================================================== 
   STATUS ONLINE 
===================================================== */ 
 
function pancasilaSetStatusOnline( 
    online, 
    text 
){ 
 
    const statusElement = 
        document.getElementById( 
            "statusOnline" 
        ); 
 
 
    if( 
        !statusElement 
    ){ 
 
        return; 
 
    } 
 
 
    if( 
        online 
    ){ 
 
        statusElement.textContent = 
            text || 
            "🟢 Online"; 
 
 
        statusElement.classList.remove( 
            "offline" 
        ); 
 
    }else{ 
 
        statusElement.textContent = 
            text || 
            "🔴 Offline"; 
 
 
        statusElement.classList.add( 
            "offline" 
        ); 
 
    } 
 
} 
 
 
/* ===================================================== 
   JSONP REQUEST 
===================================================== */ 
 
function pancasilaRequestJSONP( 
    params, 
    timeout 
){ 
 
    return new Promise( 
        function(resolve, reject){ 
 
            const callbackName = 
                "pancasilaOnlineCallback_" + 
                Date.now() + 
                "_" + 
                Math.random() 
                    .toString(36) 
                    .substring(2,8); 
 
 
            let selesai = 
                false; 
 
 
            const script = 
                document.createElement( 
                    "script" 
                ); 
 
 
            const query = 
                new URLSearchParams( 
                    params 
                ); 
 
 
            query.set( 
                "callback", 
                callbackName 
            ); 
 
 
            query.set( 
                "t", 
                Date.now() 
            ); 
 
 
            const timer = 
                setTimeout( 
                    function(){ 
 
                        if( 
                            selesai 
                        ){ 
 
                            return; 
 
                        } 
 
 
                        selesai = 
                            true; 
 
 
                        cleanup(); 
 
 
                        reject( 
                            new Error( 
                                "Request JSONP timeout" 
                            ) 
                        ); 
 
                    }, 
                    timeout || 10000 
                ); 
 
 
            function cleanup(){ 
 
                clearTimeout( 
                    timer 
                ); 
 
 
                try{ 
 
                    delete window[ 
                        callbackName 
                    ]; 
 
                }catch(error){ 
 
                    window[ 
                        callbackName 
                    ] = 
                        undefined; 
 
                } 
 
 
                if( 
                    script.parentNode 
                ){ 
 
                    script.parentNode.removeChild( 
                        script 
                    ); 
 
                } 
 
            } 
 
 
            window[ 
                callbackName 
            ] = 
                function(data){ 
 
                    if( 
                        selesai 
                    ){ 
 
                        return; 
 
                    } 
 
 
                    selesai = 
                        true; 
 
 
                    cleanup(); 
 
 
                    resolve( 
                        data 
                    ); 
 
                }; 
 
 
            script.onerror = 
                function(){ 
 
                    if( 
                        selesai 
                    ){ 
 
                        return; 
 
                    } 
 
 
                    selesai = 
                        true; 
 
 
                    cleanup(); 
 
 
                    reject( 
                        new Error( 
                            "JSONP gagal dimuat" 
                        ) 
                    ); 
 
                }; 
 
 
            script.src = 
                PANCASILA_API_URL + 
                "?" + 
                query.toString(); 
 
 
            script.async = 
                true; 
 
 
            document 
                .head 
                .appendChild( 
                    script 
                ); 
 
        } 
    ); 
 
} 
 
 
/* ===================================================== 
   REDIRECT KE HALAMAN IDENTITAS 
      
   Karena pancasila.html berada di: 
      
   /kelas-5/sts/pancasila.html 
      
   maka identitas.html berada di: 
      
   /kelas-5/identitas.html 
===================================================== */ 
 
function pancasilaRedirectKeIdentitas( 
    alasan 
){ 
 
    if( 
        pancasilaSedangRedirect 
    ){ 
 
        return; 
 
    } 
 
 
    pancasilaSedangRedirect = 
        true; 
 
 
    clearInterval( 
        pancasilaHeartbeatTimer 
    ); 
 
 
    pancasilaHeartbeatTimer = 
        null; 
 
 
    pancasilaClearLoginData(); 
 
 
    let url = 
        "../../identitas.html"; 
 
 
    if( 
        alasan 
    ){ 
 
        url += 
            "?alasan=" + 
            encodeURIComponent( 
                alasan 
            ); 
 
    } 
 
 
    window.location.replace( 
        url 
    ); 
 
} 
 
 
/* ===================================================== 
   CEK SESI KE SERVER 
===================================================== */ 
 
async function pancasilaCheckSession(){ 
 
    const loginData = 
        pancasilaGetLoginData(); 
 
 
    /* ------------------------------------------------- 
       Tidak ada data login 
    ------------------------------------------------- */ 
 
    if( 
        !pancasilaLoginDataIsComplete( 
            loginData 
        ) 
    ){ 
 
        pancasilaRedirectKeIdentitas( 
            "login" 
        ); 
 
        return false; 
 
    } 
 
 
    /* ------------------------------------------------- 
       Cek masa sesi 24 jam 
    ------------------------------------------------- */ 
 
    if( 
        pancasilaClientSessionExpired( 
            loginData 
        ) 
    ){ 
 
        pancasilaRedirectKeIdentitas( 
            "expired" 
        ); 
 
        return false; 
 
    } 
 
 
    try{ 
 
        const result = 
            await pancasilaRequestJSONP( 
                { 
 
                    action: 
                        "checksession", 
 
                    sessionId: 
                        loginData.sessionId 
 
                }, 
                10000 
            ); 
 
 
        console.log( 
            "Pancasila - hasil checksession:", 
            result 
        ); 
 
 
        /* ------------------------------------------------- 
           Session tidak valid 
        ------------------------------------------------- */ 
 
        if( 
            !result || 
            result.success !== true || 
            result.loggedIn !== true 
        ){ 
 
            pancasilaRedirectKeIdentitas( 
                "invalid" 
            ); 
 
            return false; 
 
        } 
 
 
        /* ------------------------------------------------- 
           Jika server memberikan session terbaru 
        ------------------------------------------------- */ 
 
        if( 
            result.session 
        ){ 
 
            const updated = 
                Object.assign( 
                    {}, 
                    loginData, 
                    result.session 
                ); 
 
 
            pancasilaSaveLoginData( 
                updated 
            ); 
 
 
            pancasilaTampilkanDataSiswa( 
                updated 
            ); 
 
        } 
 
 
        pancasilaSetStatusOnline( 
            true, 
            "🟢 Online" 
        ); 
 
 
        return true; 
 
    }catch(error){ 
 
        /* 
           Sama seperti halaman STS utama: 
           error jaringan sementara tidak 
           langsung mengeluarkan siswa. 
        */ 
 
        console.warn( 
            "Pancasila: cek sesi sementara gagal:", 
            error 
        ); 
 
 
        pancasilaSetStatusOnline( 
            true, 
            "🟢 Online" 
        ); 
 
 
        return true; 
 
    } 
 
} 
 
 
/* ===================================================== 
   KIRIM HEARTBEAT 
===================================================== */ 
 
async function pancasilaSendHeartbeat(){ 
 
    /* ------------------------------------------------- 
       Jangan kirim ketika redirect 
       atau proses logout. 
    ------------------------------------------------- */ 
 
    if( 
        pancasilaSedangRedirect || 
        pancasilaSedangLogout 
    ){ 
 
        return; 
 
    } 
 
 
    /* ------------------------------------------------- 
       Ambil data login 
    ------------------------------------------------- */ 
 
    const loginData = 
        pancasilaGetLoginData(); 
 
 
    /* ------------------------------------------------- 
       Pastikan login lengkap 
    ------------------------------------------------- */ 
 
    if( 
        !pancasilaLoginDataIsComplete( 
            loginData 
        ) 
    ){ 
 
        console.warn( 
            "Pancasila: heartbeat dihentikan karena data login tidak lengkap." 
        ); 
 
 
        pancasilaRedirectKeIdentitas( 
            "login" 
        );

    /* ------------------------------------------------- 
       Cek sesi 24 jam 
    ------------------------------------------------- */ 
 
    if( 
        pancasilaClientSessionExpired(

        )

    /* ------------------------------------------------- 
       Hindari heartbeat terlalu rapat

    const now =

        /* =================================================

        console.log(

        );

            result && 
            result.message 
        ); 
 
 
        /* =================================================

                result.session.kelas 
            ); 
 
 
            console.log( 
                "🔢 Absen SERVER:", 
                result.session.nomorAbsen 
            ); 
 
 
            console.log( 
                "📄 Halaman SERVER:", 
                result.session.halaman 
            ); 
 
 
            console.log( 
                "🕐 Login At SERVER:", 
                result.session.loginAt 
            ); 
 
 
            console.log( 
                "🕐 Last Seen SERVER:", 
                result.session.lastSeen 
            ); 
 
 
            console.log( 
                "🟢 Status SERVER:", 
                result.session.status 
            ); 
 
 
            console.log( 
                "----------------------------------------" 
            ); 
 
        } 
 
 
        /* ================================================= 
           CEK HASIL HEARTBEAT 
        ================================================= */ 
 
        if( 
            !result || 
            result.success !== true 
        ){ 
 
            const status = 
                String( 
                    result && 
                    result.status 
                    || 
                    "" 
                ).toLowerCase(); 
 
 
            console.warn( 
                "Pancasila: heartbeat tidak berhasil.", 
                result 
            ); 
 
 
            /* --------------------------------------------- 
               Session benar-benar invalid 
            --------------------------------------------- */ 
 
            if( 
 
                status === 
                    "expired" 
 
                || 
 
                status === 
                    "not_logged_in" 
 
                || 
 
                status === 
                    "invalid_session" 
 
            ){ 
 
                console.error( 
                    "🚨 Pancasila: SESSION TIDAK VALID / EXPIRED" 
                ); 
 
 
                pancasilaRedirectKeIdentitas( 
                    "expired" 
                ); 
 
 
                return; 
 
            } 
 
 
            /* 
               Error lain tidak langsung 
               menghapus sesi. 
            */ 
 
            pancasilaSetStatusOnline( 
                true, 
                "🟢 Online" 
            ); 
 
 
            return; 
 
        } 
 
 
        /* ================================================= 
           SIMPAN DATA SESSION TERBARU 
        ================================================= */ 
 
        if( 
            result.session 
        ){ 
 
            const updated = 
                Object.assign( 
                    {}, 
                    loginData, 
                    result.session 
                ); 
 
 
            console.log( 
                "🔍 SESSION ID SEBELUM:", 
                loginData.sessionId 
            ); 
 
 
            console.log( 
                "🔍 SESSION ID SESUDAH:", 
                updated.sessionId 
            ); 
 
 
            if( 
                loginData.sessionId !== 
                updated.sessionId 
            ){ 
 
                console.warn( 
                    "⚠️ PERINGATAN: SESSION ID BERUBAH!" 
                ); 
 
            }else{ 
 
                console.log( 
                    "✅ Session ID tetap sama." 
                ); 
 
            } 
 
 
            pancasilaSaveLoginData( 
                updated 
            ); 
 
 
            pancasilaTampilkanDataSiswa( 
                updated 
            ); 
 
        } 
 
 
        /* ================================================= 
           STATUS ONLINE 
        ================================================= */ 
 
        pancasilaSetStatusOnline( 
            true, 
            "🟢 Online" 
        ); 
 
 
        /* ================================================= 
           LOG BERHASIL 
        ================================================= */ 
 
        console.log( 
            "🟢 Pancasila ONLINE:", 
            new Date() 
                .toLocaleTimeString() 
        ); 
 
 
        console.log( 
            "========================================" 
        ); 
 
 
    }catch(error){ 
 
        /* 
           Internet/API sementara gagal. 
           Jangan logout. 
        */ 
 
        console.warn( 
            "Pancasila: heartbeat gagal sementara:", 
            error 
        ); 
 
 
        pancasilaSetStatusOnline( 
            true, 
            "🟢 Online" 
        ); 
 
 
        console.log( 
            "Heartbeat berikutnya akan mencoba kembali." 
        ); 
 
 
        console.log( 
            "========================================" 
        ); 
 
    } 
 
} 
 
 
/* ===================================================== 
   HEARTBEAT BERKALA 
===================================================== */ 
 
function pancasilaStartHeartbeat(){ 
 
    if( 
        pancasilaHeartbeatTimer 
    ){ 
 
        clearInterval( 
            pancasilaHeartbeatTimer 
        ); 
 
    } 
 
 
    /* 
       Kirim heartbeat langsung. 
    */ 
 
    pancasilaSendHeartbeat(); 
 
 
    /* 
       Selanjutnya setiap 20 detik. 
    */ 
 
    pancasilaHeartbeatTimer = 
        setInterval( 
            function(){ 
 
                pancasilaSendHeartbeat(); 
 
            }, 
            PANCASILA_HEARTBEAT_INTERVAL 
        ); 
 
} 
 
 
/* ===================================================== 
   AKTIVITAS SISWA 
===================================================== */ 
 
function pancasilaRegisterActivity(){ 
 
    clearTimeout( 
        pancasilaActivityTimer 
    ); 
 
 
    pancasilaActivityTimer = 
        setTimeout( 
            function(){ 
 
                pancasilaSendHeartbeat(); 
 
            }, 
            300 
        ); 
 
} 
 
 
/* ===================================================== 
   EVENT AKTIVITAS SISWA 
===================================================== */ 
 
const pancasilaActivityEvents = [ 
 
    "click", 
 
    "keydown", 
 
    "scroll", 
 
    "touchstart", 
 
    "pointerdown" 
 
]; 
 
 
pancasilaActivityEvents.forEach( 
    function(eventName){ 
 
        document.addEventListener( 
            eventName, 
            pancasilaRegisterActivity, 
            { 
                passive: 
                    true 
            } 
        ); 
 
    } 
); 
 
 
/* ===================================================== 
   TAB KEMBALI AKTIF 
===================================================== */ 
 
document.addEventListener( 
    "visibilitychange", 
    function(){ 
 
        if( 
            document.visibilityState === 
            "visible" 
        ){ 
 
            pancasilaSendHeartbeat(); 
 
        } 
 
    } 
); 
 
 
/* ===================================================== 
   WINDOW KEMBALI AKTIF 
===================================================== */ 
 
window.addEventListener( 
    "focus", 
    function(){ 
 
        pancasilaSendHeartbeat(); 
 
    } 
); 
 
 
/* ===================================================== 
   SAAT HALAMAN DITINGGALKAN 
      
   Tidak mengirim logout. 
      
   Tujuannya agar perpindahan: 
      
   STS utama 
       ↓ 
   Pancasila 
       ↓ 
   Mata pelajaran 
      
   tetap menggunakan session yang sama. 
===================================================== */ 
 
window.addEventListener( 
    "pagehide", 
    function(){ 
 
        clearInterval( 
            pancasilaHeartbeatTimer 
        ); 
 
 
        pancasilaHeartbeatTimer = 
            null; 
 
    } 
); 
 
 
/* ===================================================== 
   PROTEKSI NAVIGASI 
      
   Menu tetap hanya dapat dibuka 
   jika siswa mempunyai session valid. 
===================================================== */ 
 
function pancasilaProtectNavigation(){ 
 
    /* ================================================= 
       TOMBOL MATA PELAJARAN 
    ================================================= */ 
 
    document 
        .querySelectorAll( 
            ".menu-button" 
        ) 
        .forEach( 
            function(button){ 
 
                button.addEventListener( 
                    "click", 
                    function(event){ 
 
                        const loginData = 
                            pancasilaGetLoginData(); 
 
 
                        /* --------------------------------- 
                           Belum login 
                        --------------------------------- */ 
 
                        if( 
                            !pancasilaLoginDataIsComplete( 
                                loginData 
                            ) 
                        ){ 
 
                            event.preventDefault(); 
 
 
                            pancasilaRedirectKeIdentitas( 
                                "login" 
                            ); 
 
 
                            return; 
 
                        } 
 
 
                        /* --------------------------------- 
                           Session lokal expired 
                        --------------------------------- */ 
 
                        if( 
                            pancasilaClientSessionExpired( 
                                loginData 
                            ) 
                        ){ 
 
                            event.preventDefault(); 
 
 
                            pancasilaRedirectKeIdentitas( 
                                "expired" 
                            ); 
 
 
                            return; 
 
                        } 
 
 
                        /* 
                           Kirim heartbeat sebelum 
                           siswa berpindah halaman. 
                        */ 
 
                        pancasilaSendHeartbeat(); 
 
                    } 
                ); 
 
            } 
        ); 
 
 
    /* ================================================= 
       NAVBAR 
    ================================================= */ 
 
    document 
        .querySelectorAll( 
            ".nav a, nav a" 
        ) 
        .forEach( 
            function(link){ 
 
                link.addEventListener( 
                    "click", 
                    function(event){ 
 
                        const loginData = 
                            pancasilaGetLoginData(); 
 
 
                        if( 
                            !pancasilaLoginDataIsComplete( 
                                loginData 
                            ) 
                        ){ 
 
                            event.preventDefault(); 
 
 
                            pancasilaRedirectKeIdentitas( 
                                "login" 
                            ); 
 
 
                            return; 
 
                        } 
 
 
                        if( 
                            pancasilaClientSessionExpired( 
                                loginData 
                            ) 
                        ){ 
 
                            event.preventDefault(); 
 
 
                            pancasilaRedirectKeIdentitas( 
                                "expired" 
                            ); 
 
 
                            return; 
 
                        } 
 
 
                        pancasilaSendHeartbeat(); 
 
                    } 
                ); 
 
            } 
        ); 
 
 
    /* ================================================= 
       TOMBOL KEMBALI 
    ================================================= */ 
 
    const backButton = 
        document.querySelector( 
            ".back-button" 
        ); 
 
 
    if( 
        backButton 
    ){ 
 
        backButton.addEventListener( 
            "click", 
            function(event){ 
 
                const loginData = 
                    pancasilaGetLoginData(); 
 
 
                if( 
                    !pancasilaLoginDataIsComplete( 
                        loginData 
                    ) 
                ){ 
 
                    event.preventDefault(); 
 
 
                    pancasilaRedirectKeIdentitas( 
                        "login" 
                    ); 
 
 
                    return; 
 
                } 
 
 
                if( 
                    pancasilaClientSessionExpired( 
                        loginData 
                    ) 
                ){ 
 
                    event.preventDefault(); 
 
 
                    pancasilaRedirectKeIdentitas( 
                        "expired" 
                    ); 
 
 
                    return; 
 
                } 
 
 
                pancasilaSendHeartbeat(); 
 
            } 
        ); 
 
    } 
 
} 
 
 
/* ===================================================== 
   INISIALISASI SISTEM ONLINE Pancasila 
===================================================== */ 
 
async function pancasilaInitializeOnline(){ 
 
    console.log( 
        "🚀 Sistem online Pancasila dimulai." 
    ); 
 
 
    /* ------------------------------------------------- 
       Ambil data login 
    ------------------------------------------------- */ 
 
    const loginData = 
        pancasilaGetLoginData(); 
 
 
    /* ------------------------------------------------- 
       Pastikan siswa sudah login 
    ------------------------------------------------- */ 
 
    if( 
        !pancasilaLoginDataIsComplete( 
            loginData 
        ) 
    ){ 
 
        pancasilaRedirectKeIdentitas( 
            "login" 
        ); 
 
 
        return; 
 
    } 
 
 
    /* ------------------------------------------------- 
       Tampilkan data siswa 
       sebelum server selesai diperiksa. 
    ------------------------------------------------- */ 
 
    pancasilaTampilkanDataSiswa( 
        loginData 
    ); 
 
 
    /* ------------------------------------------------- 
       Cek masa sesi lokal 
    ------------------------------------------------- */ 
 
    if( 
        pancasilaClientSessionExpired( 
            loginData 
        ) 
    ){ 
 
        pancasilaRedirectKeIdentitas( 
            "expired" 
        ); 
 
 
        return; 
 
    } 
 
 
    /* ------------------------------------------------- 
       Periksa session ke server 
    ------------------------------------------------- */ 
 
    const valid = 
        await pancasilaCheckSession(); 
 
 
    if( 
        !valid 
    ){ 
 
        return; 
 
    } 
 
 
    const sessionAktif = 
        pancasilaGetLoginData(); 


    if( 
        !pancasilaLoginDataIsComplete( 
            sessionAktif 
        ) 
    ){ 

        pancasilaRedirectKeIdentitas( 
            "login" 
        ); 

        return; 

    } 


    mulaiKuisDariSession( 
        sessionAktif 
    ); 


    /* ------------------------------------------------- 
       Mulai heartbeat 
    ------------------------------------------------- */ 
 
    pancasilaStartHeartbeat(); 
 
 
    /* ------------------------------------------------- 
       Proteksi navigasi 
    ------------------------------------------------- */ 
 
    pancasilaProtectNavigation(); 
 
 
    /* ------------------------------------------------- 
       Console 
    ------------------------------------------------- */ 
 
    console.log( 
        "🟢 Pancasila aktif dan sedang dibaca online oleh server." 
    ); 
 
 
    console.log( 
        "📄 Halaman online:", 
        PANCASILA_HALAMAN_UTAMA 
    ); 
 
 
    console.log( 
        "⏱️ Heartbeat:", 
        PANCASILA_HEARTBEAT_INTERVAL / 
        1000, 
        "detik" 
    ); 
 
 
    console.log( 
        "⏳ Maksimum sesi:", 
        PANCASILA_SESSION_MAX_AGE / 
        (60 * 60 * 1000), 
        "jam" 
    ); 
 
}

</script>
