<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <title>Kuis Bilangan</title>
  <style>
    .kotak-soal { background-color: white; border: 2px solid #add8e6; border-radius: 10px; padding: 15px 20px; margin-bottom: 15px; max-width: 600px; width: 100%; }
    body { font-family: 'Arial', sans-serif; padding: 20px; background-image: url('https://i.imgur.com/IFKQPGS.png'); background-size: cover; background-position: center; }
    .container { max-width: 100%; margin: 0 auto; padding: 20px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .nav { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
    .nav a { text-decoration: none; color: #2c3e50; font-weight: bold; background-color: white; padding: 10px 15px; border: 2px solid #add8e6; border-radius: 8px; }
    .answers label { display: block; margin-bottom: 12px; padding: 10px 14px; border-radius: 6px; cursor: pointer; color: #2c3e50; font-weight: bold; transition: background 0.2s, transform 0.1s; }
    .answers input[type="radio"] { margin-right: 10px; accent-color: #007bff; transform: scale(1.2); }
    .answers label:nth-child(1) { background: #d6eaff; }
    .answers label:nth-child(2) { background: #d6ffd9; }
    .answers label:nth-child(3) { background: #fffbd6; }
    .answers label:nth-child(4) { background: #ffd6e7; }
    .answers label:hover { filter: brightness(0.9); transform: scale(1.02); }
    button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    button:hover { background-color: #0056b3; }

    .popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px 35px; border-radius: 12px; text-align: center; z-index: 2000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 18px; font-weight: bold; animation: pop 0.3s ease-out; max-width: 90%; }
    .popup-warning { background: #fff3cd; border: 2px solid #ffecb5; color: #856404; }
    .popup-success { background: #d4edda; border: 2px solid #c3e6cb; color: #155724; }
    .popup-gold { background: #fff8e1; border: 2px solid #ffeb3b; color: #8d6e00; }

    .nilai-besar { font-size: 48px; font-weight: bold; display: block; margin: 10px 0; }
    .nilai-merah { color: #e74c3c; }
    .nilai-kuning { color: #f39c12; }
    .nilai-hijau { color: #27ae60; }
    .nilai-emas { color: #d4af37; }

    .peringkat-merah { color: #e74c3c; }
    .peringkat-kuning { color: #f39c12; }
    .peringkat-hijau { color: #27ae60; }
    .peringkat-emas { color: #d4af37; }

    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

    .form-identitas { background: white; border: 2px solid #add8e6; border-radius: 10px; padding: 20px; max-width: 400px; width: 100%; margin-bottom: 20px; }
    .form-identitas input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }

    .progress { background: white; border: 2px solid #add8e6; border-radius: 10px; padding: 8px 14px; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="🏰Kerajaan-Angka-Ajaib.html">◀️ kembali</a>
      <a href="soal-wisata1.pdf" download>📥 Download</a>
    </div>

    <h1 style="color:#2c3e50;text-align:center;background:white;padding:10px 20px;border-radius:10px;border:2px solid #add8e6;"> 🧙‍♂️ Petualangan Angka Ajaib </h1>

    <!-- Form identitas -->
    <div id="formIdentitas" class="form-identitas">
      <h3>Isi Identitasmu dulu ya ✨</h3>
      <input type="text" id="nama" placeholder="Nama Lengkap" oninput="mainkanSuaraKetik()">
      <input type="text" id="kelas" placeholder="Kelas" oninput="mainkanSuaraKetik()">
      <input type="number" id="absen" placeholder="No Absen" oninput="mainkanSuaraKetik()">
      <button onclick="mulaiKuis()">🚀 Mulai Kuis</button>
    </div>

    <div id="progress" class="progress" style="display:none;">Soal 1/10</div>
<div id="quiz" style="display:none;"></div>

<!-- Leaderboard -->
<div id="leaderboard" style="display:none;max-width:700px;width:100%;margin-top:25px;">
    <h2 style="text-align:center;">🏆 Leaderboard Top 10</h2>

    <table style="width:100%;background:white;border-collapse:collapse;border:2px solid #add8e6;border-radius:10px;overflow:hidden;">

        <thead style="background:#4CAF50;color:white;">
            <tr>
                <th>Peringkat</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Nilai</th>
            </tr>
        </thead>

        <tbody id="isiLeaderboard"></tbody>

    </table>

</div>
  </div>

  <!-- Suara -->
  <audio id="suaraKetik" src="../../suara/typing.mp3"></audio>
  <audio id="suaraNext" src="../../suara/blub.mp3"></audio>
  <audio id="suaraUlangi" src="../../suara/ulangi.mp3"></audio>
  <audio id="suaraKlik" src="../../suara/mouse-clicks.mp3"></audio>
  <audio id="suaraPeringatan" src="../../suara/tada-234709.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://hfjbwodvckqaxitgiidg.supabase.co";
const SUPABASE_KEY = "sb_publishable_f_WtHcI-dpJefFg9RSsRvw_ELQsMgQK";

if (!window.supabase) {
    alert("Library Supabase gagal dimuat.");
    throw new Error("Supabase belum dimuat.");
}

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

    // ===== Data Soal (20 soal) =====
    const soalMaster = [
      { q: "Bilangan 27.791 jika ditulis dengan huruf adalah …", a: ["Dua puluh tujuh ribu sembilan ratus tujuh puluh satu", "Dua puluh tujuh ribu tujuh ratus sembilan puluh satu", "Dua puluh tujuh ribu sembilan ratus sebelas", "Dua puluh tujuh ribu tujuh ratus sembilan belas"], k: 1 },
      { q: "Tiga puluh lima ribu jika ditulis dengan angka adalah …", a: ["3.500", "35.000", "350.000", "3.050"], k: 1 },
      { q: "Tulisan bilangan 53.425 yang benar adalah …", a: ["Lima puluh tiga ribu dua ratus lima puluh empat", "Lima ribu tiga ratus empat ratus dua puluh lima", "Lima puluh tiga ribu empat ratus dua puluh lima", "Lima puluh ribu tiga ratus dua puluh lima"], k: 2 },
      { q: "Bilangan 75.090 jika ditulis dengan huruf adalah …", a: ["Tujuh ribu lima ratus sembilan puluh", "Tujuh puluh lima ribu sembilan puluh", "Tujuh puluh lima ribu sembilan ratus", "Tujuh puluh ribu lima ratus sembilan"], k: 1 },
      { q: "Nilai angka 4 pada bilangan 47.328 adalah …", a: ["40", "400", "4.000", "40.000"], k: 3 },
      { q: "Nilai angka 2 pada bilangan 65.280 adalah …", a: ["2", "20", "200", "2.000"], k: 2 },
      { q: "Bilangan 33.200 jika ditulis dalam bentuk penjumlahan nilai tempat adalah …", a: ["30.000 + 3.000 + 200", "30.000 + 300 + 200", "3.000 + 30.000 + 2.000", "33.000 + 200"], k: 0 },
      { q: "Manakah bilangan terbesar?", a: ["15.200", "15.650", "15.800", "15.750"], k: 2 },
      { q: "Urutan dari yang terkecil adalah … (18.500, 18.050, 18.250, 18.150)", a: ["18.050 – 18.150 – 18.250 – 18.500", "18.500 – 18.250 – 18.150 – 18.050", "18.150 – 18.050 – 18.250 – 18.500", "18.050 – 18.250 – 18.150 – 18.500"], k: 0 },
      { q: "Nilai angka 8 pada bilangan 28.745 adalah …", a: ["8", "80", "800", "8.000"], k: 3 },
      { q: "Nilai angka 6 pada bilangan 96.321 adalah …", a: ["6", "60", "600", "60.000"], k: 3 },
      { q: "Bilangan 45.209 jika ditulis dalam bentuk penjumlahan nilai tempat adalah …", a: ["40.000 + 5.000 + 200 + 9", "40.000 + 5.000 + 200 + 90", "4.000 + 50.000 + 200 + 9", "45.000 + 200 + 90"], k: 0 },
      { q: "Nilai angka 3 pada bilangan 73.452 adalah …", a: ["3", "30", "300", "3.000"], k: 3 },
      { q: "Urutan bilangan berikut dari yang terkecil adalah … 45.230, 45.200, 45.325, 45.180", a: ["45.200 – 45.180 – 45.230 – 45.325", "45.180 – 45.200 – 45.230 – 45.325", "45.325 – 45.230 – 45.200 – 45.180", "45.200 – 45.230 – 45.325 – 45.180"], k: 1 },
      { q: "Urutan bilangan berikut dari yang terbesar adalah … 32.750, 32.500, 32.900, 32.850", a: ["32.750 – 32.850 – 32.900 – 32.500", "32.900 – 32.850 – 32.750 – 32.500", "32.500 – 32.750 – 32.850 – 32.900", "32.850 – 32.900 – 32.750 – 32.500"], k: 1 },
      { q: "Urutan bilangan berikut dari yang terkecil adalah … 80.125, 80.250, 80.075, 80.200", a: ["80.125 – 80.200 – 80.250 – 80.075", "80.075 – 80.125 – 80.200 – 80.250", "80.250 – 80.200 – 80.125 – 80.075", "80.200 – 80.250 – 80.125 – 80.075"], k: 1 },
      { q: "Urutan bilangan berikut dari yang terbesar adalah … 99.500, 99.250, 99.750, 99.600", a: ["99.750 – 99.600 – 99.500 – 99.250", "99.250 – 99.500 – 99.600 – 99.750", "99.600 – 99.750 – 99.500 – 99.250", "99.500 – 99.250 – 99.600 – 99.750"], k: 0 },
      { q: "Jumlah penonton sepak bola di stadion adalah 35.250 orang. Jika ditulis dengan huruf adalah …", a: ["Tiga puluh lima ribu dua ratus lima puluh", "Tiga puluh lima ribu dua puluh lima", "Tiga puluh lima ribu seratus lima puluh", "Tiga puluh lima ribu dua ratus lima"], k: 0 },
      { q: "Sebuah sekolah memiliki 1.025 murid. Jika ditulis dengan huruf adalah …", a: ["Seribu dua puluh lima", "Seribu seratus dua puluh lima", "Sepuluh ribu dua puluh lima", "Seratus dua puluh lima"], k: 0 },
      { q: "Nilai angka 9 pada bilangan 19.482 adalah …", a: ["9", "90", "900", "9.000"], k: 3 }
    ];

    // ===== Variabel Kuis =====
    const JUMLAH_SOAL = 10; // tampilkan hanya 10 dari 20
    let daftarSoal = [];
    let indeks = 0;
    let benar = 0;

    // ===== Utilitas Acak =====
    function acakArray(arr){
      for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function ambilSoalAcak(master, n){
      const salin = master.map(s => ({ q: s.q, a: [...s.a], k: s.k }));
      acakArray(salin);
      return salin.slice(0, n);
    }

    function acakJawabanSoal(s){
      const gabung = s.a.map((teks, i) => ({ teks, benar: i === s.k }));
      acakArray(gabung);
      s.a = gabung.map(o => o.teks);
      s.k = gabung.findIndex(o => o.benar);
    }

    // ===== Identitas & Mulai =====
    function mulaiKuis(){
      const nama = document.getElementById('nama').value.trim();
      const kelas = document.getElementById('kelas').value.trim();
      const absen = document.getElementById('absen').value.trim();

      if(!nama || !kelas || !absen){
        mainkanSuaraPeringatan();
        tampilkanPopup("⚡ Isi identitas dulu ya! Petualang hebat selalu siap dengan data lengkap! 😉", "popup-warning");
        return;
      }

      mainkanSuaraNext();
      document.getElementById('formIdentitas').style.display = 'none';
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('progress').style.display = 'inline-block';

      daftarSoal = ambilSoalAcak(soalMaster, JUMLAH_SOAL);
      daftarSoal.forEach(acakJawabanSoal);
      indeks = 0; benar = 0;
      tampilkanSoal();
    }

    // ===== Render Soal =====
    function tampilkanSoal(){
      const quiz = document.getElementById('quiz');
      const progress = document.getElementById('progress');

      if(indeks >= daftarSoal.length){
        const nilai = Math.round((benar / JUMLAH_SOAL) * 100);
        let peringkat = "", kelasPopup = "popup-success", warnaNilai = "nilai-merah", warnaPeringkat = "peringkat-merah";
        if(nilai === 100){
          peringkat = "🏆 Luar biasa! Kamu benar semua, Sang Juara!";
          kelasPopup = "popup-gold"; warnaNilai = "nilai-emas"; warnaPeringkat = "peringkat-emas";
        } else if(nilai >= 80){
          peringkat = "🥈 Hebat! Hanya sedikit lagi menuju sempurna!";
          warnaNilai = "nilai-hijau"; warnaPeringkat = "peringkat-hijau";
        } else if(nilai >= 60){
          peringkat = "🥉 Lumayan! Tingkatkan lagi biar makin mantap!";
          warnaNilai = "nilai-kuning"; warnaPeringkat = "peringkat-kuning";
        } else {
          peringkat = "💡 Jangan menyerah, ayo coba lagi!";
        }

        kirimNilai(nilai);
        tampilkanPopupHasil(`🎉 Selesai!<br>Benar: ${benar}/${JUMLAH_SOAL}<br>Nilai: <span class="nilai-besar ${warnaNilai}">${nilai}</span><span class="${warnaPeringkat}">${peringkat}</span>`, kelasPopup);
        quiz.innerHTML = "";
        progress.style.display = 'none';
        return;
      }

      const s = daftarSoal[indeks];
      progress.textContent = `Soal ${indeks+1}/${JUMLAH_SOAL}`;

      quiz.innerHTML = `
        <div class="kotak-soal">${s.q}</div>
        <div class="answers">
          ${s.a.map((j, i) => `
            <label><input type="radio" name="jawaban" value="${i}" onclick="mainkanSuaraKlik()"/> ${j}</label>
          `).join('')}
        </div>
        <button onclick="periksaJawaban()">Next</button>
      `;
    }

    // ===== Cek Jawaban =====
    function periksaJawaban(){
      const jawaban = document.querySelector('input[name="jawaban"]:checked');
      if(!jawaban){
        mainkanSuaraPeringatan();
        tampilkanPopup("🎯 Ayo tentukan jawabanmu, petualang hebat pasti bisa!", "popup-warning");
        return;
      }
      if(parseInt(jawaban.value, 10) === daftarSoal[indeks].k){
        benar++;
      }
      indeks++;
      mainkanSuaraNext();
      tampilkanSoal();
    }

    // ===== Popup =====
    function tampilkanPopup(teks, kelas = 'popup-warning'){
      const popup = document.createElement('div');
      popup.className = `popup ${kelas}`;
      popup.innerHTML = teks;
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 3000);
    }

    function tampilkanPopupHasil(teks, kelas){
      const popup = document.createElement('div');
      popup.className = `popup ${kelas}`;
      popup.innerHTML = `${teks}<br><br>
        <button onclick="muatUlang()">🔄 Ulangi</button>
        <button onclick="selesaiKuis()">❌ Selesai</button>`;
      document.body.appendChild(popup);
    }

    // ===== Ulangi & Selesai =====
    function muatUlang(){
      document.querySelectorAll('.popup').forEach(p => p.remove());
      daftarSoal = ambilSoalAcak(soalMaster, JUMLAH_SOAL);
      daftarSoal.forEach(acakJawabanSoal);
      indeks = 0; benar = 0;
      mainkanSuaraUlangi();
      document.getElementById('progress').style.display = 'inline-block';
      tampilkanSoal();
    }

    function selesaiKuis(){
      window.location.href = "🏰Kerajaan-Angka-Ajaib.html";
    }

    // ===== Kirim Nilai ke supabase =====
    async function kirimNilai(nilai){

    try{

        const nama = document.getElementById("nama").value.trim();
        const kelas = document.getElementById("kelas").value.trim();
        const absen = parseInt(document.getElementById("absen").value,10);

        const { data, error } = await supabaseClient
            .from("nilai_kuis")
            .insert([
                {
                    nama,
                    kelas,
                    absen,
                    nilai
                }
            ])
            .select();

        if(error){
            throw error;
        }

        await tampilkanLeaderboard();

    }catch(err){

        console.error(err);
        alert(err.message);

    }

}
    async function tampilkanLeaderboard(){

    try{

        const { data, error } = await supabaseClient
            .from("nilai_kuis")
            .select("nama,kelas,nilai")
            .order("nilai",{ascending:false})
            .order("created_at",{ascending:true})
            .limit(10);

        if(error){
            throw error;
        }

        const isi = document.getElementById("isiLeaderboard");
        isi.innerHTML="";

        if (!data || data.length === 0) {

    isi.innerHTML = `
        <tr>
            <td colspan="4" style="padding:20px;text-align:center;">
                Belum ada data.
            </td>
        </tr>
    `;

} else {

    data.forEach((item,index)=>{

        let ranking=index+1;

        if(index===0) ranking="🥇";
        else if(index===1) ranking="🥈";
        else if(index===2) ranking="🥉";

        isi.innerHTML += `
            <tr style="text-align:center;border-bottom:1px solid #ddd;height:40px;">
                <td>${ranking}</td>
                <td>${item.nama}</td>
                <td>${item.kelas}</td>
                <td><b>${item.nilai}</b></td>
            </tr>
        `;

    });

}

        document.getElementById("leaderboard").style.display="block";

    }catch(err){

        console.error(err);

    }

}

    // ===== Suara =====
    function mainkanSuaraKlik(){ const s = document.getElementById('suaraKlik'); s.currentTime = 0; s.play(); }
    function mainkanSuaraPeringatan(){ const s = document.getElementById('suaraPeringatan'); s.currentTime = 0; s.play(); }
    function mainkanSuaraKetik(){ const s = document.getElementById('suaraKetik'); s.currentTime = 0; s.play(); }
    function mainkanSuaraNext(){ const s = document.getElementById('suaraNext'); s.currentTime = 0; s.play(); }
    function mainkanSuaraUlangi(){ const s = document.getElementById('suaraUlangi'); s.currentTime = 0; s.play(); }
    window.onload=function(){

    tampilkanLeaderboard();

}
  </script>
  
</body>
