    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        /* =================================================
           RESET
        ================================================= */

        *{

            margin:0;
            padding:0;

            box-sizing:border-box;

        }


        /* =================================================
           BODY
        ================================================= */

        html,
        body{

            width:100%;
            min-height:100%;

        }


        body{

            font-family:
                'Poppins',
                sans-serif;

            min-height:100vh;

            overflow-x:hidden;

            background:
                url(
                    'https://i.imgur.com/ZhICw8Q.jpeg'
                )
                no-repeat
                center
                center
                fixed;

            background-size:cover;

            color:#333;

        }


        /* =================================================
           NAVIGASI
        ================================================= */

        nav{

            display:flex;

            flex-wrap:wrap;

            justify-content:space-between;

            align-items:center;

            gap:15px;

            padding:
                1rem
                2rem;

        }


        /* =================================================
           NAV KIRI
        ================================================= */

        .nav-left{

            display:flex;

            align-items:center;

            flex-wrap:wrap;

            gap:8px;

        }


        .nav-left img{

            height:45px;

            width:auto;

            object-fit:contain;

        }


        /* =================================================
           NAV KANAN
        ================================================= */

        .nav-right{

            display:flex;

            flex-wrap:wrap;

            gap:.5rem;

            align-items:center;

        }


        .nav-right a{

            background:
                rgba(
                    255,
                    255,
                    255,
                    .90
                );

            padding:
                .4rem
                .8rem;

            border-radius:6px;

            text-decoration:none;

            color:#0288d1;

            font-weight:bold;

            font-size:.9rem;

            border:none;

            cursor:pointer;

            transition:
                transform .3s ease,
                box-shadow .3s ease;

        }


        .nav-right a:hover{

            transform:
                scale(1.05);

            box-shadow:
                0 4px 8px
                rgba(
                    0,
                    0,
                    0,
                    .20
                );

        }


        /* =================================================
           JUDUL
        ================================================= */

        .title-section{

            text-align:center;

            margin:
                20px
                15px
                10px;

        }


        .title-section h1{

            font-size:2rem;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .85
                );

            display:inline-block;

            padding:
                .5rem
                1rem;

            border-radius:12px;

            color:#0288d1;

            text-shadow:
                1px
                1px
                2px
                rgba(
                    255,
                    255,
                    255,
                    .60
                );

        }


        /* =================================================
           INFORMASI AKTIVITAS SENDIRI
        ================================================= */

        .activity-status{

            width:fit-content;

            max-width:90%;

            margin:
                10px
                auto
                20px;

            padding:
                9px
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .94
                );

            border-radius:12px;

            color:#0288d1;

            font-size:.9rem;

            font-weight:600;

            box-shadow:
                0 4px 10px
                rgba(
                    0,
                    0,
                    0,
                    .15
                );

        }


        /* =================================================
           CONTAINER TUGAS
        ================================================= */

        .task-container{

            display:flex;

            justify-content:center;

            flex-wrap:wrap;

            gap:20px;

            margin:
                30px
                auto;

            max-width:900px;

            padding:
                0
                20px;

        }


        /* =================================================
           KARTU TUGAS
        ================================================= */

        .task-container a{

            flex:
                1
                1
                250px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .90
                );

            border-radius:12px;

            padding:20px;

            text-align:center;

            font-weight:bold;

            font-size:1.1rem;

            cursor:pointer;

            transition:
                transform .3s ease,
                box-shadow .3s ease;

            color:#0288d1;

            text-decoration:none;

            width:250px;

        }


        .task-container a:hover{

            transform:
                translateY(-5px);

            box-shadow:
                0 6px 12px
                rgba(
                    0,
                    0,
                    0,
                    .25
                );

        }


        /* =================================================
           EFEK KLIK
        ================================================= */

        .task-container a:active{

            transform:
                scale(.97);

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media(max-width:768px){

            nav{

                flex-direction:column;

                align-items:center;

                padding:
                    1rem;

            }


            .nav-left{

                justify-content:center;

            }


            .nav-right{

                justify-content:center;

            }


            .title-section h1{

                font-size:1.5rem;

            }


            .task-container{

                gap:15px;

                padding:
                    0
                    15px;

            }


            .task-container a{

                flex:
                    1
                    1
                    100%;

                width:100%;

                max-width:400px;

                font-size:1rem;

            }

        }


        @media(max-width:480px){

            .nav-left img{

                height:38px;

            }


            .nav-right a{

                font-size:.8rem;

                padding:
                    .4rem
                    .6rem;

            }


            .title-section h1{

                font-size:1.3rem;

            }

        }

    </style>

</head>


<body>

        <!-- ================================================

            <a href="../Petualangan-Kelas-5.html">

            </a>


            <a href="#">
                🖼️ Galeri
            </a>

        </div>

    </nav>


    <!-- =====================================================

    ====================================================== -->

        </h1>

    <!-- =====================================================

    ====================================================== -->

    <div

        sedang memilih tugas

    <!-- =====================================================

        <!-- =================================================

        <!-- =================================================

        <a

    </div>


    <!-- =====================================================
         AUDIO KLIK
    ====================================================== -->

    <audio
        id="clickSound"
        src="suara/button-press.mp3"
        preload="auto"
    ></audio>


    <!-- =====================================================
         SISTEM PRESENCE SISWA
         
         Karena:
         
         Petualangan-Kelas-5.html
         siswa-presence.js
         
         dan:
         
         tugas/
         tugas.html
         
         maka path:
         
         ../siswa-presence.js
    ====================================================== -->

    <script src="../siswa-presence.js"></script>


    <!-- =====================================================
         SCRIPT HALAMAN TUGAS
    ====================================================== -->

    <script>

        /* =================================================
           ELEMENT
        ================================================= */

        const activityStatus =
            document.getElementById(
                "activityStatus"
            );


        const taskLinks =
            document.querySelectorAll(
                ".task-container a"
            );


        /* =================================================
           AKTIVITAS AWAL
           
           Ketika baru masuk halaman tugas.
        ================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function(){

                setTimeout(
                    function(){

                        if(
                            typeof updateHalamanSiswa ===
                            "function"
                        ){

                            updateHalamanSiswa(
                                "🧠 Sedang memilih tugas"
                            );

                        }

                    },
                    1000
                );

            }
        );


        /* =================================================
           KLIK TUGAS
           
           Sebelum berpindah halaman, kita kirim aktivitas
           yang dipilih.
        ================================================= */

        taskLinks.forEach(
            function(link){

                link.addEventListener(
                    "click",
                    function(){

                        const activity =
                            link.dataset.activity ||
                            "🧠 Sedang mengerjakan tugas";


                        /* =====================================
                           TAMPILKAN DI HALAMAN SENDIRI
                        ===================================== */

                        if(activityStatus){

                            activityStatus.textContent =
                                "🟢 Aktivitas: " +
                                activity;

                        }


                        /* =====================================
                           UPDATE PRESENCE
                        ===================================== */

                        if(
                            typeof updateHalamanSiswa ===
                            "function"
                        ){

                            updateHalamanSiswa(
                                activity
                            );

                        }


                        /* =====================================
                           AUDIO
                        ===================================== */

                        const clickSound =
                            document.getElementById(
                                "clickSound"
                            );


                        if(clickSound){

                            clickSound.currentTime =
                                0;

                            clickSound
                                .play()
                                .catch(
                                    function(){
                                        // Audio dapat diblokir browser.
                                    }
                                );

                        }

                    }
                );

            }
        );

    </script>


</body>
