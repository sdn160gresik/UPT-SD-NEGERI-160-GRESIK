========================================================= */

let dataNama = "";

let dataKelas = "";

let dataAbsen = "";

let indeks = 0;

let benar = 0;


/* =========================================================
   MULAI KUIS
========================================================= */

function mulaiKuis() {

    dataNama =
        document
            .getElementById("nama")
            .value
            .trim();


    dataKelas =
        document
            .getElementById("kelas")
            .value
            .trim();


    dataAbsen =
        document
            .getElementById("absen")
            .value
            .trim();


    if (
        !dataNama ||
        !dataKelas ||
        !dataAbsen
    ) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(

            "⚠️ Ups! Data belum lengkap.<br><br>" +

            "Isi dulu Nama, Kelas, dan Absen ya " +

            "biar kamu bisa mulai mengerjakan kuis! 🚀"

        );


        return;
    }


    mainkanSuaraNext();


    document
        .getElementById("infoSiswa")
        .innerHTML =

        `👤 Nama: <b>${dataNama}</b> |
         🏫 Kelas: <b>${dataKelas}</b> |
         🔢 Absen: <b>${dataAbsen}</b>`;


    document
        .getElementById("formData")
        .classList
        .add("hidden");


    document
        .getElementById("areaKuis")
        .classList
        .remove("hidden");


    acakArray(soal);


    soal.forEach(
        s => {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    let gabung =

        s.a.map(
            (teks, i) => ({

                teks:
                    teks,

                benar:
                    i === s.k

            })
        );


    for (
        let i = gabung.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            gabung[i],
            gabung[j]
        ] = [

            gabung[j],
            gabung[i]

        ];

    }


    s.a =

        gabung.map(
            o =>
                o.teks
        );


    s.k =

        gabung.findIndex(
            o =>
                o.benar
        );

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal() {

    const quiz =
        document
            .getElementById("quiz");

    ===================================================== */

        indeks >=
        soal.length
    ) {

        const nilai =

            Math.round(

                    soal.length) *

            );


        kirimDataKeGoogleSheet(

            dataNama,

            dataKelas,

            dataAbsen,

            nilai

        );


        let kelasWarna =
            "nilai-merah";


        if (

        ) {

            kelasWarna =
                "nilai-hijau";

        }

        else if (
            nilai >= 60
        ) {

            kelasWarna =
                "nilai-kuning";

        }


        quiz.innerHTML = `

            <div class="hasil-box">

                <h2>
                    🎉 Kuis Selesai!
                </h2>

                <p>
                    Hebat,
                    <b>${dataNama}</b>!
                </p>

                <p>
                    Jawaban benar:
                    <b>${benar}</b>
                    dari
                    <b>${soal.length}</b>
                    soal
                </p>

                <div>

                    <p>
                        <b>Nilai Kamu:</b>
                    </p>

                    <div
                        class="nilai-besar ${kelasWarna}"
                    >
                        ${nilai}
                    </div>

                </div>

                <br>

                <button
                    onclick="ulangiKuis()"

                </button>

                <button
                    onclick="keluarKuis()"
                >
                    ❌ Selesai
                </button>

            </div>

        `;


        return;

    }


    const s =
        soal[indeks];


    quiz.innerHTML = `

        <div class="nomor-soal">

            📝 Soal
            ${indeks + 1}
            dari
            ${soal.length}

        </div>


        <div class="kotak-soal">

            ${s.q}

        </div>


        <div class="answers">

            ${s.a.map(

                (j, i) => `

                    <label>

                        <input
                            type="radio"
                            name="jawaban"
                            value="${i}"
                            onclick="mainkanSuaraKlik()"
                        />

                        <b>
                            ${String.fromCharCode(
                                65 + i
                            )}.
                        </b>

                        ${j}

                    </label>

                `

            ).join('')}

        </div>


        <button
            onclick="periksaJawaban()"
        >

            ➡️ Next

        </button>

    `;

}


/* =========================================================
   PERIKSA JAWABAN
========================================================= */

function periksaJawaban() {

    const jawaban =

        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if (!jawaban) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(

            "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +

            "Ayo pilih salah satu jawaban terlebih dahulu " +

            "sebelum lanjut ke soal berikutnya! 💡"

        );


        return;

    }


    if (

        parseInt(
            jawaban.value
        ) ===

        soal[indeks].k

    ) {

        benar++;

    }


    indeks++;


    mainkanSuaraNext();


    tampilkanSoal();

}
