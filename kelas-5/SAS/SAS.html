<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087bd5">
<title>Menu Pemilihan SAS | UPT SDN 160 GRESIK</title>
<style>
  :root {
    --blue-glow: rgba(39, 183, 255, .95);
    --purple-glow: rgba(231, 66, 255, .95);
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #087bd5;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, #69dfff 0%, #168bda 55%, #07539d 100%);
  }
  .artboard {
    position: relative;
    width: min(100vw, 177.7778vh);
    height: min(100vh, 56.25vw);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    isolation: isolate;
    box-shadow: 0 18px 70px rgba(0,0,0,.35);
  }
  .reference {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    user-select: none; pointer-events: none;
  }
  .book-hit {
    position: absolute;
    top: 47.0%;
    height: 40.8%;
    width: 29.3%;
    border: 0;
    border-radius: 9% / 12%;
    background: transparent;
    cursor: pointer;
    z-index: 5;
    color: transparent;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .22s ease, filter .22s ease, box-shadow .22s ease;
  }
  .book-hit.sas1 { left: 18.0%; }
  .book-hit.sas2 { left: 51.7%; }
  .book-hit:hover, .book-hit:focus-visible {
    transform: translateY(-1.2%) scale(1.035);
    filter: brightness(1.08);
  }
  .book-hit.sas1:hover, .book-hit.sas1:focus-visible {
    box-shadow: 0 0 24px 9px var(--blue-glow), inset 0 0 20px rgba(255,255,255,.16);
  }
  .book-hit.sas2:hover, .book-hit.sas2:focus-visible {
    box-shadow: 0 0 24px 9px var(--purple-glow), inset 0 0 20px rgba(255,255,255,.16);
  }
  .book-hit:active { transform: translateY(1%) scale(.975); }
  .book-hit:focus-visible { outline: 4px solid white; outline-offset: 4px; }
  .hint {
    position: absolute; left: 50%; bottom: 2.1%;
    transform: translateX(-50%);
    z-index: 8;
    padding: .45em 1em;
    border-radius: 999px;
    color: white;
    font-size: clamp(10px, 1.05vw, 16px);
    font-weight: 800;
    letter-spacing: .04em;
    text-shadow: 0 2px 4px #16416b;
    background: rgba(10, 54, 105, .42);
    border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(5px);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .artboard:hover .hint { opacity: 1; }
  /* HP portrait: kanvas landscape diputar dan diskalakan agar seluruh menu terlihat. */
  @media (max-aspect-ratio: 4/5) {
     .artboard {
       width: min(100vh, 177.7778vw);
       height: min(56.25vh, 100vw);
       max-width: none;
       max-height: none;
       transform: rotate(90deg);
       transform-origin: center;
       flex: none;
     }
     .hint {
       opacity: 1;
       font-size: clamp(9px, 2.1vmin, 14px);
       bottom: 1.5%;
     }
     .toast {
       width: min(88vw, 420px);
       padding: 10px 14px;
       font-size: clamp(13px, 3.5vw, 17px);
     }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
