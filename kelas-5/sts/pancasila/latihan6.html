/* =========================================================
   MULAI KUIS DARI SESSION ONLINE
========================================================= */

function mulaiKuisDariSession(data) {

    if (
        !data ||
        !data.nama ||
        !data.kelas ||
        !data.sessionId
    ) {

        return;

    }


    dataNama =
        data.nama || "";


    dataKelas =
        data.kelas || "";


    dataAbsen =
        data.nomorAbsen ||
        data.absen ||
        "";


    indeks = 0;

    benar = 0;

    pancasilaNilaiSudahDikirim = false;

    pancasilaPengirimanNilaiSedangBerjalan = false;


    const loading =
        document.getElementById(
            "onlineLoading"
        );


    if (loading) {

        loading.classList.add(
            "hidden"
        );

    }


    document
        .getElementById("areaKuis")
        .classList
        .remove("hidden");


    acakArray(soal);


    soal.forEach(
        s => {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    let gabung =

        s.a.map(
            (teks, i) => ({

                teks:
                    teks,

                benar:
                    i === s.k

            })
        );


    for (
        let i = gabung.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            gabung[i],
            gabung[j]
        ] = [

            gabung[j],
            gabung[i]

        ];

    }


    s.a =

        gabung.map(
            o =>
                o.teks
        );


    s.k =

        gabung.findIndex(
            o =>
                o.benar
        );

}

/* =========================================================

========================================================= */

const PANCASILA_SCORE_ACTION =
    "submitScore";


let pancasilaNilaiSudahDikirim =
    false;


let pancasilaPengirimanNilaiSedangBerjalan =
    false;


/* =========================================================
   FUNGSI SIMPAN NILAI
========================================================= */

async function simpanNilaiKeServer(

    nama,
    kelas,
    absen,
    nilai,
    jumlahBenar,
    totalSoal

){

    if(
        pancasilaNilaiSudahDikirim ||
        pancasilaPengirimanNilaiSedangBerjalan
    ){

        return {
            success: true,
            duplicate: true
        };

    }


    pancasilaPengirimanNilaiSedangBerjalan =
        true;


    const loginData =
        pancasilaGetLoginData();


    const sessionId =
        loginData &&
        loginData.sessionId
            ? loginData.sessionId
            : "";


    const nilaiAman =
        Math.max(
            0,
            Math.min(
                100,
                Number(nilai) || 0
            )
        );


    const benarAman =
        Math.max(
            0,
            Number(jumlahBenar) || 0
        );


    const totalAman =
        Math.max(
            0,
            Number(totalSoal) || 0
        );


    const persentase =
        totalAman > 0
            ? Number(
                (
                    benarAman /
                    totalAman *
                    100
                ).toFixed(2)
            )
            : nilaiAman;


    const payload = {

        action:
            PANCASILA_SCORE_ACTION,

        sessionId:
            sessionId,

        nama:
            nama ||
            (loginData && loginData.nama) ||
            "",

        kelas:
            kelas ||
            (loginData && loginData.kelas) ||
            "",

        nomorAbsen:
            absen ||
            (loginData && (
                loginData.nomorAbsen ||
                loginData.absen
            )) ||
            "",

        absen:
            absen ||
            (loginData && (
                loginData.absen ||
                loginData.nomorAbsen
            )) ||
            "",

        namaKuis:
            "Soal Latihan 6 STS 1 Pancasila Kelas 5",

        quizName:
            "Soal Latihan 6 STS 1 Pancasila Kelas 5",

        nilai:
            nilaiAman,

        skor:
            nilaiAman,

        score:
            nilaiAman,

        benar:
            benarAman,

        jumlahBenar:
            benarAman,

        totalSoal:
            totalAman,

        jumlahSoal:
            totalAman,

        persentase:
            persentase,

        percentage:
            persentase,

        halaman:
            PANCASILA_HALAMAN_UTAMA,

        sumber:
            "Petualangan Kelas 5",

        waktu:
            new Date().toISOString(),

        timestamp:
            Date.now(),

        jenis:
            "hasil_kuis"

    };


    console.log(
        "========================================"
    );


    console.log(
        "📤 MENGIRIM NILAI KE SERVER"
    );


    console.log(
        "🆔 Session ID:",
        payload.sessionId
    );


    console.log(
        "👤 Nama:",
        payload.nama
    );


    console.log(
        "🏫 Kelas:",
        payload.kelas
    );


    console.log(
        "🔢 Absen:",
        payload.nomorAbsen
    );


    console.log(
        "📝 Kuis:",
        payload.namaKuis
    );


    console.log(
        "🎯 Nilai:",
        payload.nilai
    );


    console.log(
        "✅ Benar:",
        payload.benar,
        "/",
        payload.totalSoal
    );


    try{

        const result =
            await pancasilaRequestJSONP(
                payload,
                15000
            );


        console.log(
            "📥 RESPONS SERVER NILAI:",
            result
        );


        if(
            result &&
            result.success === true
        ){

            pancasilaNilaiSudahDikirim =
                true;


            console.log(
                "✅ NILAI BERHASIL DISIMPAN DI SERVER / DATABASE"
            );


            pancasilaTampilkanStatusPenyimpananNilai(
                true,
                result.message ||
                "Nilai berhasil tersimpan di server."
            );


            return result;

        }


        const message =
            result &&
            result.message
                ? result.message
                : "Server belum mengonfirmasi penyimpanan nilai.";


        console.warn(
            "⚠️ NILAI BELUM DIKONFIRMASI SERVER:",
            result
        );


        pancasilaTampilkanStatusPenyimpananNilai(
            false,
            message
        );


        return result || {
            success: false,
            message: message
        };

    }catch(error){

        console.error(
            "❌ GAGAL MENGIRIM NILAI KE SERVER:",
            error
        );


        pancasilaTampilkanStatusPenyimpananNilai(
            false,
            "Nilai belum tersimpan. Periksa koneksi lalu coba lagi."
        );


        return {
            success: false,
            error: String(error)
        };

    }finally{

        pancasilaPengirimanNilaiSedangBerjalan =
            false;

    }

}

/* =====================================================
   SISTEM ONLINE SISWA - Pancasila

   Mengikuti sistem online pada halaman
   STS utama dan Petualangan Kelas 5.

   Fungsi:
   - Membaca identitas siswa
   - Memeriksa sessionId
   - Cek sesi server
   - Batas sesi client 24 jam
   - Heartbeat setiap 20 detik
   - Heartbeat saat aktivitas
   - Heartbeat saat tab aktif kembali
   - Status online
   - Proteksi navigasi
===================================================== */


/* =====================================================
   KONFIGURASI API
===================================================== */

const PANCASILA_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec";


/* =====================================================
   NAMA HALAMAN
===================================================== */

const PANCASILA_HALAMAN_UTAMA =
    "STS 1 - Pancasila | Latihan 6";


/* =====================================================
   INTERVAL HEARTBEAT
===================================================== */

const PANCASILA_HEARTBEAT_INTERVAL =
    20000;


/* =====================================================
   BATAS SESI CLIENT
===================================================== */

const PANCASILA_SESSION_MAX_AGE =
    24 * 60 * 60 * 1000;


/* =====================================================
   KUNCI STORAGE
===================================================== */

const PANCASILA_LOGIN_STORAGE_KEY =
    "identitasPetualanganKelas5";


/* =====================================================
   VARIABEL HEARTBEAT
===================================================== */

let pancasilaHeartbeatTimer =
    null;


let pancasilaLastHeartbeat =
    0;


let pancasilaActivityTimer =
    null;


let pancasilaSedangLogout =
    false;


let pancasilaSedangRedirect =
    false;


/* =====================================================
   BACA DATA LOGIN
===================================================== */

function pancasilaGetLoginData(){

    const storages = [

        window.localStorage,

        window.sessionStorage

    ];


    for(
        const storage
        of storages
    ){

        try{

            const raw =
                storage.getItem(
                    PANCASILA_LOGIN_STORAGE_KEY
                );


            if(
                !raw
            ){

                continue;

            }


            const data =
                JSON.parse(
                    raw
                );


            if(
                data &&
                typeof data === "object"
            ){

                return data;

            }

        }catch(error){

            console.log(
                "Pancasila: gagal membaca data login:",
                error
            );

        }

    }


    return null;

}


/* =====================================================
   SIMPAN DATA LOGIN
===================================================== */

function pancasilaSaveLoginData(
    data
){

    if(
        !data
    ){

        return;

    }


    try{

        localStorage.setItem(
            PANCASILA_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.log(
            "Pancasila: gagal menyimpan localStorage:",
            error
        );

    }


    try{

        sessionStorage.setItem(
            PANCASILA_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.log(
            "Pancasila: gagal menyimpan sessionStorage:",
            error
        );

    }

}


/* =====================================================
   HAPUS DATA LOGIN
===================================================== */

function pancasilaClearLoginData(){

    try{

        localStorage.removeItem(
            PANCASILA_LOGIN_STORAGE_KEY
        );

    }catch(error){}


    try{

        sessionStorage.removeItem(
            PANCASILA_LOGIN_STORAGE_KEY
        );

    }catch(error){}

}


/* =====================================================
   CEK DATA LOGIN LENGKAP
===================================================== */

function pancasilaLoginDataIsComplete(
    data
){

    return Boolean(

        data &&
        data.nama &&
        data.kelas &&
        data.sessionId

    );

}


/* =====================================================
   CEK SESI CLIENT 24 JAM
===================================================== */

function pancasilaClientSessionExpired(
    data
){

    if(
        !data ||
        !data.loginAt
    ){

        return true;

    }


    const loginTime =
        Number(
            data.loginAt
        );


    if(
        !Number.isFinite(
            loginTime
        )
    ){

        return true;

    }


    return (

        Date.now() -
        loginTime

    ) >=
        PANCASILA_SESSION_MAX_AGE;

}

   TAMPILKAN DATA SISWA
===================================================== */

function pancasilaTampilkanDataSiswa(

){

   STATUS ONLINE
===================================================== */

function pancasilaSetStatusOnline(

){

        );

        );

}


/* =====================================================
   JSONP REQUEST
===================================================== */

function pancasilaRequestJSONP(
    params,
    timeout
){

    return new Promise(
        function(resolve, reject){

            const callbackName =
                "pancasilaOnlineCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2,8);


            let selesai =
                false;


            const script =
                document.createElement(
                    "script"
                );


            const query =
                new URLSearchParams(
                    params
                );


            query.set(
                "callback",
                callbackName
            );


            query.set(
                "t",
                Date.now()
            );


            const timer =
                setTimeout(
                    function(){

                        if(
                            selesai
                        ){

                            return;

                        }


                        selesai =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "Request JSONP timeout"
                            )
                        );

                    },
                    timeout || 10000
                );


            function cleanup(){

                clearTimeout(
                    timer
                );


                try{

                    delete window[
                        callbackName
                    ];

                }catch(error){

                    window[
                        callbackName
                    ] =
                        undefined;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

            }


            window[
                callbackName
            ] =
                function(data){

                    if(
                        selesai
                    ){

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    resolve(
                        data
                    );

                };


            script.onerror =
                function(){

                    if(
                        selesai
                    ){

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "JSONP gagal dimuat"
                        )
                    );

                };


            script.src =
                PANCASILA_API_URL +
                "?" +
                query.toString();


            script.async =
                true;


            document
                .head
                .appendChild(
                    script
                );

        }
    );

}


/* =====================================================
   REDIRECT KE HALAMAN IDENTITAS
===================================================== */

function pancasilaRedirectKeIdentitas(
    alasan
){

    if(
        pancasilaSedangRedirect
    ){

        return;

    }


    pancasilaSedangRedirect =
        true;


    clearInterval(
        pancasilaHeartbeatTimer
    );


    pancasilaHeartbeatTimer =
        null;


    pancasilaClearLoginData();


    let url =
        "../../identitas.html";


    if(
        alasan
    ){

        url +=
            "?alasan=" +
            encodeURIComponent(
                alasan
            );

    }


    window.location.replace(
        url
    );

}


/* =====================================================
   CEK SESI KE SERVER
===================================================== */

async function pancasilaCheckSession(){

    const loginData =
        pancasilaGetLoginData();


    if(
        !pancasilaLoginDataIsComplete(
            loginData
        )
    ){

        pancasilaRedirectKeIdentitas(
            "login"
        );

        return false;

    }


    if(
        pancasilaClientSessionExpired(
            loginData
        )
    ){

        pancasilaRedirectKeIdentitas(
            "expired"
        );

        return false;

    }


    try{

        const result =
            await pancasilaRequestJSONP(
                {

                    action:
                        "checksession",

                    sessionId:
                        loginData.sessionId

                },
                10000
            );


        console.log(
            "Pancasila - hasil checksession:",
            result
        );


        if(
            !result ||
            result.success !== true ||
            result.loggedIn !== true
        ){

            pancasilaRedirectKeIdentitas(
                "invalid"
            );

            return false;

        }


        if(
            result.session
        ){

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            pancasilaSaveLoginData(
                updated
            );


            pancasilaTampilkanDataSiswa(
                updated
            );

        }


        pancasilaSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;

    }catch(error){

        console.warn(
            "Pancasila: cek sesi sementara gagal:",
            error
        );


        pancasilaSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;

    }

}


/* =====================================================
   KIRIM HEARTBEAT
===================================================== */

async function pancasilaSendHeartbeat(){

    if(
        pancasilaSedangRedirect ||
        pancasilaSedangLogout
    ){

        return;

    }


    const loginData =
        pancasilaGetLoginData();

        !pancasilaLoginDataIsComplete(

                result.session.kelas
            );


            console.log(
                "🔢 Absen SERVER:",
                result.session.nomorAbsen
            );


            console.log(
                "📄 Halaman SERVER:",
                result.session.halaman
            );


            console.log(
                "🕐 Login At SERVER:",
                result.session.loginAt
            );


            console.log(
                "🕐 Last Seen SERVER:",
                result.session.lastSeen
            );


            console.log(
                "🟢 Status SERVER:",
                result.session.status
            );


            console.log(
                "----------------------------------------"
            );

        }


        if(
            !result ||
            result.success !== true
        ){

            const status =
                String(
                    result &&
                    result.status
                    ||
                    ""
                ).toLowerCase();


            console.warn(
                "Pancasila: heartbeat tidak berhasil.",
                result
            );


            if(

                status ===
                    "expired"

                ||

                status ===
                    "not_logged_in"

                ||

                status ===
                    "invalid_session"

            ){

                console.error(
                    "🚨 Pancasila: SESSION TIDAK VALID / EXPIRED"
                );


                pancasilaRedirectKeIdentitas(
                    "expired"
                );


                return;

            }


            pancasilaSetStatusOnline(
                true,
                "🟢 Online"
            );


            return;

        }


        if(
            result.session
        ){

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            console.log(
                "🔍 SESSION ID SEBELUM:",
                loginData.sessionId
            );


            console.log(
                "🔍 SESSION ID SESUDAH:",
                updated.sessionId
            );


            if(
                loginData.sessionId !==
                updated.sessionId
            ){

                console.warn(
                    "⚠️ PERINGATAN: SESSION ID BERUBAH!"
                );

            }else{

                console.log(
                    "✅ Session ID tetap sama."
                );

            }


            pancasilaSaveLoginData(
                updated
            );


            pancasilaTampilkanDataSiswa(
                updated
            );

        }


        pancasilaSetStatusOnline(
            true,
            "🟢 Online"
        );


        console.log(
            "🟢 Pancasila ONLINE:",
            new Date()
                .toLocaleTimeString()
        );


        console.log(
            "========================================"
        );


    }catch(error){

        console.warn(
            "Pancasila: heartbeat gagal sementara:",
            error
        );


        pancasilaSetStatusOnline(
            true,
            "🟢 Online"
        );


        console.log(
            "Heartbeat berikutnya akan mencoba kembali."
        );


        console.log(
            "========================================"
        );

    }

}

function pancasilaStartHeartbeat(){

        pancasilaHeartbeatTimer

        clearInterval(
            pancasilaHeartbeatTimer
        );

    }


    pancasilaSendHeartbeat();


    pancasilaHeartbeatTimer =
        setInterval(

}

        .querySelectorAll(

                            pancasilaRedirectKeIdentitas(
                                "expired"
                            );


                            return;

                        pancasilaSendHeartbeat();

                    }
                );

            }
        );


    const backButton =
        document.querySelector(

        );


    if(
        backButton
    ){

                const loginData =
                    pancasilaGetLoginData();

                    !pancasilaLoginDataIsComplete(
                        loginData
                    )
                ){

                    event.preventDefault();


                    pancasilaRedirectKeIdentitas(
                        "login"
                    );

                }


                if(
                    pancasilaClientSessionExpired(
                        loginData
                    )
                ){

                    event.preventDefault();


                    pancasilaRedirectKeIdentitas(
                        "expired"
                    );


                    return;

                }


                pancasilaSendHeartbeat();

            }
        );

    }

}
