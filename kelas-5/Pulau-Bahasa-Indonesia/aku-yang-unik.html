<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal Bahasa Indonesia Kelas 5</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#2563eb,#06b6d4,#14b8a6);min-height:100vh;color:#1f2937}
.hidden{display:none!important}
.screen{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center}
.card{width:min(900px,100%);background:rgba(255,255,255,.96);border-radius:24px;padding:24px;box-shadow:0 15px 45px rgba(0,0,0,.2)}
h1,h2,p{margin-top:0}
.start{text-align:center;max-width:560px}
.emoji{font-size:60px}
.title{color:#075985;font-size:30px;font-weight:800}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(90deg,#2563eb,#06b6d4);color:white}
.secondary{background:#e5e7eb;color:#374151}
.danger{background:#ef4444;color:white}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.badge{padding:9px 14px;border-radius:12px;font-weight:700;background:#e0f2fe;color:#075985}
.score{background:#fef3c7;color:#92400e}
.hearts{font-size:24px}
.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4);transition:.3s}
.question{font-size:19px;line-height:1.6;font-weight:700;margin-bottom:15px}
.question-image{display:block;max-width:100%;max-height:260px;margin:10px auto 18px;border-radius:12px;object-fit:contain}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{border:2px solid #cbd5e1;background:white;border-radius:14px;padding:14px;text-align:left;font-size:16px;cursor:pointer;transition:.2s}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.option:disabled{cursor:default}
.feedback{min-height:34px;text-align:center;font-weight:700;margin:14px 0}
.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.selector{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}
.qnum{padding:10px;border:0;border-radius:10px;background:#e5e7eb;font-weight:700;cursor:pointer}
.qnum.current{background:#2563eb;color:#fff}
.qnum.done{background:#16a34a;color:#fff}
.result{text-align:center}
.final-score{font-size:56px;font-weight:900;color:#2563eb}
.review{text-align:left;background:#f8fafc;border-radius:14px;padding:15px;margin-top:15px}
.small{font-size:13px;color:#64748b}
@media(max-width:650px){
 .card{padding:17px;border-radius:18px}
 .question{font-size:17px}
 .options{grid-template-columns:1fr}
 .selector{grid-template-columns:repeat(5,1fr)}
 .btn{font-size:14px;padding:10px 14px}
}
</style>
</head>
<body>

<section id="startScreen" class="screen">
  <div class="card start">
    <div class="emoji">📚</div>
    <h1 class="title">Latihan Soal Bahasa Indonesia Kelas 5</h1>
    <p>20 soal pilihan ganda. Bacalah soal dengan teliti, kemudian pilih jawaban A, B, C, atau D.</p>
    <p class="small">Jawaban benar = +10 poin. Skor maksimal = 200.</p>
    <button class="btn primary" onclick="startGame()">🚀 Mulai Mengerjakan</button>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="card">
    <div class="top">
      <button class="btn secondary" onclick="toggleSelector()">📋 Pilih Soal</button>
      <div class="badge" id="number">Soal 1/20</div>
      <div class="badge score">Skor: <span id="score">0</span></div>
    </div>
    <div class="hearts" id="hearts">❤️ ❤️ ❤️</div>
    <div class="progress"><div id="progress"></div></div>

    <div id="question" class="question"></div>
    <img id="questionImage" class="question-image hidden" alt="Gambar soal">

    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>

    <div class="footer-actions">
      <button class="btn secondary" onclick="previousQuestion()">⬅ Sebelumnya</button>
      <button class="btn primary" id="nextBtn" onclick="nextQuestion()">Berikutnya ➡</button>
    </div>

    <div id="selector" class="hidden">
      <hr>
      <h3>Pilih Nomor Soal</h3>
      <div id="selectorGrid" class="selector"></div>
    </div>
  </div>
</section>

<section id="resultScreen" class="screen hidden">
  <div class="card result">
    <div class="emoji">🎉</div>
    <h2>Latihan Selesai!</h2>
    <p>Skor Akhir</p>
    <div id="finalScore" class="final-score">0</div>
    <p id="finalMessage"></p>
    <div id="review" class="review"></div>
    <button class="btn primary" onclick="restartGame()">🔄 Kerjakan Lagi</button>
  </div>
</section>

<script>

},
{
 q:`Kalimat majemuk setara yang sejalan ditunjukkan oleh nomor...
1. Adit rajin belajar, sehingga ia memperoleh peringkat 1 di kelas.
2. Gita suka bermain piano, sedangkan Chika suka bermain gitar.
3. Nopita dapat segera menemukan kancing yang tercecer di jalan karena ia memiliki mata yang jeli.
4. Kerajinan pot bunga dari barang bekas tersebut dibuat oleh Bayu dan Widi.`,
 options:["A. 1","B. 2","C. 3","D. 4"], answer:1
},
{
 q:"Nancy pandai berhitung. Nancy tidak pandai menyanyi. Kata penghubung yang tepat untuk melengkapi dua kalimat tunggal di atas, agar menjadi sebuah kalimat majemuk yaitu.....",

}
];

let current=0, score=0, selected=null;
let answered=Array(questions.length).fill(false);

function show(id){
  ["startScreen","gameScreen","resultScreen"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function startGame(){
  current=0; score=0; selected=null;
  answered=Array(questions.length).fill(false);
  document.getElementById("score").textContent=score;
  show("gameScreen");
  renderQuestion();
}
function renderQuestion(){
  const q=questions[current];
  document.getElementById("number").textContent=`Soal ${current+1}/${questions.length}`;
  document.getElementById("question").innerHTML=q.q.replace(/\n/g,"<br>");
  const img=document.getElementById("questionImage");
  if(q.image){img.src=q.image;img.classList.remove("hidden");}
  else{img.src="";img.classList.add("hidden");}
  const options=document.getElementById("options");
  options.innerHTML="";
  selected=null;
  q.options.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="option";
    b.innerHTML=text;
    b.onclick=()=>choose(i);
    options.appendChild(b);
  });
  document.getElementById("feedback").textContent="";
  document.getElementById("nextBtn").textContent=current===questions.length-1?"🏁 Selesai":"Berikutnya ➡";
  document.getElementById("progress").style.width=((current+1)/questions.length*100)+"%";
  renderSelector();
}
function choose(i){
  if(answered[current])return;
  selected=i;
  document.querySelectorAll(".option").forEach((b,n)=>{
    b.classList.toggle("selected",n===i);
  });
  checkAnswer();
}
function checkAnswer(){
  const q=questions[current];
  const buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  if(selected===q.answer){
    score+=10;
    document.getElementById("score").textContent=score;
    buttons[selected].classList.add("correct");
    document.getElementById("feedback").textContent="✅ Benar! +10 poin";
    document.getElementById("feedback").style.color="#15803d";
  }else{
    buttons[selected].classList.add("wrong");
    buttons[q.answer].classList.add("correct");
    document.getElementById("feedback").textContent="❌ Belum tepat. Jawaban benar: "+q.options[q.answer];
    document.getElementById("feedback").style.color="#b91c1c";
  }
  answered[current]=true;
  renderSelector();
}
function nextQuestion(){
  if(!answered[current]){
    document.getElementById("feedback").textContent="⚠️ Pilih salah satu jawaban terlebih dahulu.";
    document.getElementById("feedback").style.color="#b45309";
    return;
  }
  if(current<questions.length-1){current++;renderQuestion();}
  else{finishGame();}
}
function previousQuestion(){
  if(current>0){current--;renderQuestion();}
}
function finishGame(){
  show("resultScreen");
  document.getElementById("finalScore").textContent=score+"/200";
  let msg=score>=180?"🌟 Sangat baik!":"👍 Tetap semangat belajar dan berlatih!";
  if(score<100)msg="💪 Jangan menyerah. Ayo belajar dan coba lagi!";
  document.getElementById("finalMessage").textContent=msg;
  const review=document.getElementById("review");
  review.innerHTML="<b>Ringkasan:</b><br>"+questions.map((q,i)=>
    `${i+1}. ${q.options[q.answer]}`
  ).join("<br>");
}
function restartGame(){startGame();}
function toggleSelector(){
  document.getElementById("selector").classList.toggle("hidden");
}
function renderSelector(){
  const grid=document.getElementById("selectorGrid");
  grid.innerHTML="";
  questions.forEach((q,i)=>{
    const b=document.createElement("button");
    b.className="qnum";
    b.textContent=i+1;
    if(i===current)b.classList.add("current");
    if(answered[i])b.classList.add("done");
    b.onclick=()=>{current=i;renderQuestion();document.getElementById("selector").classList.add("hidden");};
    grid.appendChild(b);
  });
}
</script>
</body>
</html>
