========================================================= */

let dataNama = "";
let dataKelas = "";
let dataAbsen = "";

let indeks = 0;
let benar = 0;


/* =========================================================
   MULAI KUIS
========================================================= */

function mulaiKuisDariSession(data) {

    if (
        !data ||
        !data.nama ||
        !data.kelas ||
        !data.sessionId
    ) {
        return;
    }


    dataNama =
        data.nama || "";


    dataKelas =
        data.kelas || "";


    dataAbsen =
        data.nomorAbsen ||
        data.absen ||
        "";


    indeks = 0;
    benar = 0;


    SENI_NILAI_SUDAH_DIKIRIM =
        false;


    SENI_PENGIRIMAN_NILAI_SEDANG_BERJALAN =
        false;


    const loading =
        document.getElementById(
            "onlineLoading"
        );


    if (loading) {

        loading.classList.add(
            "hidden"
        );

    }


    const areaKuis =
        document.getElementById(
            "areaKuis"
        );


    if (areaKuis) {

        areaKuis.classList.remove(
            "hidden"
        );

    }


    acakArray(soal);


    soal.forEach(
        function(s) {
            acakJawabanSoal(s);
        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK ARRAY
========================================================= */

function acakArray(arr) {

    if (
        !Array.isArray(arr) ||
        arr.length < 2
    ) {
        return;
    }


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

}


/* =========================================================
   ACAK PILIHAN JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    if (
        !s ||
        !Array.isArray(s.a) ||
        s.a.length === 0
    ) {
        return;
    }


    const kunciAsli =
        Array.isArray(s.k)
            ? s.k.slice()
            : [s.k];


    const gabung =
        s.a.map(
            function(teks, i) {

                return {
                    teks: teks,
                    benar:
                        kunciAsli.includes(i)
                };

            }
        );


    acakArray(gabung);


    s.a =
        gabung.map(
            function(o) {
                return o.teks;
            }
        );


    if (s.kompleks) {

        s.k =
            gabung
                .map(
                    function(o, i) {

                        return o.benar
                            ? i
                            : -1;

                    }
                )
                .filter(
                    function(i) {
                        return i >= 0;
                    }
                );

    } else {

        s.k =
            gabung.findIndex(
                function(o) {
                    return o.benar;
                }
            );

    }

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal() {

    const quiz =
        document.getElementById(
            "quiz"
        );


    if (!quiz) {
        return;
    }


    /* =====================================================
       SELESAI
    ===================================================== */

    if (
        indeks >= soal.length
    ) {

        const nilai =
            soal.length > 0
                ? Math.round(
                    (
                        benar /
                        soal.length
                    ) * 100
                )
                : 0;


        simpanNilaiKeServer(
            dataNama,
            dataKelas,
            dataAbsen,
            nilai,
            benar,
            soal.length
        );


        let kelasWarna =
            "nilai-merah";


        if (nilai >= 80) {

            kelasWarna =
                "nilai-hijau";

        } else if (nilai >= 60) {

            kelasWarna =
                "nilai-kuning";

        }


        quiz.innerHTML = `

            <div class="hasil-box">

                <h2>
                    🎉 Kuis Selesai!
                </h2>

                <p>
                    Hebat,
                    <b>${escapeHTML(dataNama)}</b>!
                </p>

                <p>
                    Jawaban benar:
                    <b>${benar}</b>
                    dari
                    <b>${soal.length}</b>
                    soal
                </p>

                <div>

                    <p>
                        <b>Nilai Kamu:</b>
                    </p>

                    <div
                        class="nilai-besar ${kelasWarna}"
                    >
                        ${nilai}
                    </div>

                </div>

                <div
                    id="statusPenyimpananNilai"
                    class="status-penyimpanan-nilai"
                >
                    🟡 Menyimpan nilai ke server...
                </div>

                <br>

                <button
                    type="button"
                    onclick="ulangiKuis()"
                >
                    🔄 Ulangi Kuis
                </button>

                <button
                    type="button"
                    onclick="keluarKuis()"
                >
                    ❌ Selesai
                </button>

            </div>

        `;


        return;

    }


    const s =
        soal[indeks];


    if (!s) {
        return;
    }


    const pilihanKompleks =
        s.kompleks === true;


    const jenisInput =
        pilihanKompleks
            ? "checkbox"
            : "radio";


    let petunjuk =
        "";


    if (pilihanKompleks) {

        petunjuk = `

            <div class="petunjuk-kompleks">

                ☑️ Pilihan Ganda Kompleks:
                pilih semua jawaban yang benar.

            </div>

        `;

    }


    quiz.innerHTML = `

        <div class="nomor-soal">

            📝 Soal
            ${indeks + 1}
            dari
            ${soal.length}

        </div>


        <div class="kotak-soal">

            ${s.q}

        </div>


        ${petunjuk}


        <div class="answers">

            ${s.a.map(

                function(j, i) {

                    return `

                        <label>

                            <input
                                type="${jenisInput}"
                                name="jawaban"
                                value="${i}"
                                onclick="mainkanSuaraKlik()"
                            />

                            ${j}

                        </label>

                    `;

                }

            ).join('')}

        </div>


        <button
            type="button"
            onclick="periksaJawaban()"
        >
            ➡️ Next
        </button>

    `;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value == null
                ? ""
                : value
        );


    return div.innerHTML;

}


/* =========================================================
   PERIKSA JAWABAN
========================================================= */

function periksaJawaban() {

    const soalSekarang =
        soal[indeks];


    if (!soalSekarang) {
        return;
    }


    /* =====================================================
       PILIHAN GANDA KOMPLEKS
    ===================================================== */

    if (
        soalSekarang.kompleks === true
    ) {

        const jawabanDipilih =
            Array.from(
                document.querySelectorAll(
                    'input[name="jawaban"]:checked'
                )
            ).map(
                function(input) {
                    return parseInt(
                        input.value,
                        10
                    );
                }
            );


        if (
            jawabanDipilih.length === 0
        ) {

            mainkanSuaraPeringatan();


            tampilkanPeringatan(
                "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +
                "Nomor ini memiliki lebih dari satu jawaban yang benar. " +
                "Pilih semua jawaban yang menurutmu benar sebelum lanjut! 💡"
            );


            return;

        }


        const kunci =
            Array.isArray(
                soalSekarang.k
            )
                ? soalSekarang.k
                    .slice()
                    .sort(
                        function(a, b) {
                            return a - b;
                        }
                    )
                : [
                    soalSekarang.k
                ];


        const jawabanUrut =
            jawabanDipilih
                .slice()
                .sort(
                    function(a, b) {
                        return a - b;
                    }
                );


        const benarSemua =
            kunci.length ===
            jawabanUrut.length &&
            kunci.every(
                function(nilai, i) {
                    return nilai ===
                        jawabanUrut[i];
                }
            );


        if (benarSemua) {

            benar++;

        }


        indeks++;


        mainkanSuaraNext();


        tampilkanSoal();


        return;

    }


    /* =====================================================
       PILIHAN GANDA BIASA
    ===================================================== */

    const jawaban =
        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if (!jawaban) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(
            "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +
            "Ayo pilih salah satu jawaban terlebih dahulu " +
            "sebelum lanjut ke soal berikutnya! 💡"
        );


        return;

    }


    if (
        parseInt(
            jawaban.value,
            10
        ) === soalSekarang.k
    ) {

        benar++;

    }


    indeks++;


    mainkanSuaraNext();


    tampilkanSoal();

}

========================================================= */

const SENI_SCORE_ACTION =
    "submitScore";


let SENI_NILAI_SUDAH_DIKIRIM =
    false;


let SENI_PENGIRIMAN_NILAI_SEDANG_BERJALAN =
    false;


/* =========================================================
   SIMPAN NILAI KE SERVER
========================================================= */

async function simpanNilaiKeServer(
    nama,
    kelas,
    absen,
    nilai,
    jumlahBenar,
    totalSoal
) {

    if (
        SENI_NILAI_SUDAH_DIKIRIM ||
        SENI_PENGIRIMAN_NILAI_SEDANG_BERJALAN
    ) {

        return {
            success: true,
            duplicate: true
        };

    }


    SENI_PENGIRIMAN_NILAI_SEDANG_BERJALAN =
        true;


    const loginData =
        seniGetLoginData();


    const sessionId =
        loginData &&
        loginData.sessionId
            ? loginData.sessionId
            : "";


    const nilaiAman =
        Math.max(
            0,
            Math.min(
                100,
                Number(nilai) || 0
            )
        );


    const benarAman =
        Math.max(
            0,
            Number(jumlahBenar) || 0
        );


    const totalAman =
        Math.max(
            0,
            Number(totalSoal) || 0
        );


    const persentase =
        totalAman > 0
            ? Number(
                (
                    benarAman /
                    totalAman *
                    100
                ).toFixed(2)
            )
            : nilaiAman;


    const payload = {

        action:
            SENI_SCORE_ACTION,

        sessionId:
            sessionId,

        nama:
            nama ||
            (
                loginData &&
                loginData.nama
            ) ||
            "",

        kelas:
            kelas ||
            (
                loginData &&
                loginData.kelas
            ) ||
            "",

        nomorAbsen:
            absen ||
            (
                loginData &&
                (
                    loginData.nomorAbsen ||
                    loginData.absen
                )
            ) ||
            "",

        absen:
            absen ||
            (
                loginData &&
                (
                    loginData.absen ||
                    loginData.nomorAbsen
                )
            ) ||
            "",

        namaKuis:
            SENI_HALAMAN_UTAMA,

        quizName:
            SENI_HALAMAN_UTAMA,

        nilai:
            nilaiAman,

        skor:
            nilaiAman,

        score:
            nilaiAman,

        benar:
            benarAman,

        jumlahBenar:
            benarAman,

        totalSoal:
            totalAman,

        jumlahSoal:
            totalAman,

        persentase:
            persentase,

        percentage:
            persentase,

        halaman:
            SENI_HALAMAN_UTAMA,

        sumber:
            "Petualangan Kelas 5",

        waktu:
            new Date().toISOString(),

        timestamp:
            Date.now(),

        jenis:
            "hasil_kuis"

    };


    console.log(
        "📤 MENGIRIM NILAI SENI DAN BUDAYA KE SERVER"
    );


    try {

        const result =
            await seniRequestJSONP(
                payload,
                15000
            );


        console.log(
            "📥 RESPONS SERVER:",
            result
        );


        if (
            result &&
            result.success === true
        ) {

            SENI_NILAI_SUDAH_DIKIRIM =
                true;


            seniTampilkanStatusPenyimpananNilai(
                true,
                result.message ||
                "Nilai Seni dan Budaya berhasil tersimpan di server."
            );


            return result;

        }


        const message =
            result &&
            result.message
                ? result.message
                : "Server belum mengonfirmasi penyimpanan nilai Seni dan Budaya.";


        seniTampilkanStatusPenyimpananNilai(
            false,
            message
        );


        return result || {
            success: false,
            message: message
        };


    } catch (error) {

        console.error(
            "❌ Gagal mengirim nilai:",
            error
        );


        seniTampilkanStatusPenyimpananNilai(
            false,
            "Nilai belum tersimpan. Periksa koneksi lalu coba lagi."
        );


        return {
            success: false,
            error: String(error)
        };


    } finally {

        SENI_PENGIRIMAN_NILAI_SEDANG_BERJALAN =
            false;

    }

}

const SENI_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec";


const SENI_HALAMAN_UTAMA =
    "Soal Latihan 2 STS 1 Seni dan Budaya Kelas 5";


const SENI_HEARTBEAT_INTERVAL =
    20000;


const SENI_SESSION_MAX_AGE =
    24 * 60 * 60 * 1000;


const SENI_LOGIN_STORAGE_KEY =
    "identitasPetualanganKelas5";


/* =========================================================
   VARIABEL SISTEM ONLINE
========================================================= */

let seniHeartbeatTimer =
    null;


let seniLastHeartbeat =
    0;


let seniActivityTimer =
    null;


let seniSedangLogout =
    false;


let seniSedangRedirect =

/* =========================================================
   BACA LOGIN
========================================================= */

function seniGetLoginData() {

    const storages = [

        window.localStorage,

        window.sessionStorage

    ];


    for (
        const storage
        of storages
    ) {

        try {

            const raw =
                storage.getItem(
                    SENI_LOGIN_STORAGE_KEY
                );


            if (!raw) {
                continue;
            }


            const data =
                JSON.parse(raw);


            if (
                data &&
                typeof data === "object"
            ) {

                return data;

            }


        } catch (error) {

            console.log(
                "Seni: gagal membaca data login:",
                error
            );

        }

    }


    return null;

}


/* =========================================================
   SIMPAN LOGIN
========================================================= */

function seniSaveLoginData(data) {

    if (!data) {
        return;
    }


    try {

        localStorage.setItem(
            SENI_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "Seni: gagal menyimpan localStorage:",
            error
        );

    }


    try {

        sessionStorage.setItem(
            SENI_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "Seni: gagal menyimpan sessionStorage:",
            error
        );

    }

}


/* =========================================================
   HAPUS LOGIN
========================================================= */

function seniClearLoginData() {

    try {

        localStorage.removeItem(
            SENI_LOGIN_STORAGE_KEY
        );

    } catch (error) {}


    try {

        sessionStorage.removeItem(
            SENI_LOGIN_STORAGE_KEY
        );

    } catch (error) {}

}


/* =========================================================
   CEK LOGIN
========================================================= */

function seniLoginDataIsComplete(data) {

    return Boolean(

        data &&
        data.nama &&
        data.kelas &&
        data.sessionId

    );

}


/* =========================================================
   CEK SESI CLIENT
========================================================= */

function seniClientSessionExpired(data) {

    if (
        !data ||
        !data.loginAt
    ) {

        return true;

    }


    const loginTime =
        Number(
            data.loginAt
        );


    if (
        !Number.isFinite(
            loginTime
        )
    ) {

        return true;

    }


    return (
        Date.now() -
        loginTime
    ) >= SENI_SESSION_MAX_AGE;

}

/* =========================================================
   JSONP
========================================================= */

function seniRequestJSONP(
    params,
    timeout
) {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "seniOnlineCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            let selesai =
                false;


            const script =
                document.createElement(
                    "script"
                );


            const query =
                new URLSearchParams(
                    params || {}
                );


            query.set(
                "callback",
                callbackName
            );


            query.set(
                "t",
                Date.now()
            );


            let timer;


            function cleanup() {

                if (timer) {

                    clearTimeout(timer);

                }


                try {

                    delete window[
                        callbackName
                    ];

                } catch (error) {

                    window[
                        callbackName
                    ] =
                        undefined;

                }


                if (
                    script.parentNode
                ) {

                    script.parentNode.removeChild(
                        script
                    );

                }

            }


            timer =
                setTimeout(
                    function() {

                        if (selesai) {
                            return;
                        }


                        selesai =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "Request JSONP timeout"
                            )
                        );

                    },
                    timeout || 10000
                );


            window[
                callbackName
            ] =
                function(data) {

                    if (selesai) {
                        return;
                    }


                    selesai =
                        true;


                    cleanup();


                    resolve(data);

                };


            script.onerror =
                function() {

                    if (selesai) {
                        return;
                    }


                    selesai =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "JSONP gagal dimuat"
                        )
                    );

                };


            script.src =
                SENI_API_URL +
                "?" +
                query.toString();


            script.async =
                true;


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   REDIRECT IDENTITAS
========================================================= */

function seniRedirectKeIdentitas(alasan) {

    if (
        seniSedangRedirect
    ) {
        return;
    }


    seniSedangRedirect =
        true;


    clearInterval(
        seniHeartbeatTimer
    );


    seniHeartbeatTimer =
        null;


    seniClearLoginData();


    let url =
        "../../../identitas.html";


    if (alasan) {

        url +=
            "?alasan=" +
            encodeURIComponent(
                alasan
            );

    }


    window.location.replace(
        url
    );

}


/* =========================================================
   CEK SESSION KE SERVER
========================================================= */

async function seniCheckSession() {

    const loginData =
        seniGetLoginData();


    if (
        !seniLoginDataIsComplete(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "login"
        );

        return false;

    }


    if (
        seniClientSessionExpired(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "expired"
        );

        return false;

    }


    try {

        const result =
            await seniRequestJSONP(
                {
                    action:
                        "checksession",

                    sessionId:
                        loginData.sessionId
                },
                10000
            );


        console.log(
            "Seni - hasil checksession:",
            result
        );


        if (
            !result ||
            result.success !== true ||
            result.loggedIn !== true
        ) {

            seniRedirectKeIdentitas(
                "invalid"
            );

            return false;

        }


        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            seniSaveLoginData(
                updated
            );


            seniTampilkanDataSiswa(
                updated
            );

        }


        seniSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;


    } catch (error) {

        console.warn(
            "Seni: cek sesi sementara gagal:",
            error
        );


        seniSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;

    }

}


/* =========================================================
   HEARTBEAT
========================================================= */

async function seniSendHeartbeat() {

    if (
        seniSedangRedirect ||
        seniSedangLogout
    ) {
        return;
    }


    const loginData =
        seniGetLoginData();


    if (
        !seniLoginDataIsComplete(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "login"
        );

        return;

    }


    if (
        seniClientSessionExpired(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "expired"
        );

        return;

    }


    const now =
        Date.now();


    if (
        now -
        seniLastHeartbeat
        < 5000
    ) {

        return;

    }


    seniLastHeartbeat =
        now;


    seniSetStatusOnline(
        true,
        "🟢 Online"
    );


    try {

        const result =
            await seniRequestJSONP(
                {

                    action:
                        "heartbeat",

                    sessionId:
                        loginData.sessionId,

                    nama:
                        loginData.nama,

                    kelas:
                        loginData.kelas,

                    nomorAbsen:
                        loginData.nomorAbsen ||
                        loginData.absen ||
                        "",

                    halaman:
                        SENI_HALAMAN_UTAMA,

                    sumber:
                        "Petualangan Kelas 5"

                },
                10000
            );


        console.log(
            "📥 RESPONS SERVER SENI:",
            result
        );


        if (
            !result ||
            result.success !== true
        ) {

            const status =
                String(
                    (
                        result &&
                        result.status
                    ) ||
                    ""
                ).toLowerCase();


            if (

                status ===
                    "expired"

                ||

                status ===
                    "not_logged_in"

                ||

                status ===
                    "invalid_session"

            ) {

                seniRedirectKeIdentitas(
                    "expired"
                );


                return;

            }


            seniSetStatusOnline(
                true,
                "🟢 Online"
            );


            return;

        }


        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            seniSaveLoginData(
                updated
            );


            seniTampilkanDataSiswa(
                updated
            );

        }


        seniSetStatusOnline(
            true,
            "🟢 Online"
        );


    } catch (error) {

        console.warn(
            "Seni: heartbeat gagal sementara:",
            error
        );


        seniSetStatusOnline(
            true,
            "🟢 Online"
        );

    }

}

========================================================= */

async function seniInitializeOnline() {

    console.log(
        "🚀 Sistem online Seni dan Budaya dimulai."
    );


    const loginData =
        seniGetLoginData();


    if (
        !seniLoginDataIsComplete(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "login"
        );


        return;

    }


    seniTampilkanDataSiswa(
        loginData
    );


    if (
        seniClientSessionExpired(
            loginData
        )
    ) {

        seniRedirectKeIdentitas(
            "expired"
        );


        return;

    }


    const valid =
        await seniCheckSession();


    if (!valid) {
        return;
    }


    const sessionAktif =
        seniGetLoginData();


    if (
        !seniLoginDataIsComplete(
            sessionAktif
        )
    ) {

        seniRedirectKeIdentitas(
            "login"
        );

        return;

    }


    mulaiKuisDariSession(
        sessionAktif
    );


    seniStartHeartbeat();


    seniProtectNavigation();


    console.log(
        "🟢 Seni dan Budaya aktif dan sedang dibaca online oleh server."
    );


    console.log(
        "📄 Halaman:",
        SENI_HALAMAN_UTAMA
    );


    console.log(
        "⏱️ Heartbeat:",
        SENI_HEARTBEAT_INTERVAL / 1000,
        "detik"
    );


    console.log(
        "⏳ Maksimum sesi:",
        SENI_SESSION_MAX_AGE /
        (60 * 60 * 1000),
        "jam"
    );

}
