<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Guru</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef3f9;
display:flex;
}

/* Sidebar */

.sidebar{

width:260px;

background:#1565C0;

height:100vh;

position:fixed;

left:0;

top:0;

color:white;

overflow:auto;

}

.logo{

padding:25px;

font-size:22px;

font-weight:bold;

text-align:center;

border-bottom:1px solid rgba(255,255,255,.2);

}

.menu{

padding:15px;

}

.menu a{

display:block;

padding:14px;

margin-bottom:10px;

color:white;

text-decoration:none;

border-radius:10px;

transition:.3s;

}

.menu a:hover{

background:rgba(255,255,255,.15);

}

/* Content */

.main{

margin-left:260px;

width:100%;

}

/* Navbar */

.navbar{

background:white;

padding:18px 25px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.navbar h2{

color:#1565C0;

}

/* Card */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

padding:25px;

}

.card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.card h3{

font-size:15px;

color:#666;

}

.card h1{

margin-top:15px;

font-size:34px;

color:#1565C0;

}

/* Grafik */

.chart-box{
height:380px;
background:white;

margin:0 25px;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

}

/* Filter */

.filter{

display:flex;

gap:15px;

padding:25px;

flex-wrap:wrap;

}

.filter input,

.filter select{

padding:10px;

border:1px solid #ddd;

border-radius:8px;

}

/* Table */

.table-box{

background:white;

margin:0 25px 25px;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px rgba(0,0,0,.08);

overflow:auto;

}

table{

width:100%;

border-collapse:collapse;

}

th{

background:#1565C0;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #eee;

text-align:center;

}

tr:hover{

background:#f5f7fa;

}

@media(max-width:900px){

.sidebar{

width:70px;

}

.sidebar .logo{

display:none;

}

.menu a{

text-align:center;

font-size:20px;

}

.menu a span{

display:none;

}

.main{

margin-left:70px;

}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">

Dashboard Guru

</div>

<div class="menu">

<a href="#"><i class="fa fa-house"></i> <span>Dashboard</span></a>

<a href="#"><i class="fa fa-users"></i> <span>Data Siswa</span></a>

<a href="#"><i class="fa fa-book"></i> <span>Latihan</span></a>

<a href="#"><i class="fa fa-chart-column"></i> <span>Statistik</span></a>

<a href="#"><i class="fa fa-trophy"></i> <span>Leaderboard</span></a>

<a href="#"><i class="fa fa-file-pdf"></i> <span>Laporan</span></a>

<a href="#"><i class="fa fa-gear"></i> <span>Pengaturan</span></a>

</div>

</div>

<div class="main">

<div class="navbar">

<h2>Dashboard Guru</h2>

<div>

UPT SDN 160 GRESIK

</div>

</div>

<div class="cards">

<div class="card">

<h3>Total Siswa</h3>

<h1 id="totalSiswa">0</h1>

</div>

<div class="card">

<h3>Sudah Mengerjakan</h3>

<h1 id="sudah">0</h1>

</div>

<div class="card">

<h3>Belum Mengerjakan</h3>

<h1 id="belum">0</h1>

</div>

<div class="card">

<h3>Rata-rata Nilai</h3>

<h1 id="rata">0</h1>

</div>

</div>

<div class="chart-box">

<canvas id="grafikNilai"></canvas>

</div>

<div class="filter">

<input
type="text"
id="cariNama"
placeholder="Cari Nama">

<select id="filterKelas">
    <option value="">Semua Kelas</option>
    <option>I</option>
    <option>II</option>
    <option>III</option>
    <option>IV</option>
    <option>V</option>
    <option>VI</option>
</select>

<select id="filterMapel">
    <option value="">Semua Mapel</option>
    <option>Matematika</option>
    <option>IPAS</option>
    <option>Bahasa Indonesia</option>
    <option>Seni</option>
</select>

<select id="filterLatihan">
    <option value="">Semua Latihan</option>
</select>

</div>

<div class="table-box">

<table>

<thead>

<tr>

<th>No</th>

<th>Nama</th>

<th>Kelas</th>

<th>Absen</th>

<th>Mapel</th>

<th>Latihan</th>

<th>Nilai</th>

<th>Tanggal</th>

</tr>

</thead>

<tbody id="isiData">

</tbody>

</table>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL="https://hfjbwodvckqaxitgiidg.supabase.co";
const SUPABASE_KEY="sb_publishable_f_WtHcI-dpJefFg9RSsRvw_ELQsMgQK";
const supabaseClient=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let semuaData=[];
let grafik;

async function loadData(){

    const {data,error}=await supabaseClient
    .from("nilai_kuis")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        alert(error.message);

        return;

    }

    semuaData=data;

    isiFilterLatihan();

    refreshDashboard();

}

function isiFilterLatihan(){

    const daftar=[
        ...new Set(
            semuaData.map(x=>x.latihan)
        )
    ];

    const filter=
    document.getElementById("filterLatihan");

    filter.innerHTML=
    "<option value=''>Semua Latihan</option>";

    daftar.forEach(item=>{

        filter.innerHTML+=`
        <option value="${item}">
        ${item}
        </option>`;

    });

}

function dataFilter(){

    const nama=
    document.getElementById("cariNama")
    .value
    .toLowerCase();

    const kelas=
    document.getElementById("filterKelas").value;

    const mapel=
    document.getElementById("filterMapel").value;

    const latihan=
    document.getElementById("filterLatihan").value;

    return semuaData.filter(item=>{

        return(

            (nama==""||
            (item.nama || "")
             .toLowerCase()
             .includes(nama))

            &&

            (kelas==""||
            item.kelas==kelas)

            &&

            (mapel==""||
            item.mapel==mapel)

            &&

            (latihan==""||
            item.latihan==latihan)

        );

    });

}

function tampilkanData(){

    const data=dataFilter();

    const tbody=
    document.getElementById("isiData");

    tbody.innerHTML="";

    data.forEach((item,index)=>{

        tbody.innerHTML+=`

        <tr>

        <td>${index+1}</td>

        <td>${item.nama}</td>

        <td>${item.kelas}</td>

        <td>${item.absen}</td>

        <td>${item.mapel}</td>

        <td>${item.latihan}</td>

        <td>${item.nilai}</td>

        <td>

        ${
        item.created_at
        ?
        new Date(item.created_at)
        .toLocaleString("id-ID")
        :
        "-"
        }

        </td>

        </tr>

        `;

    });

}

function updateDashboard(){

    const data=dataFilter();

    const total=
    new Set(data.map(x=>x.nama)).size;

    document.getElementById("totalSiswa").innerHTML=
    total;

    document.getElementById("sudah").innerHTML=
    total;

    document.getElementById("belum").innerHTML=
    0;

    let rata=0;

    if(data.length){

        rata=Math.round(
            data.reduce(
                (a,b)=>a+Number(b.nilai),
                0
            )/data.length
        );

    }

    document.getElementById("rata").innerHTML=rata;

}

function buatGrafik(){

    const data=dataFilter();

    const nilai100=
    data.filter(x=>x.nilai==100).length;

    const nilai80=
    data.filter(x=>x.nilai>=80&&x.nilai<100).length;

    const nilai60=
    data.filter(x=>x.nilai>=60&&x.nilai<80).length;

    const nilai0=
    data.filter(x=>x.nilai<60).length;

    if(grafik){

        grafik.destroy();

    }

    grafik=new Chart(

        document.getElementById("grafikNilai"),

        {

            type:"bar",

            data:{

                labels:[
                    "100",
                    "80-99",
                    "60-79",
                    "<60"
                ],

                datasets:[{

                    data:[
                        nilai100,
                        nilai80,
                        nilai60,
                        nilai0
                    ],

                    backgroundColor:[
                        "#4CAF50",
                        "#2196F3",
                        "#FFC107",
                        "#F44336"
                    ]

                }]

            },

          options:{

    responsive:true,

    maintainAspectRatio:false,

    plugins:{
        legend:{
            display:false
        }
    },

    scales:{
        y:{
            beginAtZero:true,
            ticks:{
                stepSize:1
            }
        }
    }

}

        }

    );

}

function refreshDashboard(){

    tampilkanData();

    updateDashboard();

    buatGrafik();

}

document
.getElementById("cariNama")
.addEventListener(
"input",
refreshDashboard
);

document
.getElementById("filterKelas")
.addEventListener(
"change",
refreshDashboard
);

document
.getElementById("filterMapel")
.addEventListener(
"change",
refreshDashboard
);

document
.getElementById("filterLatihan")
.addEventListener(
"change",
refreshDashboard
);

loadData();

setInterval(loadData,30000);

</script>

</body>
</html>
