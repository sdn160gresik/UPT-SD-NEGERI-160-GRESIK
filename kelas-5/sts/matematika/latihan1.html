function mulaiKuis() {

        .getElementById("infoSiswa")

        `👤 Nama: <b>${dataNama}</b> |

         🔢 Absen: <b>${dataAbsen}</b>`;


    document
        .getElementById("formData")
        .classList
        .add("hidden");


    document
        .getElementById("areaKuis")
        .classList
        .remove("hidden");


    acakArray(soal);


    soal.forEach(
        s => {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    let gabung =

        s.a.map(
            (teks, i) => ({

                teks:
                    teks,

                benar:
                    i === s.k

            })
        );


    for (
        let i = gabung.length - 1;
        i > 0;
        i--
    ) {

        let j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            gabung[i],
            gabung[j]
        ] = [

            gabung[j],
            gabung[i]

        ];

    }


    s.a =

        gabung.map(
            o =>
                o.teks
        );


    s.k =

        gabung.findIndex(
            o =>
                o.benar
        );

}


/* =========================================================

function tampilkanSoal() {

    const quiz =

            .getElementById("quiz");

    if (
        indeks >=
        soal.length

                    soal.length) *

        kirimDataKeGoogleSheet(

            dataKelas,

            dataAbsen,

            nilai

        );


        let kelasWarna =

        if (

                <button

        return;

    const s =

    quiz.innerHTML = `

            📝 Soal

            ${soal.length}

            ${s.a.map(

                            onclick="mainkanSuaraKlik()"

                        <b>

}


/* =========================================================

========================================================= */

function periksaJawaban() {

    const jawaban =

        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    if (!jawaban) {

        mainkanSuaraPeringatan();


        tampilkanPeringatan(

            "⚡ Ups! Kamu belum memilih jawaban.<br><br>" +

            "Ayo pilih salah satu jawaban terlebih dahulu " +

            "sebelum lanjut ke soal berikutnya! 💡"

        );


        return;

    }


    if (

        parseInt(
            jawaban.value
        ) ===

        soal[indeks].k

    ) {

        benar++;

    }


    indeks++;


    mainkanSuaraNext();


    tampilkanSoal();

}

========================================================= */

function kirimDataKeGoogleSheet(

    kelas,
    absen,
    nilai

    const formURL =

        "https://docs.google.com/forms/u/0/d/e/1FAIpQLScrdR_ejx4jr5oHz-BQ9ZU-X6dfgnl7n3atNwxvJxeJluXKjQ/formResponse";


    const formData =
        new FormData();


    formData.append(

        "entry.1114641071",

        nama

    );


    formData.append(

        "entry.687539915",

        kelas

    );


    formData.append(

        "entry.1445858210",

        absen

    );


    formData.append(

        "entry.175130881",

        nilai

    );


    fetch(

        formURL,

        {

            method:
                "POST",

            body:
                formData,

            mode:
                "no-cors"

        }

    );

}
