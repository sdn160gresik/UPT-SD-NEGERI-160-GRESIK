<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monopoli Nusantara — Petualangan Budaya</title>

<style>
:root{
  --brown:#7C3F20;
  --brown-dark:#542713;
  --orange:#E67E22;
  --gold:#F4C542;
  --cream:#FFF4DF;
  --cream-light:#FFFDF8;
  --caramel:#B96F3D;
  --green:#4F8A45;
  --blue:#3B82C4;
  --line:#E5C6A3;
  --shadow:0 24px 70px rgba(91,52,27,.20);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--brown-dark);
  background:
    radial-gradient(circle at 8% 12%,rgba(244,197,66,.30),transparent 24%),
    radial-gradient(circle at 92% 15%,rgba(230,126,34,.20),transparent 27%),
    radial-gradient(circle at 10% 90%,rgba(79,138,69,.14),transparent 24%),
    linear-gradient(135deg,#FFF9EE,#FFF0D6 52%,#FFE7C0);
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.32;
  background-image:radial-gradient(rgba(124,63,32,.10) 1px,transparent 1px);
  background-size:22px 22px;
}

.decor{
  position:fixed;
  z-index:1;
  pointer-events:none;
  opacity:.16;
  font-size:42px;
  animation:float 6s ease-in-out infinite;
}

.d1{left:2%;top:8%}
.d2{right:3%;top:13%;animation-delay:1s}
.d3{left:4%;bottom:8%;animation-delay:2s}
.d4{right:4%;bottom:7%;animation-delay:.5s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-12px) rotate(5deg)}
}

.page{
  width:100%;
  height:100%;
  padding:14px;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:2;
}

.topbar{
  flex:0 0 auto;
  width:min(1400px,100%);
  margin:0 auto 12px;
  padding:11px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:2px solid rgba(124,63,32,.18);
  border-radius:20px;
  background:rgba(255,253,248,.92);
  box-shadow:0 10px 30px rgba(91,52,27,.10);
  backdrop-filter:blur(12px);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--orange),var(--gold));
  box-shadow:0 7px 16px rgba(230,126,34,.22);
  font-size:22px;
  flex-shrink:0;
}

.brand-text{
  min-width:0;
}

.brand-title{
  margin:0;
  color:var(--brown);
  font-size:17px;
  font-weight:900;
}

.brand-subtitle{
  margin:2px 0 0;
  color:#9A7258;
  font-size:11px;
  font-weight:700;
}

.actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.btn{
  border:0;
  border-radius:12px;
  padding:10px 15px;
  min-height:42px;
  font-size:13px;
  font-weight:850;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.03);
}

.btn:active{
  transform:translateY(0);
}

.btn-back{
  color:var(--brown);
  background:#FFF5E4;
  border:2px solid #DDBB91;
}

.btn-close{
  color:#fff;
  background:linear-gradient(135deg,var(--brown),#9A4F27);
  box-shadow:0 7px 16px rgba(124,63,32,.22);
}

.viewer{
  width:min(1400px,100%);
  flex:1 1 auto;
  min-height:0;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  border:2px solid rgba(124,63,32,.18);
  border-radius:24px;
  background:rgba(255,253,248,.95);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}

.viewer-head{
  flex:0 0 auto;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:linear-gradient(135deg,#FFF5E4,#FFE8BE);
  border-bottom:1px solid var(--line);
}

.viewer-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:900;
  color:var(--brown);
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--green);
  font-size:11px;
  font-weight:800;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px rgba(79,138,69,.13);
}

.frame-wrap{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  background:#F4E6D2;
}

iframe{
  width:100%;
  height:100%;
  min-height:0;
  display:block;
  border:0;
  background:white;
}

.loading{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#FFF8EB,#FFEAC5);
  transition:opacity .35s ease,visibility .35s ease;
}

.loading.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-card{
  width:min(360px,calc(100% - 30px));
  padding:25px;
  text-align:center;
  border-radius:22px;
  background:rgba(255,253,248,.96);
  border:2px solid #E4C49E;
  box-shadow:0 20px 50px rgba(91,52,27,.16);
}

.loader-icon{
  font-size:42px;
  margin-bottom:8px;
  animation:bounce 1.1s ease-in-out infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.loader-title{
  margin:0 0 5px;
  color:var(--brown);
  font-size:19px;
  font-weight:900;
}

.loader-text{
  margin:0;
  color:#96715B;
  font-size:12px;
}

.spinner{
  width:25px;
  height:25px;
  margin:14px auto 0;
  border:3px solid #F1D8B8;
  border-top-color:var(--orange);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  flex:0 0 auto;
  text-align:center;
  padding:7px 0 0;
  color:#9A7661;
  font-size:10px;
  font-weight:700;
}

@media(max-width:700px){
  .page{padding:8px}

  .topbar{
    margin-bottom:8px;
    border-radius:16px;
    padding:9px 10px;
  }

  .brand-title{font-size:14px}
  .brand-subtitle{display:none}

  .brand-icon{
    width:37px;
    height:37px;
    font-size:19px;
  }

  .btn{
    padding:8px 10px;
    min-height:38px;
    font-size:12px;
  }

  .btn span.label{
    display:none;
  }

  .viewer{
    border-radius:18px;
  }

  .viewer-head{
    padding:8px 11px;
  }

  .status{
    display:none;
  }

  .footer{
    display:none;
  }
}
</style>
</head>

<body>

<div class="decor d1">🎲</div>
<div class="decor d2">🍚</div>
<div class="decor d3">🌿</div>
<div class="decor d4">🏛️</div>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🎲</div>
      <div class="brand-text">
        <p class="brand-title">Monopoli Nusantara</p>
        <p class="brand-subtitle">Jelajahi Budaya, Bangun Negeri!</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-back" onclick="goBack()" title="Kembali ke petualangan">
        🏠 <span class="label">Kembali</span>
      </button>
      <button class="btn btn-close" onclick="closePage()" title="Tutup halaman">
        ✕ <span class="label">Tutup</span>
      </button>
    </div>
  </header>

  <main class="viewer">

    <div class="viewer-head">
      <div class="viewer-title">
        🇮🇩 <span>Petualangan Monopoli Budaya Indonesia</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Game siap dimainkan
      </div>
    </div>

    <div class="frame-wrap">

      <div class="loading" id="loading">
        <div class="loader-card">
          <div class="loader-icon">🎲</div>
          <h2 class="loader-title">Menyiapkan Petualangan...</h2>
          <p class="loader-text">Tunggu sebentar, papan Monopoli Nusantara sedang dimuat.</p>
          <div class="spinner"></div>
        </div>
      </div>

      <iframe
        id="gameFrame"
        src="https://monopoli-nusantara.netlify.app"
        title="Monopoli Nusantara — Game Edukasi Budaya Indonesia"
        allow="fullscreen"
        loading="eager">
      </iframe>

    </div>

  </main>

  <footer class="footer">
    UPT SDN 160 GRESIK • Belajar Matematika & Budaya Indonesia dengan menyenangkan 🌟
  </footer>

</div>

<script>
const gameFrame = document.getElementById('gameFrame');
const loading = document.getElementById('loading');

gameFrame.addEventListener('load', function(){
  setTimeout(()=>{
    loading.classList.add('hide');
  },350);
});

function goBack(){
  window.location.href = "petualangan.html";
}

function closePage(){
  // Jika halaman dibuka sebagai popup/tab yang mengizinkan script menutup,
  // browser akan menutupnya. Jika tidak, kembali ke halaman petualangan.
  try{
    window.close();
  }catch(e){}

  setTimeout(()=>{
    if(!document.hidden){
      window.location.href = "petualangan.html";
    }
  },150);
}

document.addEventListener('keydown', function(event){
  if(event.key === 'Escape'){
    goBack();
  }
});
</script>

</body>
</html>
