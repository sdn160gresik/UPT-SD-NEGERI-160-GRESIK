<header class="header">

</button>


<!-- ==================================================

================================================== -->

<main
    id="menu"
    class="menu">
</main>

================================================== -->

<footer class="footer">

    <strong>

</footer>

<script>

/* =====================================================
   DATA MATA PELAJARAN
===================================================== */

const MAPEL = {


    /* ================================================
       BAHASA INDONESIA
    ================================================ */

    indonesia: {

        nama: "Bahasa Indonesia",

        icon: "📖",

        className: "indonesia",

        folder: "bahasa_indonesia",

        pola: nomor =>
            `SOAL_LATIHAN_${nomor}_UTS_1_BAHASA_INDONESIA_KELAS_5.docx`
    },


    /* ================================================
       MATEMATIKA
    ================================================ */

    matematika: {

        nama: "Matematika",

        icon: "🔢",

        className: "matematika",

        folder: "matematika",

        pola: nomor =>
            `latihan${nomor}.docx`
    },


    /* ================================================
       PANCASILA
    ================================================ */

    pancasila: {

        nama: "Pancasila",

        icon: "🇮🇩",

        className: "pancasila",

        folder: "pancasila",

        pola: nomor =>
            `latihan${nomor}.docx`
    },


    /* ================================================
       IPAS
    ================================================ */

    ipas: {
    nama: "IPAS",
    icon: "🔬",
    className: "ipas",
    folder: "ipas",
    pola: nomor => {
        const fileIPAS = {
            1: "SOAL_LATIHAN_1_STS_1_IPAS_KELAS_5.docx",
            2: "SOAL_LATIHAN_2_STS_1_IPAS_KELAS_5.docx",
            3: "SOAL_LATIHAN_3_IPAS_STS_1_KELAS_5.docx",
            4: "SOAL_LATIHAN_4_IPAS_STS_1_KELAS_5.docx",
            5: "SOAL_LATIHAN_5_IPAS_STS_1_KELAS_5.docx",
            6: "SOAL_LATIHAN_6_IPAS_STS_1_KELAS_5.docx",
            7: "SOAL_LATIHAN_7_IPAS_STS_1_KELAS_5.docx",
            8: "SOAL_LATIHAN_8_IPAS_STS_1_KELAS_5.docx",
            9: "SOAL_LATIHAN_9_IPAS_STS_1_KELAS_5.docx",
            10: "SOAL_LATIHAN_10_IPAS_STS_1_KELAS_5.docx"
        };

        return fileIPAS[nomor];
    }
},


    /* ================================================
       SENI
    ================================================ */

    seni: {

        nama: "Seni",

        icon: "🎨",

        className: "seni",

        folder: "seni",

        pola: nomor =>
            `SOAL_LATIHAN_${nomor}_STS_1_SENI_DAN_BUDAYA_KELAS_5.docx`
    }

};


/* =====================================================
   RAW GITHUB
===================================================== */

/*
   PENTING:

   Bukan github.com/blob/main

   tetapi:

   raw.githubusercontent.com
*/

const RAW_GITHUB =
"https://raw.githubusercontent.com/sdn160gresik/UPT-SD-NEGERI-160-GRESIK/main/kelas-5/sts";


/* =====================================================
   ELEMENT
===================================================== */

const menu =
document.getElementById("menu");

const btnKembali =
document.getElementById("btnKembali");

const deskripsi =
document.getElementById("deskripsi");


/* =====================================================
   HALAMAN AKTIF
===================================================== */

let halamanAktif = "mapel";


/* =====================================================
   MEMBUAT LINK DOWNLOAD
===================================================== */

function buatLink(mapel, nomor) {

    const data =
        MAPEL[mapel];

    const namaFile =
        data.pola(nomor);

    return `${RAW_GITHUB}/${data.folder}/${encodeURIComponent(namaFile)}`;
}


/* =====================================================
   MENU MATA PELAJARAN
===================================================== */

function tampilkanMapel() {

    halamanAktif = "mapel";

    btnKembali.style.display =
        "none";

    deskripsi.textContent =
        "Pilih mata pelajaran untuk mengunduh soal latihan.";

    menu.innerHTML = "";


    Object.keys(MAPEL).forEach(key => {

        const data =
            MAPEL[key];


        const card =
            document.createElement("div");


        card.className =
            `card ${data.className}`;


        card.innerHTML = `

            <div class="icon">
                ${data.icon}
            </div>

            <div class="info">

                <h3>
                    Soal Latihan STS 1<br>
                    ${data.nama}
                </h3>

                <p>
                    Latihan 1 sampai 10
                </p>

            </div>

            <div class="action">
                📂 Buka
            </div>

        `;


        card.addEventListener(
            "click",
            () => tampilkanLatihan(key)
        );


        menu.appendChild(card);

    });

}


/* =====================================================
   MENU LATIHAN
===================================================== */

function tampilkanLatihan(mapel) {

    halamanAktif = mapel;


    const data =
        MAPEL[mapel];


    btnKembali.style.display =
        "inline-flex";


    deskripsi.textContent =
        `Pilih soal latihan ${data.nama} yang ingin diunduh.`;


    menu.innerHTML = "";


    for (
        let nomor = 1;
        nomor <= 10;
        nomor++
    ) {


        const link =
            buatLink(
                mapel,
                nomor
            );


        /*
           <a download> diarahkan
           langsung ke RAW GitHub.
        */

        const card =
            document.createElement("a");


        card.className =
            "card latihan";


        card.href =
            link;


        /*
           Nama file yang disarankan
           saat browser mengunduh.
        */

        card.setAttribute(
            "download",
            data.pola(nomor)
        );


        card.target =
            "_blank";


        card.rel =
            "noopener noreferrer";


        card.innerHTML = `

            <div class="icon">
                ${data.icon}
            </div>

            <div class="info">

                <h3>
                    Latihan ${nomor}
                    ${data.nama}
                </h3>

                <p>
                    ${data.pola(nomor)}
                </p>

            </div>

            <div class="action">
                ⬇️ Download
            </div>

        `;


        menu.appendChild(card);

    }

}


/* =====================================================
   KEMBALI
===================================================== */

function kembali() {

    if (
        halamanAktif !== "mapel"
    ) {

        tampilkanMapel();

    }

}


/* =====================================================
   MULAI
===================================================== */

tampilkanMapel();

</script>
