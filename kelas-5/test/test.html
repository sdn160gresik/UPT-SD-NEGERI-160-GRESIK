
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Identitas | UPT SDN 160 GRESIK</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(circle at top left, #fff3c4, transparent 35%),
        radial-gradient(circle at bottom right, #ffd6a5, transparent 35%),
        linear-gradient(135deg, #fff8e7, #ffe8c2);
}

/* =========================
   CARD
========================= */

.card {
    width: 100%;
    max-width: 430px;
    background: rgba(255,255,255,.96);
    border-radius: 28px;
    padding: 30px 25px;
    box-shadow:
        0 20px 50px rgba(120, 70, 20, .18),
        0 5px 15px rgba(120, 70, 20, .08);
    text-align: center;
    animation: muncul .5s ease;
}

@keyframes muncul {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb300, #ff8f00);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    box-shadow: 0 10px 25px rgba(255,143,0,.3);
}

h1 {
    margin: 0;
    color: #5d4037;
    font-size: 24px;
    font-weight: 800;
}

.subjudul {
    margin: 8px 0 25px;
    color: #795548;
    font-size: 14px;
    line-height: 1.6;
}

/* =========================
   PASSWORD
========================= */

.label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    color: #5d4037;
    font-size: 14px;
    font-weight: 700;
}

.input-wrapper {
    position: relative;
}

input {
    width: 100%;
    height: 52px;
    border: 2px solid #ead7bd;
    border-radius: 15px;
    padding: 0 50px 0 16px;
    font-family: inherit;
    font-size: 16px;
    outline: none;
    transition: .2s;
    background: #fffdf9;
}

input:focus {
    border-color: #ff9800;
    box-shadow: 0 0 0 4px rgba(255,152,0,.12);
}

.toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    cursor: pointer;
    font-size: 21px;
}

/* =========================
   BUTTON
========================= */

button.masuk {
    width: 100%;
    height: 52px;
    margin-top: 18px;
    border: 0;
    border-radius: 15px;
    background: linear-gradient(135deg, #ff9800, #f57c00);
    color: white;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(245,124,0,.25);
    transition: .2s;
}

button.masuk:hover {
    transform: translateY(-2px);
}

button.masuk:active {
    transform: scale(.98);
}

/* =========================
   ERROR
========================= */

.error {
    display: none;
    margin-top: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    background: #ffebee;
    color: #c62828;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
}

/* =========================
   INFO
========================= */

.info {
    margin-top: 22px;
    padding: 13px;
    border-radius: 14px;
    background: #fff8e1;
    color: #795548;
    font-size: 12px;
    line-height: 1.6;
}

.footer {
    margin-top: 20px;
    color: #9e9e9e;
    font-size: 11px;
}

/* =========================
   LOADING
========================= */

.loading {
    display: none;
    margin-top: 15px;
    color: #ef6c00;
    font-size: 13px;
    font-weight: 600;
}

.spinner {
    display: inline-block;
    width: 17px;
    height: 17px;
    border: 3px solid #ffe0b2;
    border-top-color: #f57c00;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 6px;
    animation: putar .7s linear infinite;
}

@keyframes putar {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {
    body {
        padding: 15px;
    }

    .card {
        padding: 27px 20px;
        border-radius: 24px;
    }

    .icon {
        width: 75px;
        height: 75px;
        font-size: 36px;
    }

    h1 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h1>Halaman Test Identitas</h1>

    <div class="subjudul">
        UPT SDN 160 GRESIK<br>
        Silakan masukkan password untuk melanjutkan.
    </div>

    <label class="label" for="password">
        Password Test
    </label>

    <div class="input-wrapper">
        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="off"
        >

        <button
            type="button"
            class="toggle"
            id="togglePassword"
            aria-label="Tampilkan password"
        >
            👁️
        </button>
    </div>

    <button
        type="button"
        class="masuk"
        id="btnMasuk"
    >
        🚀 Masuk ke Identitas
    </button>

    <div class="loading" id="loading">
        <span class="spinner"></span>
        Membuka halaman identitas...
    </div>

    <div class="error" id="error">
        ❌ Password salah. Silakan coba lagi.
    </div>

    <div class="info">
        💡 Halaman ini hanya digunakan untuk pengujian
        <strong>identitas.html</strong>.
    </div>

    <div class="footer">
        UPT SDN 160 GRESIK
    </div>

</div>

<script>

/* ==========================================
   PENGATURAN
========================================== */

const PASSWORD_TEST = "160Gresik";
const HALAMAN_IDENTITAS = "../identitas2.html";

/* ==========================================
   ELEMENT
========================================== */

const passwordInput = document.getElementById("password");
const btnMasuk = document.getElementById("btnMasuk");
const togglePassword = document.getElementById("togglePassword");
const errorBox = document.getElementById("error");
const loading = document.getElementById("loading");

/* ==========================================
   TAMPILKAN / SEMBUNYIKAN PASSWORD
========================================== */

togglePassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁️";

    }

});

/* ==========================================
   LOGIN
========================================== */

function masuk() {

    const password = passwordInput.value.trim();

    errorBox.style.display = "none";

    if (!password) {

        errorBox.textContent =
            "⚠️ Silakan masukkan password terlebih dahulu.";

        errorBox.style.display = "block";

        passwordInput.focus();

        return;
    }

    if (password !== PASSWORD_TEST) {

        errorBox.textContent =
            "❌ Password salah. Silakan coba lagi.";

        errorBox.style.display = "block";

        passwordInput.select();

        return;
    }

    /* Password benar */

    btnMasuk.disabled = true;
    btnMasuk.style.opacity = "0.6";

    loading.style.display = "block";

    setTimeout(function () {

        window.location.href = HALAMAN_IDENTITAS;

    }, 400);

}

/* ==========================================
   TOMBOL
========================================== */

btnMasuk.addEventListener("click", masuk);

/* ==========================================
   ENTER
========================================== */

passwordInput.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {
        masuk();
    }

});

</script>

</body>
</html>
