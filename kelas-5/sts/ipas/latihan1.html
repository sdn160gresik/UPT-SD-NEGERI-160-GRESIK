let dataKelas = "";

let dataAbsen = "";

/* =========================================================
   MULAI KUIS DARI SESSION ONLINE
========================================================= */

function mulaiKuisDariSession(data) {

    if (
        !data ||
        !data.nama ||
        !data.kelas ||
        !data.sessionId
    ) {

        return;

    }


    dataNama =
        data.nama || "";


    dataKelas =
        data.kelas || "";


    dataAbsen =
        data.nomorAbsen ||
        data.absen ||
        "";


    indeks = 0;

    benar = 0;

    ipasNilaiSudahDikirim =
        false;

    ipasPengirimanNilaiSedangBerjalan =
        false;


    const loading =
        document.getElementById(
            "onlineLoading"
        );


    if (loading) {

        loading.classList.add(
            "hidden"
        );

    }


    const areaKuis =
        document.getElementById(
            "areaKuis"
        );


    if (areaKuis) {

        areaKuis.classList.remove(
            "hidden"
        );

    }


    /*
       Acak urutan soal.
    */

    acakArray(soal);


    /*
       Acak pilihan jawaban setiap soal.
    */

    soal.forEach(
        function(s) {

            acakJawabanSoal(s);

        }
    );


    tampilkanSoal();

}


/* =========================================================
   ACAK SOAL
========================================================= */

function acakArray(arr) {

    if (
        !Array.isArray(arr) ||
        arr.length < 2
    ) {

        return;

    }


    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            arr[i],
            arr[j]
        ] = [

            arr[j],
            arr[i]

        ];

    }

}


/* =========================================================
   ACAK JAWABAN
========================================================= */

function acakJawabanSoal(s) {

    if (
        !s ||
        !Array.isArray(s.a) ||
        s.a.length === 0
    ) {

        return;

    }


    const gabung =

        s.a.map(
            function(teks, i) {

                return {

                    teks:
                        teks,

                    benar:
                        i === s.k

                };

            }
        );


    acakArray(gabung);


    s.a =

        gabung.map(
            function(o) {

                return o.teks;

            }
        );


    s.k =

        gabung.findIndex(
            function(o) {

                return o.benar;

            }
        );

}


/* =========================================================

========================================================= */

    const s =

                                onclick="mainkanSuaraKlik()"

        </button>

/* =========================================================
   ESCAPE HTML
   Mencegah nama siswa dimasukkan mentah ke innerHTML.
========================================================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            value == null
                ? ""
                : value
        );


    return div.innerHTML;

}

========================================================= */

        );

        mainkanSuaraPeringatan();

            "Ayo pilih salah satu jawaban terlebih dahulu " +

            "sebelum lanjut ke soal berikutnya! 💡"

        return;

    }

   Google Form DIHAPUS.

   Nilai dikirim ke endpoint API yang sama dengan
   sistem session/heartbeat siswa.

   Action:
   "submitScore"

   Database/Google Sheet tetap menggunakan
   sistem server yang sama.
========================================================= */

const IPAS_SCORE_ACTION =
    "submitScore";


let ipasNilaiSudahDikirim =
    false;


let ipasPengirimanNilaiSedangBerjalan =
    false;


/* =========================================================
   FUNGSI SIMPAN NILAI
========================================================= */

async function simpanNilaiKeServer(

    nama,
    kelas,
    absen,
    nilai,
    jumlahBenar,
    totalSoal

) {

    /* -----------------------------------------------------
       Jangan menyimpan dua kali pada satu pengerjaan.
    ----------------------------------------------------- */

    if (
        ipasNilaiSudahDikirim ||
        ipasPengirimanNilaiSedangBerjalan
    ) {

        return {

            success:
                true,

            duplicate:
                true

        };

    }


    ipasPengirimanNilaiSedangBerjalan =
        true;


    const loginData =
        ipasGetLoginData();


    const sessionId =
        loginData &&
        loginData.sessionId
            ? loginData.sessionId
            : "";


    const nilaiAman =
        Math.max(
            0,
            Math.min(
                100,
                Number(nilai) || 0
            )
        );


    const benarAman =
        Math.max(
            0,
            Number(jumlahBenar) || 0
        );


    const totalAman =
        Math.max(
            0,
            Number(totalSoal) || 0
        );


    const persentase =
        totalAman > 0
            ? Number(
                (
                    benarAman /
                    totalAman *
                    100
                ).toFixed(2)
            )
            : nilaiAman;


    const payload = {

        action:
            IPAS_SCORE_ACTION,

        sessionId:
            sessionId,

        nama:
            nama ||
            (
                loginData &&
                loginData.nama
            ) ||
            "",

        kelas:
            kelas ||
            (
                loginData &&
                loginData.kelas
            ) ||
            "",

        nomorAbsen:
            absen ||
            (
                loginData &&
                (
                    loginData.nomorAbsen ||
                    loginData.absen
                )
            ) ||
            "",

        absen:
            absen ||
            (
                loginData &&
                (
                    loginData.absen ||
                    loginData.nomorAbsen
                )
            ) ||
            "",

        namaKuis:
            "Soal Latihan 1 STS 1 IPAS Kelas 5",

        quizName:
            "Soal Latihan 1 STS 1 IPAS Kelas 5",

        nilai:
            nilaiAman,

        skor:
            nilaiAman,

        score:
            nilaiAman,

        benar:
            benarAman,

        jumlahBenar:
            benarAman,

        totalSoal:
            totalAman,

        jumlahSoal:
            totalAman,

        persentase:
            persentase,

        percentage:
            persentase,

        halaman:
            IPAS_HALAMAN_UTAMA,

        sumber:
            "Petualangan Kelas 5",

        waktu:
            new Date().toISOString(),

        timestamp:
            Date.now(),

        jenis:
            "hasil_kuis"

    };


    console.log(
        "========================================"
    );


    console.log(
        "📤 MENGIRIM NILAI IPAS KE SERVER"
    );


    console.log(
        "🆔 Session ID:",
        payload.sessionId
    );


    console.log(
        "👤 Nama:",
        payload.nama
    );


    console.log(
        "🏫 Kelas:",
        payload.kelas
    );


    console.log(
        "🔢 Absen:",
        payload.nomorAbsen
    );


    console.log(
        "📝 Kuis:",
        payload.namaKuis
    );


    console.log(
        "🎯 Nilai:",
        payload.nilai
    );


    console.log(
        "✅ Benar:",
        payload.benar,
        "/",
        payload.totalSoal
    );


    try {

        const result =
            await ipasRequestJSONP(
                payload,
                15000
            );


        console.log(
            "📥 RESPONS SERVER NILAI IPAS:",
            result
        );


        if (
            result &&
            result.success === true
        ) {

            ipasNilaiSudahDikirim =
                true;


            console.log(
                "✅ NILAI IPAS BERHASIL DISIMPAN DI SERVER / DATABASE"
            );


            ipasTampilkanStatusPenyimpananNilai(
                true,
                result.message ||
                "Nilai IPAS berhasil tersimpan di server."
            );


            return result;

        }


        const message =
            result &&
            result.message
                ? result.message
                : "Server belum mengonfirmasi penyimpanan nilai IPAS.";


        console.warn(
            "⚠️ NILAI IPAS BELUM DIKONFIRMASI SERVER:",
            result
        );


        ipasTampilkanStatusPenyimpananNilai(
            false,
            message
        );


        return result || {

            success:
                false,

            message:
                message

        };


    } catch (error) {

        console.error(
            "❌ GAGAL MENGIRIM NILAI IPAS KE SERVER:",
            error
        );


        ipasTampilkanStatusPenyimpananNilai(
            false,
            "Nilai belum tersimpan. Periksa koneksi lalu coba lagi."
        );


        return {

            success:
                false,

            error:
                String(error)

        };


    } finally {

        ipasPengirimanNilaiSedangBerjalan =
            false;

    }

}

/* =====================================================
   SISTEM ONLINE SISWA - IPAS

   Mengikuti sistem online pada halaman
   STS utama dan Petualangan Kelas 5.

   Fungsi:
   - Membaca identitas siswa
   - Memeriksa sessionId
   - Cek sesi server
   - Batas sesi client 24 jam
   - Heartbeat setiap 20 detik
   - Heartbeat saat aktivitas
   - Heartbeat saat tab aktif kembali
   - Status online
   - Proteksi navigasi
===================================================== */


/* =====================================================
   KONFIGURASI API
===================================================== */

const IPAS_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec";


/* =====================================================
   NAMA HALAMAN

   Siswa akan tercatat sedang berada
   pada halaman IPAS.
===================================================== */

const IPAS_HALAMAN_UTAMA =
    "Soal Latihan 1 STS 1 IPAS Kelas 5";


/* =====================================================
   INTERVAL HEARTBEAT

   Setiap 20 detik.
===================================================== */

const IPAS_HEARTBEAT_INTERVAL =
    20000;


/* =====================================================
   BATAS SESI CLIENT

   Maksimal 24 jam.
===================================================== */

const IPAS_SESSION_MAX_AGE =
    24 * 60 * 60 * 1000;


/* =====================================================
   KUNCI STORAGE

   Tetap sama dengan sistem identitas
   Petualangan Kelas 5 dan STS utama.

   JANGAN DIUBAH agar session tetap terbaca.
===================================================== */

const IPAS_LOGIN_STORAGE_KEY =
    "identitasPetualanganKelas5";


/* =====================================================
   VARIABEL HEARTBEAT
===================================================== */

let ipasHeartbeatTimer =
    null;


let ipasLastHeartbeat =
    0;


let ipasActivityTimer =
    null;


let ipasSedangLogout =
    false;


let ipasSedangRedirect =
    false;


/* =====================================================
   BACA DATA LOGIN
===================================================== */

function ipasGetLoginData() {

    const storages = [

        window.localStorage,

        window.sessionStorage

    ];


    for (
        const storage
        of storages
    ) {

        try {

            const raw =
                storage.getItem(
                    IPAS_LOGIN_STORAGE_KEY
                );


            if (!raw) {

                continue;

            }


            const data =
                JSON.parse(
                    raw
                );


            if (
                data &&
                typeof data === "object"
            ) {

                return data;

            }


        } catch (error) {

            console.log(
                "IPAS: gagal membaca data login:",
                error
            );

        }

    }


    return null;

}


/* =====================================================
   SIMPAN DATA LOGIN
===================================================== */

function ipasSaveLoginData(
    data
) {

    if (!data) {

        return;

    }


    try {

        localStorage.setItem(
            IPAS_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "IPAS: gagal menyimpan localStorage:",
            error
        );

    }


    try {

        sessionStorage.setItem(
            IPAS_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    } catch (error) {

        console.log(
            "IPAS: gagal menyimpan sessionStorage:",
            error
        );

    }

}


/* =====================================================
   HAPUS DATA LOGIN
===================================================== */

function ipasClearLoginData() {

    try {

        localStorage.removeItem(
            IPAS_LOGIN_STORAGE_KEY
        );

    } catch (error) {}


    try {

        sessionStorage.removeItem(
            IPAS_LOGIN_STORAGE_KEY
        );

    } catch (error) {}

}


/* =====================================================
   CEK DATA LOGIN LENGKAP
===================================================== */

function ipasLoginDataIsComplete(
    data
) {

    return Boolean(

        data &&

        data.nama &&

        data.kelas &&

        data.sessionId

    );

}


/* =====================================================
   CEK SESI CLIENT 24 JAM
===================================================== */

function ipasClientSessionExpired(
    data
) {

    if (
        !data ||
        !data.loginAt
    ) {

        return true;

    }


    const loginTime =
        Number(
            data.loginAt
        );


    if (
        !Number.isFinite(
            loginTime
        )
    ) {

        return true;

    }


    return (

        Date.now() -
        loginTime

    ) >=
        IPAS_SESSION_MAX_AGE;

}


/* =====================================================
   TAMPILKAN DATA SISWA
===================================================== */

function ipasTampilkanDataSiswa(
    data
) {

    if (!data) {

        return;

    }


    const namaElement =
        document.getElementById(
            "namaSiswaLogin"
        );


    const kelasElement =
        document.getElementById(
            "kelasSiswaLogin"
        );


    const absenElement =
        document.getElementById(
            "absenSiswaLogin"
        );


    if (namaElement) {

        namaElement.textContent =
            data.nama ||

    }


    if (kelasElement) {

        kelasElement.textContent =
            data.kelas ||
            "-";

    }


    if (absenElement) {

        absenElement.textContent =
            data.nomorAbsen ||
            data.absen ||
            "-";

    }

}


/* =====================================================
   STATUS ONLINE
===================================================== */

function ipasSetStatusOnline(
    online,
    text
) {

    const statusElement =
        document.getElementById(
            "statusOnline"
        );


    if (!statusElement) {

        return;

    }


    if (online) {

        statusElement.textContent =
            text ||
            "🟢 Online";


        statusElement.classList.remove(
            "offline"
        );


    } else {

        statusElement.textContent =
            text ||
            "🔴 Offline";


        statusElement.classList.add(
            "offline"
        );

    }

}


/* =====================================================
   JSONP REQUEST
===================================================== */

function ipasRequestJSONP(
    params,
    timeout
) {

    return new Promise(
        function(resolve, reject) {

            const callbackName =
                "ipasOnlineCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            let selesai =
                false;


            const script =
                document.createElement(
                    "script"
                );


            const query =
                new URLSearchParams(
                    params || {}
                );


            query.set(
                "callback",
                callbackName
            );


            query.set(
                "t",
                Date.now()
            );


            let timer;


            function cleanup() {

                if (timer) {

                    clearTimeout(
                        timer
                    );

                }


                try {

                    delete window[
                        callbackName
                    ];

                } catch (error) {

                    window[
                        callbackName
                    ] =
                        undefined;

                }


                if (
                    script.parentNode
                ) {

                    script.parentNode.removeChild(
                        script
                    );

                }

            }


            timer =
                setTimeout(
                    function() {

                        if (selesai) {

                            return;

                        }


                        selesai =
                            true;


                        cleanup();


                        reject(
                            new Error(
                                "Request JSONP timeout"
                            )
                        );

                    },
                    timeout || 10000
                );


            window[
                callbackName
            ] =
                function(data) {

                    if (selesai) {

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    resolve(
                        data
                    );

                };


            script.onerror =
                function() {

                    if (selesai) {

                        return;

                    }


                    selesai =
                        true;


                    cleanup();


                    reject(
                        new Error(
                            "JSONP gagal dimuat"
                        )
                    );

                };


            script.src =
                IPAS_API_URL +
                "?" +
                query.toString();


            script.async =
                true;


            document
                .head
                .appendChild(
                    script
                );

        }
    );

}


/* =====================================================
   REDIRECT KE HALAMAN IDENTITAS

   Karena halaman ini berada di:

   /kelas-5/sts/

   maka identitas berada di:

   /kelas-5/identitas.html
===================================================== */

function ipasRedirectKeIdentitas(
    alasan
) {

    if (
        ipasSedangRedirect
    ) {

        return;

    }


    ipasSedangRedirect =
        true;


    clearInterval(
        ipasHeartbeatTimer
    );


    ipasHeartbeatTimer =
        null;


    ipasClearLoginData();


    let url =
        "../../identitas.html";


    if (alasan) {

        url +=
            "?alasan=" +
            encodeURIComponent(
                alasan
            );

    }


    window.location.replace(
        url
    );

}


/* =====================================================
   CEK SESI KE SERVER
===================================================== */

async function ipasCheckSession() {

    const loginData =
        ipasGetLoginData();


    /* -------------------------------------------------
       Tidak ada data login
    ------------------------------------------------- */

    if (
        !ipasLoginDataIsComplete(
            loginData
        )
    ) {

        ipasRedirectKeIdentitas(
            "login"
        );

        return false;

    }


    /* -------------------------------------------------
       Cek masa sesi 24 jam
    ------------------------------------------------- */

    if (
        ipasClientSessionExpired(
            loginData
        )
    ) {

        ipasRedirectKeIdentitas(
            "expired"
        );

        return false;

    }


    try {

        const result =
            await ipasRequestJSONP(
                {

                    action:
                        "checksession",

                    sessionId:
                        loginData.sessionId

                },
                10000
            );


        console.log(
            "IPAS - hasil checksession:",
            result
        );


        /* -------------------------------------------------
           Session tidak valid
        ------------------------------------------------- */

        if (
            !result ||
            result.success !== true ||
            result.loggedIn !== true
        ) {

            ipasRedirectKeIdentitas(
                "invalid"
            );

            return false;

        }


        /* -------------------------------------------------
           Jika server memberikan session terbaru
        ------------------------------------------------- */

        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            ipasSaveLoginData(
                updated
            );


            ipasTampilkanDataSiswa(
                updated
            );

        }


        ipasSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;


    } catch (error) {

        /*
           Error jaringan sementara tidak
           langsung mengeluarkan siswa.
        */

        console.warn(
            "IPAS: cek sesi sementara gagal:",
            error
        );


        ipasSetStatusOnline(
            true,
            "🟢 Online"
        );


        return true;

    }

}


/* =====================================================
   KIRIM HEARTBEAT
===================================================== */

async function ipasSendHeartbeat() {

    /* -------------------------------------------------
       Jangan kirim ketika redirect
       atau proses logout.
    ------------------------------------------------- */

    if (
        ipasSedangRedirect ||
        ipasSedangLogout
    ) {

        return;

    }


    /* -------------------------------------------------
       Ambil data login
    ------------------------------------------------- */

    const loginData =
        ipasGetLoginData();


    /* -------------------------------------------------
       Pastikan login lengkap
    ------------------------------------------------- */

    if (
        !ipasLoginDataIsComplete(
            loginData
        )
    ) {

        console.warn(
            "IPAS: heartbeat dihentikan karena data login tidak lengkap."
        );


        ipasRedirectKeIdentitas(
            "login"
        );


        return;

    }


    /* -------------------------------------------------
       Cek sesi 24 jam
    ------------------------------------------------- */

    if (
        ipasClientSessionExpired(
            loginData
        )
    ) {

        console.warn(
            "IPAS: sesi lokal sudah expired."
        );


        ipasRedirectKeIdentitas(
            "expired"
        );


        return;

    }


    /* -------------------------------------------------
       Hindari heartbeat terlalu rapat

       Minimal 5 detik antar request.
    ------------------------------------------------- */

    const now =
        Date.now();


    if (
        now -
        ipasLastHeartbeat
        < 5000
    ) {

        return;

    }


    ipasLastHeartbeat =
        now;

       Tampilkan status online
    ------------------------------------------------- */

    ipasSetStatusOnline(

        "🟢 Online"
    );


    /* =================================================
       DEBUG
    ================================================= */

    console.log(

    );


    console.log(
        "📡 IPAS MENGIRIM HEARTBEAT"
    );


    console.log(
        "🕐 Waktu:",
        new Date()
            .toLocaleTimeString()
    );


    console.log(
        "🆔 Session ID:",
        loginData.sessionId
    );


    console.log(
        "👤 Nama:",
        loginData.nama
    );


    console.log(
        "🏫 Kelas:",
        loginData.kelas
    );


    console.log(
        "🔢 Absen:",
        loginData.nomorAbsen ||
        loginData.absen ||
        "-"
    );


    console.log(
        "📄 Halaman:",
        IPAS_HALAMAN_UTAMA
    );


    /* =================================================
       REQUEST HEARTBEAT
    ================================================= */

    try {

        const result =
            await ipasRequestJSONP(
                {

                    action:
                        "heartbeat",

                    sessionId:
                        loginData.sessionId,

                    nama:
                        loginData.nama,

                    kelas:
                        loginData.kelas,

                    nomorAbsen:
                        loginData.nomorAbsen ||
                        loginData.absen ||
                        "",

                    halaman:
                        IPAS_HALAMAN_UTAMA,

                    sumber:
                        "Petualangan Kelas 5"

                },
                10000
            );


        /* =================================================
           DEBUG RESPONS
        ================================================= */

        console.log(
            "📥 RESPONS SERVER IPAS:",
            result
        );


        console.log(
            "✅ Success:",
            result &&
            result.success
        );


        console.log(
            "📊 Status:",
            result &&
            result.status
        );


        console.log(
            "📝 Message:",
            result &&
            result.message
        );


        /* =================================================
           CEK SESSION DARI SERVER
        ================================================= */

        if (
            result &&
            result.session
        ) {

            console.log(
                "----------------------------------------"
            );


            console.log(
                "🆔 Session ID SERVER:",
                result.session.sessionId
            );


            console.log(
                "👤 Nama SERVER:",
                result.session.nama
            );


            console.log(
                "🏫 Kelas SERVER:",
                result.session.kelas
            );


            console.log(
                "🔢 Absen SERVER:",
                result.session.nomorAbsen
            );


            console.log(
                "📄 Halaman SERVER:",
                result.session.halaman
            );


            console.log(
                "🕐 Login At SERVER:",
                result.session.loginAt
            );


            console.log(
                "🕐 Last Seen SERVER:",
                result.session.lastSeen
            );


            console.log(
                "🟢 Status SERVER:",
                result.session.status
            );


            console.log(
                "----------------------------------------"
            );

        }


        /* =================================================
           CEK HASIL HEARTBEAT
        ================================================= */

        if (
            !result ||
            result.success !== true
        ) {

            const status =
                String(
                    (
                        result &&
                        result.status
                    ) ||
                    ""
                ).toLowerCase();


            console.warn(
                "IPAS: heartbeat tidak berhasil.",
                result
            );


            /* ---------------------------------------------
               Session benar-benar invalid
            --------------------------------------------- */

            if (

                status ===
                    "expired"

                ||

                status ===
                    "not_logged_in"

                ||

                status ===
                    "invalid_session"

            ) {

                console.error(
                    "🚨 IPAS: SESSION TIDAK VALID / EXPIRED"
                );


                ipasRedirectKeIdentitas(
                    "expired"
                );


                return;

            }


            /*
               Error lain tidak langsung
               menghapus sesi.
            */

            ipasSetStatusOnline(
                true,
                "🟢 Online"
            );


            return;

        }


        /* =================================================
           SIMPAN DATA SESSION TERBARU
        ================================================= */

        if (
            result.session
        ) {

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );


            console.log(
                "🔍 SESSION ID SEBELUM:",
                loginData.sessionId
            );


            console.log(
                "🔍 SESSION ID SESUDAH:",
                updated.sessionId
            );


            if (
                loginData.sessionId !==
                updated.sessionId
            ) {

                console.warn(
                    "⚠️ PERINGATAN: SESSION ID BERUBAH!"
                );

            } else {

                console.log(
                    "✅ Session ID tetap sama."
                );

            }


            ipasSaveLoginData(
                updated
            );


            ipasTampilkanDataSiswa(
                updated
            );

        }


        /* =================================================
           STATUS ONLINE
        ================================================= */

        ipasSetStatusOnline(
            true,
            "🟢 Online"
        );


        /* =================================================
           LOG BERHASIL
        ================================================= */

        console.log(
            "🟢 IPAS ONLINE:",
            new Date()
                .toLocaleTimeString()
        );


        console.log(
            "========================================"
        );


    } catch (error) {

        /*
           Internet/API sementara gagal.
           Jangan logout.
        */

        console.warn(
            "IPAS: heartbeat gagal sementara:",
            error
        );


        ipasSetStatusOnline(
            true,
            "🟢 Online"
        );


        console.log(
            "Heartbeat berikutnya akan mencoba kembali."
        );


        console.log(
            "========================================"
        );

    }

}


/* =====================================================
   HEARTBEAT BERKALA
===================================================== */

function ipasStartHeartbeat() {

    if (
        ipasHeartbeatTimer
    ) {

        clearInterval(
            ipasHeartbeatTimer
        );

    }


    /*
       Reset penanda heartbeat
       agar heartbeat pertama langsung dikirim.
    */

    ipasLastHeartbeat =
        0;


    /*
       Kirim heartbeat langsung.
    */

    ipasSendHeartbeat();


    /*
       Selanjutnya setiap 20 detik.
    */

    ipasHeartbeatTimer =
        setInterval(
            function() {

                ipasSendHeartbeat();

            },
            IPAS_HEARTBEAT_INTERVAL
        );

}


/* =====================================================
   AKTIVITAS SISWA
===================================================== */

function ipasRegisterActivity() {

    clearTimeout(
        ipasActivityTimer
    );


    ipasActivityTimer =
        setTimeout(
            function() {

                ipasSendHeartbeat();

            },
            300
        );

}


/* =====================================================
   EVENT AKTIVITAS SISWA
===================================================== */

const ipasActivityEvents = [

    "click",

    "keydown",

    "scroll",

    "touchstart",

    "pointerdown"

];


ipasActivityEvents.forEach(
    function(eventName) {

        document.addEventListener(
            eventName,
            ipasRegisterActivity,
            {
                passive:
                    true
            }
        );

    }
);


/* =====================================================
   TAB KEMBALI AKTIF
===================================================== */

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            ipasSendHeartbeat();

        }

    }
);


/* =====================================================
   WINDOW KEMBALI AKTIF
===================================================== */

window.addEventListener(
    "focus",
    function() {

        ipasSendHeartbeat();

    }
);


/* =====================================================
   SAAT HALAMAN DITINGGALKAN

   Tidak mengirim logout.

   Tujuannya agar perpindahan:

   STS utama
       ↓
   IPAS
       ↓
   Mata pelajaran

   tetap menggunakan session yang sama.
===================================================== */

window.addEventListener(
    "pagehide",
    function() {

        clearInterval(
            ipasHeartbeatTimer
        );


        ipasHeartbeatTimer =
            null;


        clearTimeout(
            ipasActivityTimer
        );


        ipasActivityTimer =
            null;

    }
);


/* =====================================================
   PROTEKSI NAVIGASI

   Menu tetap hanya dapat dibuka
   jika siswa mempunyai session valid.
===================================================== */

function ipasProtectNavigation() {

    /* =================================================
       TOMBOL MATA PELAJARAN
    ================================================= */

    document
        .querySelectorAll(
            ".menu-button"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        const loginData =
                            ipasGetLoginData();


                        /* ---------------------------------
                           Belum login
                        --------------------------------- */

                        if (
                            !ipasLoginDataIsComplete(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            ipasRedirectKeIdentitas(
                                "login"
                            );


                            return;

                        }


                        /* ---------------------------------
                           Session lokal expired
                        --------------------------------- */

                        if (
                            ipasClientSessionExpired(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            ipasRedirectKeIdentitas(
                                "expired"
                            );


                            return;

                        }


                        /*
                           Kirim heartbeat sebelum
                           siswa berpindah halaman.
                        */

                        ipasSendHeartbeat();

                    }
                );

            }
        );


    /* =================================================
       NAVBAR
    ================================================= */

    document
        .querySelectorAll(
            ".nav a, nav a"
        )
        .forEach(
            function(link) {

                link.addEventListener(
                    "click",
                    function(event) {

                        const loginData =
                            ipasGetLoginData();


                        if (
                            !ipasLoginDataIsComplete(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            ipasRedirectKeIdentitas(
                                "login"
                            );


                            return;

                        }


                        if (
                            ipasClientSessionExpired(
                                loginData
                            )
                        ) {

                            event.preventDefault();


                            ipasRedirectKeIdentitas(
                                "expired"
                            );


                            return;

                        }


                        ipasSendHeartbeat();

                    }
                );

            }
        );


    /* =================================================
       TOMBOL KEMBALI
    ================================================= */

    const backButton =
        document.querySelector(
            ".back-button"
        );


    if (backButton) {

        backButton.addEventListener(
            "click",
            function(event) {

                const loginData =
                    ipasGetLoginData();


                if (
                    !ipasLoginDataIsComplete(
                        loginData
                    )
                ) {

                    event.preventDefault();


                    ipasRedirectKeIdentitas(
                        "login"
                    );


                    return;

                }


                if (
                    ipasClientSessionExpired(
                        loginData
                    )
                ) {

                    event.preventDefault();


                    ipasRedirectKeIdentitas(
                        "expired"
                    );


                    return;

                }


                ipasSendHeartbeat();

            }
        );

    }

}


/* =====================================================
   INISIALISASI SISTEM ONLINE IPAS
===================================================== */

async function ipasInitializeOnline() {

    console.log(
        "🚀 Sistem online IPAS dimulai."
    );


    /* -------------------------------------------------
       Ambil data login
    ------------------------------------------------- */

    const loginData =
        ipasGetLoginData();


    /* -------------------------------------------------
       Pastikan siswa sudah login
    ------------------------------------------------- */

    if (
        !ipasLoginDataIsComplete(
            loginData
        )
    ) {

        ipasRedirectKeIdentitas(
            "login"
        );


        return;

    }


    /* -------------------------------------------------
       Tampilkan data siswa
       sebelum server selesai diperiksa.
    ------------------------------------------------- */

    ipasTampilkanDataSiswa(
        loginData
    );


    /* -------------------------------------------------
       Cek masa sesi lokal
    ------------------------------------------------- */

    if (
        ipasClientSessionExpired(
            loginData
        )
    ) {

        ipasRedirectKeIdentitas(
            "expired"
        );


        return;

    }


    /* -------------------------------------------------
       Periksa session ke server
    ------------------------------------------------- */

    const valid =
        await ipasCheckSession();


    if (!valid) {

        return;

    }


    const sessionAktif =
        ipasGetLoginData();


    if (
        !ipasLoginDataIsComplete(
            sessionAktif
        )
    ) {

        ipasRedirectKeIdentitas(
            "login"
        );

        return;

    }


    /* -------------------------------------------------
       Mulai kuis
    ------------------------------------------------- */

    mulaiKuisDariSession(
        sessionAktif
    );


    /* -------------------------------------------------
       Mulai heartbeat
    ------------------------------------------------- */

    ipasStartHeartbeat();


    /* -------------------------------------------------
       Proteksi navigasi
    ------------------------------------------------- */

    ipasProtectNavigation();


    /* -------------------------------------------------
       Console
    ------------------------------------------------- */

    console.log(
        "🟢 IPAS aktif dan sedang dibaca online oleh server."
    );


    console.log(
        "📄 Halaman online:",
        IPAS_HALAMAN_UTAMA
    );


    console.log(
        "⏱️ Heartbeat:",
        IPAS_HEARTBEAT_INTERVAL /
        1000,
        "detik"
    );


    console.log(
        "⏳ Maksimum sesi:",
        IPAS_SESSION_MAX_AGE /
        (60 * 60 * 1000),
        "jam"
    );

}
