<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#9b4d20"
>

<title>Identitas Siswa | Petualangan Kelas 5</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{

    --primary:#9b4d20;
    --primary-dark:#713517;
    --secondary:#e67e22;
    --accent:#f4b942;

    --green:#2e8b57;
    --red:#c0392b;

    --ink:#4a2c20;
    --muted:#806b61;

    --card:#fffdf8;
    --cream:#fff8e8;

    --border:#ead7bc;

    --shadow:rgba(92,48,24,.16);

}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    min-height:100%;

}


/* =========================================================
   BODY
========================================================= */

body{

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color:var(--ink);

    background:

        radial-gradient(
            circle at 10% 15%,
            rgba(255,255,255,.65) 0 3px,
            transparent 4px
        ),

        radial-gradient(
            circle at 90% 25%,
            rgba(255,255,255,.5) 0 3px,
            transparent 4px
        ),

        linear-gradient(
            135deg,
            #f7dfb5 0%,
            #fff4d8 45%,
            #f3d7ad 100%
        );

    background-size:
        auto,
        auto,
        cover;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


/* =========================================================
   POLA BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:.18;

    background-image:

        radial-gradient(
            #fff 1px,
            transparent 1px
        );

    background-size:22px 22px;

}


/* =========================================================
   APP
========================================================= */

.app{

    width:100%;

    max-width:540px;

    margin:auto;

    position:relative;

    z-index:1;

}


/* =========================================================
   KARTU IDENTITAS
========================================================= */

.identity-card{

    position:relative;

    overflow:hidden;

    background:
        rgba(255,253,248,.98);

    border:
        1px solid var(--border);

    border-radius:30px;

    box-shadow:

        0 25px 65px
        rgba(86,45,20,.22),

        0 8px 20px
        rgba(86,45,20,.10);

}


/* =========================================================
   GARIS WARNA ATAS
========================================================= */

.identity-card::before{

    content:"";

    display:block;

    height:9px;

    background:

        linear-gradient(
            90deg,
            #9b4d20 0%,
            #d96c27 35%,
            #f4b942 70%,
            #2e8b57 100%
        );

}


/* =========================================================
   HIASAN MAKANAN
========================================================= */

.identity-card::after{

    content:
        "🍜   🍢   🥟   🍚   🍡";

    display:block;

    text-align:center;

    font-size:23px;

    letter-spacing:4px;

    padding-top:17px;

}


/* =========================================================
   ISI KARTU
========================================================= */

.identity-content{

    padding:
        4px
        34px
        30px;

}


/* =========================================================
   BADGE SEKOLAH
========================================================= */

.school-badge{

    display:table;

    margin:
        2px auto 13px;

    padding:
        7px 14px;

    border-radius:99px;

    background:#f9e6c5;

    color:var(--primary-dark);

    font-size:12px;

    font-weight:900;

    border:
        1px solid #eed2a5;

}


/* =========================================================
   ICON
========================================================= */

.identity-icon{

    width:76px;

    height:76px;

    margin:
        0 auto 11px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:

        linear-gradient(
            145deg,
            #fff0c8,
            #f7d994
        );

    border:
        4px solid #fff;

    box-shadow:

        0 8px 20px
        rgba(140,78,27,.15),

        inset 0 2px 4px
        rgba(255,255,255,.8);

    font-size:39px;

}


/* =========================================================
   JUDUL
========================================================= */

h1{

    margin:
        5px 0 7px;

    text-align:center;

    color:var(--primary-dark);

    font-size:27px;

    line-height:1.25;

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle{

    margin:
        0 auto 25px;

    max-width:410px;

    text-align:center;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;

}


/* =========================================================
   FORM
========================================================= */

.form-grid{

    display:grid;

    grid-template-columns:1fr;

    gap:16px;

}


.field{

    position:relative;

}


.field label{

    display:block;

    margin-bottom:7px;

    color:#5c3929;

    font-size:14px;

    font-weight:800;

}


/* =========================================================
   INPUT WRAP
========================================================= */

.input-wrap{

    position:relative;

}


.input-icon{

    position:absolute;

    left:14px;

    top:50%;

    transform:
        translateY(-50%);

    font-size:19px;

    pointer-events:none;

    z-index:2;

}


/* =========================================================
   INPUT
========================================================= */

input{

    width:100%;

    padding:
        14px
        15px
        14px
        46px;

    border:
        2px solid #e7d5bb;

    border-radius:15px;

    font-size:16px;

    outline:none;

    background:#fffdfa;

    color:var(--ink);

    transition:.2s;

    font-family:inherit;

}


input::placeholder{

    color:#b29e90;

}


input:focus{

    border-color:#d77b35;

    background:#fff;

    box-shadow:

        0 0 0 4px
        rgba(230,126,34,.13),

        0 5px 15px
        rgba(120,65,28,.08);

}


input:hover{

    border-color:#d7ad7d;

}


/* =========================================================
   TOMBOL
========================================================= */

.action-area{

    margin-top:22px;

}


.btn{

    border:0;

    border-radius:16px;

    padding:
        15px 20px;

    font-weight:900;

    font-size:16px;

    cursor:pointer;

    transition:

        transform .2s,

        box-shadow .2s,

        opacity .2s;

    font-family:inherit;

}


.btn-primary{

    width:100%;

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #a95020,
            #d96b26 55%,
            #e58a35
        );

    box-shadow:

        0 8px 18px
        rgba(155,77,32,.25);

}


.btn-primary:hover{

    transform:
        translateY(-2px);

    box-shadow:

        0 11px 23px
        rgba(155,77,32,.32);

}


.btn-primary:active{

    transform:
        translateY(0);

}


.btn-primary:disabled{

    opacity:.55;

    cursor:not-allowed;

    transform:none;

}


/* =========================================================
   INFORMASI
========================================================= */

.identity-note{

    margin:
        19px auto 0;

    padding:
        11px 14px;

    border-radius:13px;

    background:#fff5df;

    border:
        1px dashed #e3c18f;

    color:#80634f;

    font-size:12px;

    line-height:1.55;

    text-align:center;

}


.food-decoration{

    text-align:center;

    margin-top:17px;

    color:#967463;

    font-size:12px;

    letter-spacing:.3px;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    display:none;

    margin-top:14px;

    text-align:center;

    color:var(--primary-dark);

    font-size:13px;

    font-weight:800;

}


.loading.show{

    display:block;

}


.spinner{

    display:inline-block;

    width:15px;

    height:15px;

    margin-right:6px;

    vertical-align:-3px;

    border:
        2px solid #e7c8a0;

    border-top-color:
        var(--primary);

    border-radius:50%;

    animation:
        spin .7s linear infinite;

}


@keyframes spin{

    to{

        transform:
            rotate(360deg);

    }

}


/* =========================================================
   TOAST
========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:25px;

    transform:

        translateX(-50%)
        translateY(15px);

    width:
        min(92%,430px);

    padding:
        13px 18px;

    border-radius:14px;

    background:#4a2c20;

    color:#fff;

    text-align:center;

    font-size:13px;

    font-weight:700;

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.20);

    z-index:50;

    opacity:0;

    visibility:hidden;

    transition:.25s;

}


.toast.show{

    opacity:1;

    visibility:visible;

    transform:

        translateX(-50%)
        translateY(0);

}


.toast.success{

    background:#2e8b57;

}


.toast.error{

    background:#c0392b;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    body{

        padding:15px;

    }


    .identity-card{

        border-radius:25px;

    }


    .identity-content{

        padding:
            3px
            22px
            25px;

    }


    .identity-card::after{

        font-size:20px;

        letter-spacing:2px;

    }


    .identity-icon{

        width:68px;

        height:68px;

        font-size:34px;

    }


    h1{

        font-size:23px;

    }


    .subtitle{

        font-size:13px;

        margin-bottom:21px;

    }


    input{

        padding:
            13px
            14px
            13px
            44px;

    }


    .btn-primary{

        padding:
            14px 17px;

    }

}


@media(max-width:380px){

    body{

        padding:10px;

    }


    .identity-content{

        padding:
            2px
            17px
            21px;

    }


    .identity-card::after{

        font-size:18px;

        letter-spacing:1px;

    }


    .identity-icon{

        width:62px;

        height:62px;

        font-size:31px;

    }


    h1{

        font-size:21px;

    }


    .subtitle{

        font-size:12px;

    }


    .field label{

        font-size:13px;

    }


    input{

        font-size:15px;

    }


    .btn-primary{

        font-size:15px;

    }

}

</style>

</head>


<body>


<div class="app">

<section class="identity-card">


<div class="identity-content">


    <!-- =================================================
         BADGE SEKOLAH

    <div class="school-badge">

    </div>

    ================================================== -->

</section>

<!-- =====================================================
     TOAST
====================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   KONFIGURASI GOOGLE APPS SCRIPT
========================================================= */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzZYIe9341yGnrAHxKQSsVfX1caKHn7Ess_BEu3k6plwY3GVeig7HjhgqaINouQRcyl/exec";


/* =========================================================
   HALAMAN TUJUAN
========================================================= */

const HALAMAN_TUJUAN =
    "Petualangan-Kelas-5.html";


/* =========================================================
   NAMA KEY STORAGE
========================================================= */

const STORAGE_KEY =
    "identitasPetualanganKelas5";


/* =========================================================
   ELEMEN
========================================================= */

const namaInput =
    document.getElementById("nama");

const kelasInput =
    document.getElementById("kelas");

const absenInput =
    document.getElementById("absen");

const btnLanjut =
    document.getElementById("btnLanjut");

const loading =
    document.getElementById("loading");


/* =========================================================
   TOAST
========================================================= */

function toast(
    message,
    type = "error"
){

    const element =
        document.getElementById("toast");


    element.textContent =
        message;


    element.className =
        "toast " +
        type +
        " show";


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                element.classList.remove(
                    "show"
                );

            },
            2800
        );

}


/* =========================================================
   AMBIL IDENTITAS DARI FORM
========================================================= */

function ambilIdentitas(){

    const nama =
        namaInput.value.trim();


    const kelas =
        kelasInput.value.trim();


    const absen =
        absenInput.value.trim();


    /* -----------------------------------------------------
       VALIDASI NAMA
    ----------------------------------------------------- */

    if(!nama){

        toast(
            "⚠️ Nama siswa wajib diisi."
        );

        namaInput.focus();

        return null;

    }


    /* -----------------------------------------------------
       VALIDASI KELAS
    ----------------------------------------------------- */

    if(!kelas){

        toast(
            "⚠️ Kelas wajib diisi."
        );

        kelasInput.focus();

        return null;

    }


    /* -----------------------------------------------------
       VALIDASI ABSEN
    ----------------------------------------------------- */

    if(!absen){

        toast(
            "⚠️ Nomor absen wajib diisi."
        );

        absenInput.focus();

        return null;

    }


    const nomorAbsen =
        Number(absen);


    /* -----------------------------------------------------
       VALIDASI ANGKA ABSEN
    ----------------------------------------------------- */

    if(
        !Number.isInteger(nomorAbsen) ||
        nomorAbsen < 1 ||
        nomorAbsen > 100
    ){

        toast(
            "⚠️ Nomor absen harus berupa angka 1–100."
        );

        absenInput.focus();

        return null;

    }


    /* -----------------------------------------------------
       DATA FINAL
    ----------------------------------------------------- */

    return {

        nama:nama,

        kelas:kelas,

        absen:nomorAbsen,

        nomorAbsen:nomorAbsen

    };

}


/* =========================================================
   SIMPAN IDENTITAS KE SESSION STORAGE
========================================================= */

function simpanSessionStorage(data){

    try{

        /* Data lengkap */

        sessionStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );


        /* Key terpisah */

        sessionStorage.setItem(
            "nama",
            data.nama
        );


        sessionStorage.setItem(
            "namaSiswa",
            data.nama
        );


        sessionStorage.setItem(
            "kelas",
            data.kelas
        );


        sessionStorage.setItem(
            "kelasSiswa",
            data.kelas
        );


        sessionStorage.setItem(
            "absen",
            String(data.absen)
        );


        sessionStorage.setItem(
            "nomorAbsen",
            String(data.absen)
        );


        sessionStorage.setItem(
            "nomor_absen",
            String(data.absen)
        );


        console.log(
            "✅ Identitas tersimpan di sessionStorage:",
            data
        );


        return true;

    }catch(error){

        console.warn(
            "⚠️ SessionStorage tidak tersedia:",
            error
        );


        return false;

    }

}


/* =========================================================
   SIMPAN IDENTITAS KE LOCAL STORAGE
========================================================= */

function simpanLocalStorage(data){

    try{

        /* Data lengkap */

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );


        /* Key terpisah */

        localStorage.setItem(
            "nama",
            data.nama
        );


        localStorage.setItem(
            "namaSiswa",
            data.nama
        );


        localStorage.setItem(
            "kelas",
            data.kelas
        );


        localStorage.setItem(
            "kelasSiswa",
            data.kelas
        );


        localStorage.setItem(
            "absen",
            String(data.absen)
        );


        localStorage.setItem(
            "nomorAbsen",
            String(data.absen)
        );


        localStorage.setItem(
            "nomor_absen",
            String(data.absen)
        );


        console.log(
            "✅ Identitas tersimpan di localStorage:",
            data
        );


        return true;

    }catch(error){

        console.warn(
            "⚠️ LocalStorage tidak tersedia:",
            error
        );


        return false;

    }

}


/* =========================================================
   KIRIM KE GOOGLE APPS SCRIPT
========================================================= */

function kirimKeGoogleSheets(data){

    return new Promise(
        function(resolve){

            if(!GOOGLE_SCRIPT_URL){

                console.warn(
                    "URL Google Apps Script belum dipasang."
                );


                resolve({

                    ok:false,

                    skipped:false

                });


                return;

            }


            try{

                /* -------------------------------------------------
                   TARGET IFRAME
                ------------------------------------------------- */

                const iframeName =
                    "googleSheetsIdentityTarget";


                let iframe =
                    document.getElementById(
                        iframeName
                    );


                if(!iframe){

                    iframe =
                        document.createElement(
                            "iframe"
                        );


                    iframe.id =
                        iframeName;


                    iframe.name =
                        iframeName;


                    iframe.style.display =
                        "none";


                    iframe.setAttribute(
                        "aria-hidden",
                        "true"
                    );


                    document.body.appendChild(
                        iframe
                    );

                }


                /* -------------------------------------------------
                   FORM POST
                ------------------------------------------------- */

                const form =
                    document.createElement(
                        "form"
                    );


                form.method =
                    "POST";


                form.action =
                    GOOGLE_SCRIPT_URL;


                form.target =
                    iframeName;


                form.style.display =
                    "none";


                /* -------------------------------------------------
                   DATA YANG DIKIRIM
                ------------------------------------------------- */

                const fields = {

                    nama:data.nama,

                    kelas:data.kelas,

                    absen:String(
                        data.absen
                    ),

                    nomorAbsen:String(
                        data.absen
                    ),

                    waktu:
                        new Date().toISOString(),

                    sumber:
                        "Identitas Siswa Petualangan Kelas 5"

                };


                /* -------------------------------------------------
                   BUAT HIDDEN INPUT
                ------------------------------------------------- */

                Object.keys(fields).forEach(
                    function(key){

                        const input =
                            document.createElement(
                                "input"
                            );


                        input.type =
                            "hidden";


                        input.name =
                            key;


                        input.value =
                            fields[key] ?? "";


                        form.appendChild(
                            input
                        );

                    }
                );


                /* -------------------------------------------------
                   MASUKKAN FORM
                ------------------------------------------------- */

                document.body.appendChild(
                    form
                );


                /* -------------------------------------------------
                   SUBMIT
                ------------------------------------------------- */

                form.submit();


                /* -------------------------------------------------
                   HAPUS FORM
                ------------------------------------------------- */

                setTimeout(
                    function(){

                        if(form){

                            form.remove();

                        }

                    },
                    3000
                );


                /* -------------------------------------------------
                   POST DIANGGAP TERKIRIM
                ------------------------------------------------- */

                setTimeout(
                    function(){

                        resolve({

                            ok:true,

                            skipped:false

                        });

                    },
                    1000
                );


            }catch(error){

                console.error(
                    "❌ Pengiriman identitas gagal:",
                    error
                );


                resolve({

                    ok:false,

                    skipped:false,

                    error:error

                });

            }

        }
    );

}


/* =========================================================
   BUAT URL PETUALANGAN DENGAN IDENTITAS
========================================================= */

function buatURLPetualangan(data){

    const parameter =
        new URLSearchParams();


    parameter.set(
        "nama",
        data.nama
    );


    parameter.set(
        "kelas",
        data.kelas
    );


    parameter.set(
        "absen",
        String(data.absen)
    );


    parameter.set(
        "nomorAbsen",
        String(data.absen)
    );


    return (
        HALAMAN_TUJUAN +
        "?" +
        parameter.toString()
    );

}


/* =========================================================
   SIMPAN IDENTITAS DAN LANJUT
========================================================= */

async function simpanDanLanjut(){

    /* -----------------------------------------------------
       AMBIL DATA
    ----------------------------------------------------- */

    const data =
        ambilIdentitas();


    if(!data){

        return;

    }


    /* -----------------------------------------------------
       NONAKTIFKAN TOMBOL
    ----------------------------------------------------- */

    btnLanjut.disabled =
        true;


    loading.classList.add(
        "show"
    );


    console.log(
        "===================================="
    );


    console.log(
        "IDENTITAS SISWA"
    );


    console.log(
        "Nama:",
        data.nama
    );


    console.log(
        "Kelas:",
        data.kelas
    );


    console.log(
        "No Absen:",
        data.absen
    );


    console.log(
        "===================================="
    );


    /* -----------------------------------------------------
       SIMPAN SESSION STORAGE
    ----------------------------------------------------- */

    const sessionBerhasil =
        simpanSessionStorage(
            data
        );


    /* -----------------------------------------------------
       SIMPAN LOCAL STORAGE
    ----------------------------------------------------- */

    const localBerhasil =
        simpanLocalStorage(
            data
        );


    /* -----------------------------------------------------
       PASTIKAN MINIMAL SATU STORAGE BERHASIL
    ----------------------------------------------------- */

    if(
        !sessionBerhasil &&
        !localBerhasil
    ){

        btnLanjut.disabled =
            false;


        loading.classList.remove(
            "show"
        );


        toast(
            "❌ Browser tidak dapat menyimpan identitas."
        );


        return;

    }


    /* -----------------------------------------------------
       KIRIM KE GOOGLE SHEETS
    ----------------------------------------------------- */

    const hasil =
        await kirimKeGoogleSheets(
            data
        );


    /* -----------------------------------------------------
       JIKA BERHASIL
    ----------------------------------------------------- */

    if(hasil.ok){

        toast(
            "✅ Identitas tersimpan. Membuka Petualangan Kelas 5...",
            "success"
        );


        /* -------------------------------------------------
           BUAT URL DENGAN IDENTITAS
        ------------------------------------------------- */

        const tujuan =
            buatURLPetualangan(
                data
            );


        console.log(
            "🚀 Membuka:",
            tujuan
        );


        /* -------------------------------------------------
           PINDAH KE PETUALANGAN
        ------------------------------------------------- */

        setTimeout(
            function(){

                window.location.href =
                    tujuan;

            },
            1000
        );


    }else{

        /* -------------------------------------------------
           GAGAL
        ------------------------------------------------- */

        btnLanjut.disabled =
            false;


        loading.classList.remove(
            "show"
        );


        toast(
            "❌ Identitas belum berhasil dikirim. Silakan coba lagi."
        );

    }

}


/* =========================================================
   EVENT TOMBOL
========================================================= */

btnLanjut.addEventListener(
    "click",
    function(){

        simpanDanLanjut();

    }
);


/* =========================================================
   ENTER UNTUK LANJUT
========================================================= */

[
    namaInput,
    kelasInput,
    absenInput

].forEach(
    function(input){

        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();


                    if(
                        !btnLanjut.disabled
                    ){

                        simpanDanLanjut();

                    }

                }

            }
        );

    }
);


/* =========================================================
   CEGAH PENGIRIMAN GANDA
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            btnLanjut.disabled
        ){

            console.log(
                "Halaman sedang berpindah..."
            );

        }

    }
);


/* =========================================================
   FOKUS AWAL
========================================================= */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){

                namaInput.focus();

            },
            300
        );

    }
);


/* =========================================================
   DEBUG IDENTITAS YANG TERSIMPAN
========================================================= */

window.addEventListener(
    "load",
    function(){

        try{

            const sessionData =
                sessionStorage.getItem(
                    STORAGE_KEY
                );


            const localData =
                localStorage.getItem(
                    STORAGE_KEY
                );


            console.log(
                "📦 Session identitas:",
                sessionData
            );


            console.log(
                "📦 Local identitas:",
                localData
            );

        }catch(error){

            console.warn(
                "Tidak dapat membaca storage:",
                error
            );

        }

    }
);

</script>
