================================ */

/* ================================
   BUTTON
================================ */

button {

.btn-mulai {

/* ================================
   AREA QUIZ
================================ */

#areaKuis {

/* ================================
   ANIMATION
================================ */

@keyframes muncul {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes naik {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes soalMasuk {
    from {
        opacity: 0;
        transform: translateX(20px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes peringatanMasuk {
    from {
        opacity: 0;
        transform: scale(0.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

/* ================================

<script>

/* =========================================================
   BANK SOAL
   SOAL LATIHAN 2 STS 1 PANCASILA KELAS 5
========================================================= */

let soal = [

    {
        q: "Tokoh yang menyampaikan rumusan dasar negara dalam sidang BPUPKI pada tanggal 1 Juni 1945 adalah ....",
        a: [
            "A. Mohammad Hatta",
            "B. Ahmad Soebardjo",
            "C. Ir. Soekarno",
            "D. Ki Hajar Dewantara"
        ],
        k: 2
    },

    {
        q: "Sikap yang sesuai dengan nilai Pancasila ketika mengikuti musyawarah adalah ....",
        a: [
            "A. Mementingkan kepentingan diri sendiri",
            "B. Menghargai pendapat orang lain",
            "C. Memaksakan pendapat kepada peserta lain",
            "D. Menghindari kegiatan kelompok"
        ],
        k: 1
    },

    {
        q: "Rina melihat temannya terjatuh saat bermain. Rina segera menolongnya. Perilaku Rina sesuai dengan Pancasila sila ke ....",
        a: [
            "A. tiga",
            "B. lima",
            "C. satu",
            "D. dua"
        ],
        k: 3
    },

    {
        q: "Contoh penerapan gotong royong di lingkungan masyarakat adalah ....",
        a: [
            "A. Mengajak seluruh warga berpartisipasi sesuai kemampuan",
            "B. Membatalkan kegiatan karena pekerjaan terlalu berat",
            "C. Menyuruh orang lain mengerjakan seluruh pekerjaan",
            "D. Hanya meminta ketua RT yang bekerja"
        ],
        k: 0
    },

    {
        q: "Perhatikan beberapa faktor berikut!<br><br>" +
           "1. Menghargai perbedaan<br>" +
           "2. Menjaga persatuan<br>" +
           "3. Melaksanakan musyawarah<br>" +
           "4. Memaksakan kehendak<br><br>" +
           "Faktor yang dapat memperkuat persatuan adalah ....",
        a: [
            "A. 1, 3, dan 4",
            "B. 2, 3, dan 4",
            "C. 1, 2, dan 3",
            "D. 1, 2, dan 4"
        ],
        k: 2
    },

    {
        q: "Ketika terjadi perbedaan pendapat dalam rapat, sikap yang sebaiknya dilakukan adalah ....",
        a: [
            "A. Meninggalkan rapat",
            "B. Memaksakan pendapat sendiri",
            "C. Menolak semua pendapat orang lain",
            "D. Mendengarkan pendapat dan mencari kesepakatan"
        ],
        k: 3
    },

    {
        q: "Perhatikan perilaku berikut!<br><br>" +
           "1. Membantu teman yang kesulitan.<br>" +
           "2. Menghargai teman tanpa membeda-bedakan.<br>" +
           "3. Menolong orang yang membutuhkan.<br><br>" +
           "Perilaku tersebut merupakan penerapan Pancasila sila ke ....",
        a: [
            "A. dua",
            "B. tiga",
            "C. empat",
            "D. lima"
        ],
        k: 0
    },

    {
        q: "Perhatikan perilaku berikut!<br><br>" +
           "1. Bermusyawarah untuk menentukan keputusan.<br>" +
           "2. Menghargai hasil musyawarah.<br>" +
           "3. Tidak memaksakan kehendak.<br><br>" +
           "Perilaku tersebut sesuai dengan Pancasila sila ke ....",
        a: [
            "A. satu",
            "B. dua",
            "C. empat",
            "D. lima"
        ],
        k: 2
    },

    {
        q: "Perhatikan beberapa perilaku berikut!<br><br>" +
           "1. Menghargai perbedaan agama.<br>" +
           "2. Membantu teman yang sedang kesulitan.<br>" +
           "3. Memaksakan kehendak kepada orang lain.<br>" +
           "4. Menjaga persatuan di lingkungan sekolah.<br><br>" +
           "Perilaku yang sesuai dengan nilai Pancasila adalah ....",
        a: [
            "A. 1, 2, dan 3",
            "B. 1, 2, dan 4",
            "C. 1, 3, dan 4",
            "D. 2, 3, dan 4"
        ],
        k: 1
    },

    {
        q: "Pancasila sebagai pandangan hidup bangsa berarti Pancasila menjadi ....",
        a: [
            "A. aturan permainan di sekolah",
            "B. dasar untuk membuat jadwal pelajaran",
            "C. pedoman dalam bersikap dan berperilaku",
            "D. lambang organisasi masyarakat"
        ],
        k: 2
    },

    {
        q: "Mapalus merupakan tradisi masyarakat yang mengajarkan tentang ....",
        a: [
            "A. persaingan antarkelompok",
            "B. kepentingan pribadi",
            "C. pekerjaan secara sendiri-sendiri",
            "D. kerja sama dan saling membantu"
        ],
        k: 3
    },

    {
        q: "Tokoh yang memperkenalkan istilah Pancasila dalam pidatonya pada tanggal 1 Juni 1945 adalah ....",
        a: [
            "A. Mohammad Yamin",
            "B. Ir. Soekarno",
            "C. Mohammad Hatta",
            "D. Soepomo"
        ],
        k: 1
    },

    {
        q: "Salah satu peran Ir. Soekarno dalam proses perumusan Pancasila adalah ....",
        a: [
            "A. Menyusun tata tertib sekolah",
            "B. Menjadi ketua kelas",
            "C. Menyampaikan gagasan tentang dasar negara dalam sidang BPUPKI",
            "D. Menetapkan jadwal kegiatan masyarakat"
        ],
        k: 2
    },

    {
        q: "Perhatikan pasangan perilaku dan sila Pancasila berikut!<br><br>" +
           "1. Membantu orang yang membutuhkan → sila kedua<br>" +
           "2. Menjaga persatuan → sila ketiga<br>" +
           "3. Bermusyawarah → sila keempat<br><br>" +
           "Pasangan yang tepat adalah ....",
        a: [
            "A. 1 dan 2 saja",
            "B. 1, 2, dan 3",
            "C. 1 dan 3 saja",
            "D. 2 dan 3 saja"
        ],
        k: 1
    },

    {
        q: "Perhatikan fungsi Pancasila berikut!<br><br>" +
           "1. Menjadi dasar negara.<br>" +
           "2. Menjadi pandangan hidup bangsa.<br>" +
           "3. Menjadi pedoman dalam kehidupan sehari-hari.<br><br>" +
           "Urutan fungsi tersebut yang tepat adalah ....",
        a: [
            "A. 1 = pandangan hidup, 2 = dasar negara, 3 = aturan sekolah",
            "B. 1 = pedoman hidup, 2 = aturan negara, 3 = lambang negara",
            "C. 1 = aturan masyarakat, 2 = dasar negara, 3 = pandangan hidup",
            "D. 1 = dasar negara, 2 = pandangan hidup, 3 = pedoman kehidupan sehari-hari"
        ],
        k: 3
    },

    {
        q: "Urutan kegiatan musyawarah yang tepat adalah ....",
        a: [
            "A. Menyampaikan pendapat → mendengarkan pendapat → mencari kesepakatan → melaksanakan keputusan",
            "B. Memaksakan pendapat → memilih teman → membuat keputusan → meninggalkan rapat",
            "C. Membuat keputusan → menyampaikan pendapat → mendengarkan pendapat → membatalkan keputusan",
            "D. Meninggalkan rapat → menyampaikan pendapat → memilih sendiri → melaksanakan keputusan"
        ],
        k: 0
    },

    {
        q: "Tokoh yang dikenal sebagai pengusul istilah Pancasila pada tanggal 1 Juni 1945 adalah ....",
        a: [
            "A. Soepomo",
            "B. Mohammad Yamin",
            "C. Ir. Soekarno",
            "D. Mohammad Hatta"
        ],
        k: 2
    },

    {
        q: "Pancasila bagi bangsa Indonesia berfungsi sebagai ....",
        a: [
            "A. aturan permainan",
            "B. dasar negara",
            "C. jadwal kegiatan",
            "D. semboyan sekolah"
        ],
        k: 1
    },

    {
        q: "Sila Pancasila yang mengajarkan pentingnya persatuan adalah ....",
        a: [
            "A. Ketuhanan Yang Maha Esa",
            "B. Kemanusiaan yang Adil dan Beradab",
            "C. Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan",
            "D. Persatuan Indonesia"
        ],
        k: 3
    },

    {
        q: "Gugur Gunung merupakan istilah yang menggambarkan kegiatan ....",
        a: [
            "A. bekerja sendiri untuk kepentingan pribadi",
            "B. berlomba menyelesaikan pekerjaan",
            "C. gotong royong dan kebersamaan",
            "D. menyerahkan pekerjaan kepada orang lain"
        ],
        k: 2
    },

    {
        q: "Dika dan Rafi memiliki pendapat berbeda ketika menentukan kegiatan kelompok. Sikap yang sebaiknya dilakukan adalah ....",
        a: [
            "A. Mendengarkan pendapat, membandingkan alasan, kemudian bermusyawarah",
            "B. Memaksakan pendapat yang dianggap paling benar",
            "C. Membiarkan masalah tanpa penyelesaian",
            "D. Mengajak teman lain untuk menolak pendapat Rafi"
        ],
        k: 0
    },

    {
        q: "Hubungan antara nilai persatuan dan gotong royong dapat terlihat dari perilaku ....",
        a: [
            "A. mengutamakan kepentingan diri sendiri",
            "B. bekerja sendiri tanpa bantuan orang lain",
            "C. menghindari kegiatan bersama",
            "D. membantu sesama dan bekerja sama untuk kepentingan bersama"
        ],
        k: 3
    },

    {
        q: "Siswa kelas V membersihkan lingkungan sekolah bersama-sama. Kegiatan tersebut mencerminkan nilai ....",
        a: [
            "A. persaingan dan kepentingan pribadi",
            "B. persatuan dan gotong royong",
            "C. perbedaan dan perselisihan",
            "D. sikap individualisme"
        ],
        k: 1
    },

    {
        q: "Saat melihat banyak sampah berserakan di halaman sekolah, tindakan yang sesuai dengan nilai Pancasila adalah ....",
        a: [
            "A. Membiarkan sampah karena bukan milik sendiri",
            "B. Menunggu petugas kebersihan datang",
            "C. Mengajak teman membersihkan dan membuang sampah pada tempatnya",
            "D. Menyuruh teman membersihkan semuanya"
        ],
        k: 2
    },

    {
        q: "Dalam musyawarah desa mengenai penggunaan dana desa, sikap yang tepat adalah ....",
        a: [
            "A. Menyampaikan pendapat sendiri tanpa mendengarkan orang lain",
            "B. Bermusyawarah, mendengarkan pendapat, mempertimbangkan kebutuhan bersama, dan menerima kesepakatan",
            "C. Memaksakan usulan kelompok sendiri",
            "D. Menolak hasil musyawarah jika tidak sesuai keinginan"
        ],
        k: 1
    }

];


/* =========================================================
   VARIABEL
========================================================= */

let dataNama = "";
let dataKelas = "";
let dataAbsen = "";

let indeks = 0;
let benar = 0;


/* =========================================================
   MULAI KUIS
========================================================= */

function mulaiKuis() {

    dataNama = document.getElementById("nama").value.trim();
    dataKelas = document.getElementById("kelas").value.trim();
    dataAbsen = document.getElementById("absen").value.trim();


    /* VALIDASI */

    if (
        dataNama === "" ||
        dataKelas === "" ||
        dataAbsen === ""
    ) {

        tampilkanPeringatan(
            "Silakan lengkapi Nama Siswa, Kelas, dan Nomor Absen terlebih dahulu."
        );

        mainkanSuara("suaraPeringatan");

        return;
    }


    /* RESET */

    indeks = 0;
    benar = 0;


    /* SUARA */

    mainkanSuara("suaraKlik");


    /* INFO SISWA */

    document.getElementById("infoSiswa").innerHTML = `
        <b>👤 Nama:</b> ${escapeHTML(dataNama)}
        &nbsp;&nbsp; | &nbsp;&nbsp;
        <b>🏫 Kelas:</b> ${escapeHTML(dataKelas)}
        &nbsp;&nbsp; | &nbsp;&nbsp;
        <b>🔢 Absen:</b> ${escapeHTML(dataAbsen)}
    `;


    /* TAMPILKAN AREA KUIS */

    document
        .getElementById("formData")
        .classList.add("hidden");

    document
        .getElementById("areaKuis")
        .classList.remove("hidden");


    /* ACAK SOAL */

    soal = acakArray(soal);


    /* ACAK PILIHAN JAWABAN */

    soal.forEach(function(s) {
        acakJawabanSoal(s);
    });


    /* TAMPILKAN SOAL PERTAMA */

    tampilkanSoal();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(teks) {

    const div = document.createElement("div");

    div.textContent = teks;

    return div.innerHTML;

}


/* =========================================================
   ACAK ARRAY
========================================================= */

function acakArray(arr) {

    let array = [...arr];

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================================================
   ACAK JAWABAN SETIAP SOAL
========================================================= */

function acakJawabanSoal(s) {

    const daftarJawaban = s.a.map(
        function(teks, index) {

            return {
                teks: teks,
                benar: index === s.k
            };

        }
    );


    const hasilAcak = acakArray(
        daftarJawaban
    );


    s.a = hasilAcak.map(
        function(item) {
            return item.teks;
        }
    );


    s.k = hasilAcak.findIndex(
        function(item) {
            return item.benar;
        }
    );

}


/* =========================================================
   TAMPILKAN SOAL
========================================================= */

function tampilkanSoal() {

    const quiz = document.getElementById("quiz");


    /* JIKA SEMUA SOAL SELESAI */

    if (indeks >= soal.length) {

        const nilai = Math.round(
            (benar / soal.length) * 100
        );


        /* KIRIM GOOGLE FORM */

        kirimDataKeGoogleSheet(
            dataNama,
            dataKelas,
            dataAbsen,
            nilai
        );


        quiz.innerHTML = `

            <div id="hasil">

                <h2>
                    🎉 Latihan Selesai!
                </h2>

                <p>
                    Selamat, kamu telah menyelesaikan
                    seluruh soal.
                </p>

                <div class="nilai">
                    ${nilai}
                </div>

                <p>
                    Jawaban benar:
                    <b>${benar}</b>
                    dari
                    <b>${soal.length}</b>
                    soal.
                </p>

                <button
                    type="button"
                    class="btn-hasil btn-ulangi"
                    onclick="ulangiKuis()"
                >
                    🔄 Ulangi Latihan
                </button>

                <button
                    type="button"
                    class="btn-hasil btn-selesai"
                    onclick="keluarKuis()"
                >
                    ✅ Selesai
                </button>

            </div>

        `;


        mainkanSuara("suaraNext");

        return;

    }


    /* SOAL SAAT INI */

    const s = soal[indeks];


    /* NOMOR */

    const nomor =
        indeks + 1;


    /* TOMBOL */

    const teksTombol =
        indeks === soal.length - 1
            ? "🏁 Selesai"
            : "➡️ Soal Berikutnya";


    /* RENDER */

    quiz.innerHTML = `

        <div class="nomor-soal">
            Soal ${nomor} dari ${soal.length}
        </div>

        <div class="kotak-soal">

            <div class="pertanyaan">
                ${s.q}
            </div>

            <div class="jawaban">

                ${s.a.map(
                    function(jawaban, i) {

                        return `

                            <label>

                                <input
                                    type="radio"
                                    name="jawaban"
                                    value="${i}"
                                >

                                <span>
                                    ${jawaban}
                                </span>

                            </label>

                        `;

                    }
                ).join("")}

            </div>

            <button
                type="button"
                class="btn-next"
                onclick="periksaJawaban()"
            >
                ${teksTombol}
            </button>

        </div>

    `;


    mainkanSuara("suaraNext");

}


/* =========================================================
   PERIKSA JAWABAN
========================================================= */

function periksaJawaban() {

    const pilihan =
        document.querySelector(
            'input[name="jawaban"]:checked'
        );


    /* BELUM MENJAWAB */

    if (!pilihan) {

        tampilkanPeringatan(
            "Silakan pilih salah satu jawaban terlebih dahulu."
        );

        mainkanSuara("suaraPeringatan");

        return;

    }


    /* CEK JAWABAN */

    const jawabanDipilih =
        Number(pilihan.value);


    if (
        jawabanDipilih ===
        soal[indeks].k
    ) {

        benar++;

    }


    /* LANJUT */

    indeks++;


    tampilkanSoal();

}


/* =========================================================
   PERINGATAN
========================================================= */

function tampilkanPeringatan(pesan) {

    document
        .getElementById("pesanPeringatan")
        .textContent = pesan;

    document
        .getElementById("peringatanArea")
        .classList.remove("hidden");

}


function tutupPeringatan() {

    document
        .getElementById("peringatanArea")
        .classList.add("hidden");

    mainkanSuara("suaraKlik");

}


/* =========================================================
   KIRIM DATA KE GOOGLE SHEET
========================================================= */

function kirimDataKeGoogleSheet(
    nama,
    kelas,
    absen,
    nilai
) {

    const formURL =
        "https://docs.google.com/forms/u/0/d/e/1FAIpQLScrdR_ejx4jr5oHz-BQ9ZU-X6dfgnl7n3atNwxvJxeJluXKjQ/formResponse";


    const data =
        new URLSearchParams();


    data.append(
        "entry.1114641071",
        nama
    );

    data.append(
        "entry.687539915",
        kelas
    );

    data.append(
        "entry.1445858210",
        absen
    );

    data.append(
        "entry.175130881",
        nilai
    );


    fetch(
        formURL,
        {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },
            body: data.toString()
        }
    )
    .catch(
        function(error) {
            console.error(
                "Gagal mengirim data:",
                error
            );
        }
    );

}


/* =========================================================
   ULANGI KUIS
========================================================= */

function ulangiKuis() {

    indeks = 0;

    benar = 0;


    document
        .getElementById("nama")
        .value = "";

    document
        .getElementById("kelas")
        .value = "";

    document
        .getElementById("absen")
        .value = "";


    document
        .getElementById("formData")
        .classList.remove("hidden");


    document
        .getElementById("areaKuis")
        .classList.add("hidden");


    document
        .getElementById("quiz")
        .innerHTML = "";


    mainkanSuara("suaraUlangi");

}


/* =========================================================
   KELUAR KUIS
========================================================= */

function keluarKuis() {

    window.location.href =
        "🕵Petualangan-Seru.html";

}


/* =========================================================
   MAINkan SUARA
========================================================= */

function mainkanSuara(id) {

    const audio =
        document.getElementById(id);


    if (!audio) {
        return;
    }


    audio.currentTime = 0;


    audio.play().catch(
        function() {
            /* Browser dapat memblokir
               autoplay sebelum interaksi */
        }
    );

}


/* =========================================================
   EFEK KETIKA MENGETIK
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const inputs =
            document.querySelectorAll(
                "#formData input"
            );


        inputs.forEach(
            function(input) {

                input.addEventListener(
                    "keydown",
                    function() {

                        mainkanSuara(
                            "suaraKetik"
                        );

                    }
                );

            }
        );


        /* ENTER UNTUK MEMULAI */

        inputs.forEach(
            function(input) {

                input.addEventListener(
                    "keypress",
                    function(event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            mulaiKuis();

                        }

                    }
                );

            }
        );

    }
);

</script>
