
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mulai Pembelajaran Sampah</title>

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           HTML & BODY
        ========================================= */

        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =========================================
           BODY / BACKGROUND
        ========================================= */

        body {

            font-family: Arial, sans-serif;

            /*
             * GAMBAR BACKGROUND
             */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.08)
                ),
                url("https://i.imgur.com/4fOa7qw.jpeg");


            /*
             * PENTING:
             *
             * cover membuat gambar memenuhi
             * seluruh layar secara otomatis.
             *
             * Tidak perlu menentukan ukuran
             * laptop atau HP secara manual.
             */
            background-size: cover;


            /*
             * Gambar selalu berada di tengah.
             */
            background-position: center center;


            /*
             * Jangan mengulang gambar.
             */
            background-repeat: no-repeat;


            /*
             * Warna cadangan apabila ada area
             * yang belum terisi.
             */
            background-color: #dff3df;


            /*
             * Tinggi mengikuti viewport.
             */
            width: 100%;
            height: 100vh;


            /*
             * Untuk browser HP modern.
             * 100dvh mengikuti tinggi layar
             * aktual ketika address bar berubah.
             */
            min-height: 100dvh;


            /*
             * Tombol berada tepat di tengah.
             */
            display: flex;

            justify-content: center;

            align-items: center;


            /*
             * Tidak ada scroll.
             */
            overflow: hidden;

        }


        /* =========================================
           CONTAINER
        ========================================= */

        .container {

            width: 100%;

            height: 100vh;

            min-height: 100dvh;


            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================================
           TOMBOL MULAI
        ========================================= */

        .btn-mulai {

            position: relative;


            display: inline-flex;

            justify-content: center;

            align-items: center;


            /*
             * Ukuran tombol
             */
            min-width: 176px;

            padding: 14px 36px;


            /*
             * Warna hijau 3D
             */
            background: linear-gradient(
                to bottom,
                #4caf50 0%,
                #388e3c 55%,
                #26732b 100%
            );


            color: white;


            text-decoration: none;


            font-size: 22px;

            font-weight: bold;


            letter-spacing: 1px;


            border-radius: 40px;


            border: 3px solid white;


            /*
             * BAYANGAN 3D
             */
            box-shadow:

                0 6px 0 #155d1b,

                0 9px 15px rgba(0, 0, 0, 0.40),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.55),

                inset 0 -3px 4px
                rgba(0, 0, 0, 0.20);


            /*
             * Bayangan tulisan
             */
            text-shadow:

                0 2px 2px
                rgba(0, 0, 0, 0.35);


            /*
             * Animasi
             */
            transition:

                transform 0.15s ease,

                box-shadow 0.15s ease,

                background 0.15s ease;


            cursor: pointer;


            user-select: none;

        }


        /* =========================================
           KILAUAN TOMBOL
        ========================================= */

        .btn-mulai::before {

            content: "";


            position: absolute;


            top: 5px;

            left: 12%;


            width: 76%;

            height: 10px;


            border-radius: 20px;


            background:
                rgba(255, 255, 255, 0.28);


            pointer-events: none;

        }


        /* =========================================
           HOVER LAPTOP / KOMPUTER
        ========================================= */

        .btn-mulai:hover {

            background: linear-gradient(
                to bottom,
                #5cbf60 0%,
                #388e3c 55%,
                #216626 100%
            );


            transform: translateY(-3px);


            box-shadow:

                0 9px 0 #155d1b,

                0 13px 20px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.60),

                inset 0 -3px 4px
                rgba(0, 0, 0, 0.20);

        }


        /* =========================================
           SAAT TOMBOL DITEKAN
        ========================================= */

        .btn-mulai:active {

            transform: translateY(4px);


            box-shadow:

                0 2px 0 #155d1b,

                0 4px 8px
                rgba(0, 0, 0, 0.30),

                inset 0 2px 4px
                rgba(0, 0, 0, 0.20);

        }


        /* =========================================
           TAMPILAN HP
        ========================================= */

        @media (max-width: 600px) {

            body {

                /*
                 * Tetap memenuhi seluruh layar HP.
                 */
                background-size: cover;

                background-position: center center;

            }


            .btn-mulai {

                min-width: 145px;

                padding: 12px 28px;

                font-size: 18px;

                border-width: 3px;

                border-radius: 35px;


                box-shadow:

                    0 5px 0 #155d1b,

                    0 8px 12px
                    rgba(0, 0, 0, 0.40),

                    inset 0 2px 2px
                    rgba(255, 255, 255, 0.55),

                    inset 0 -3px 4px
                    rgba(0, 0, 0, 0.20);

            }


            .btn-mulai::before {

                top: 4px;

                height: 7px;

            }

        }


        /* =========================================
           HP SANGAT KECIL
        ========================================= */

        @media (max-width: 400px) {

            .btn-mulai {

                min-width: 130px;

                padding: 11px 24px;

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         CONTAINER
    ========================================= -->

    <div class="container">


        <!-- =====================================
             TOMBOL MULAI
        ====================================== -->

        <a
            href="sampah.html"
            class="btn-mulai"
        >
            MULAI
        </a>


    </div>


</body>

</html>
