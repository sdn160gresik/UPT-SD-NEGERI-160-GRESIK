
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pilih Kelas - UPT SD Negeri 160 Gresik</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://i.imgur.com/Gup5sKD.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    nav img {
      height: 55px;
      max-width: 100%;
      object-fit: contain;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-menu {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      background: rgba(255,255,255,0.9);
      padding: 0.5rem 1rem;
      margin: 4px;
      border-radius: 6px;
      text-decoration: none;
      color: #0288d1;
      font-weight: bold;
      border: 2px solid #0288d1;
      transition: background-color 0.3s, transform 0.2s ease;
    }

    nav a:hover {
      background-color: #cce5ff;
      transform: scale(1.05);
    }

    .container {
      text-align: center;
      padding: 40px 20px;
    }

    .subjudul {
      font-size: 20px;
      color: #333;
      background: rgba(255, 255, 255, 0.7);
      display: inline-block;
      padding: 8px 16px;
      border-radius: 10px;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .kelas-baris {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .button-kelas {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      border: 3px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      transition: transform 0.2s ease;
    }

    .button-kelas:hover {
      transform: scale(1.1);
    }

    .kelas1 {
      background-color: #f9b208;
    }

    .kelas2 {
      background-color: #7a5230;
    }

    .kelas3 {
      background-color: #ff5d73;
    }

    .kelas4 {
      background-color: #ff8c00;
    }

    .kelas5 {
      background-color: #000000;
    }

    .kelas6 {
      background-color: #9b0000;
    }

    @media (max-width: 600px) {

      nav {
        justify-content: center;
        gap: 15px;
      }

      .nav-logo {
        justify-content: center;
        flex-wrap: wrap;
      }

      nav img {
        height: 45px;
      }

      .nav-menu {
        justify-content: center;
        width: 100%;
      }

      nav a {
        font-size: 14px;
        padding: 8px 12px;
      }

      .container {
        padding: 30px 15px;
      }

      .subjudul {
        font-size: 16px;
        padding: 8px 12px;
      }

      .button-kelas {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <nav>

    <div class="nav-logo">

      <img
        src="https://i.imgur.com/sxm7RR1.png"
        alt="Logo Gresik"
      >

      <img
        src="https://i.imgur.com/tGA5UBc.png"
        alt="Logo Tut Wuri"
        style="height: 62px;"
      >

      <img
        src="https://i.imgur.com/oWB8vKW.png"
        alt="Logo Sekolah"
      >

    </div>

    <div class="nav-menu">

      <a href="../index.html">
        🏠 Beranda
      </a>

      <a href="pengumuman/pengumuman.html">
        📌 Pengumuman
      </a>

      <a href="#">
        📞 Kontak
      </a>

    </div>

  </nav>


  <div class="container">

    <div class="subjudul">
      📚 Siap Belajar Hari Ini? Pilih Kelasmu! 🌟
    </div>


    <div class="kelas-baris">

      <!-- KELAS 1 -->
      <a
        href="../kelas-1/kelas1.html"
        class="button-kelas kelas1"
        title="Kelas 1"
      >
        1
      </a>


      <!-- KELAS 2 -->
      <a
        href="../kelas-2/kelas2.html"
        class="button-kelas kelas2"
        title="Kelas 2"
      >
        2
      </a>


      <!-- KELAS 3 -->
      <a
        href="../kelas-3/kelas3.html"
        class="button-kelas kelas3"
        title="Kelas 3"
      >
        3
      </a>


      <!-- KELAS 4 -->
      <a
        href="../kelas-4/kelas4.html"
        class="button-kelas kelas4"
        title="Kelas 4"
      >
        4
      </a>


      <!-- KELAS 5 -->
      <a
  href="Petualangan-Kelas-5.html"

  title="Kelas 5"
>
  5
</a>


      <!-- KELAS 6 -->
      <a
        href="../kelas-6/kelas6.html"
        class="button-kelas kelas6"
        title="Kelas 6"
      >
        6
      </a>

    </div>

  </div>


  <script>

    // Suara ketika tombol/link diklik
    const clickSound = new Audio('../suara/blub.mp3');

    function playClickSound() {

      clickSound.currentTime = 0;

      clickSound.play().catch(() => {});

    }


    // Event klik untuk semua link
    document.querySelectorAll('a').forEach(link => {

      link.addEventListener('click', function() {

        playClickSound();

      });

    });

  </script>

</body>
</html>
