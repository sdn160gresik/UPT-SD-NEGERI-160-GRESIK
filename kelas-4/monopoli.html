<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monopoli Nusantara</title>

<style>
:root{
  --brown:#7C3F20;
  --brown-dark:#542713;
  --orange:#E67E22;
  --gold:#F4C542;
  --cream:#FFF4DF;
  --green:#4F8A45;
  --line:#E5C6A3;
  --shadow:0 20px 60px rgba(91,52,27,.18);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  font-family:Arial,Segoe UI,sans-serif;
  color:var(--brown-dark);
  background:
    radial-gradient(circle at 10% 10%,rgba(244,197,66,.28),transparent 25%),
    radial-gradient(circle at 90% 15%,rgba(230,126,34,.20),transparent 27%),
    linear-gradient(135deg,#FFF9EE,#FFF0D6,#FFE7C0);
  overflow:hidden;
}

.page{
  width:100%;
  height:100vh;
  padding:12px;
  display:flex;
  flex-direction:column;
}

.topbar{
  width:min(1450px,100%);
  margin:0 auto 10px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#FFFDF8;
  border:2px solid rgba(124,63,32,.18);
  border-radius:18px;
  box-shadow:0 8px 25px rgba(91,52,27,.12);
  z-index:10;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:linear-gradient(135deg,var(--orange),var(--gold));
  font-size:22px;
  flex-shrink:0;
}

.title{
  margin:0;
  color:var(--brown);
  font-size:17px;
  font-weight:900;
}

.subtitle{
  margin:2px 0 0;
  color:#97725B;
  font-size:11px;
  font-weight:700;
}

.actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  min-height:40px;
  padding:9px 13px;
  border-radius:11px;
  border:0;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:.18s ease;
  white-space:nowrap;
}

.btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.04);
}

.btn-back{
  color:var(--brown);
  background:#FFF4E2;
  border:2px solid #DDBB91;
}

.btn-download{
  color:#fff !important;
  background:linear-gradient(135deg,#4F8A45,#356A31);
  box-shadow:0 6px 15px rgba(79,138,69,.25);
}

.btn-full{
  color:#fff;
  background:linear-gradient(135deg,var(--orange),#C95317);
  box-shadow:0 6px 15px rgba(230,126,34,.25);
}

.btn-close{
  color:#fff;
  background:linear-gradient(135deg,var(--brown),#9A4F27);
}

.viewer{
  width:min(1450px,100%);
  flex:1;
  min-height:0;
  margin:auto;
  background:#fff;
  border:2px solid rgba(124,63,32,.18);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
}

.viewer-head{
  height:40px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:linear-gradient(135deg,#FFF5E4,#FFE8BE);
  border-bottom:1px solid var(--line);
  color:var(--brown);
  font-size:12px;
  font-weight:900;
}

.game-area{
  position:relative;
  flex:1;
  min-height:0;
  background:#eee;
}

iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

.loading{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#FFF8EB,#FFEAC5);
  transition:.3s;
}

.loading.hide{
  opacity:0;
  visibility:hidden;
}

.loading-box{
  text-align:center;
  padding:25px;
  background:#FFFDF8;
  border:2px solid #E4C49E;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(91,52,27,.15);
}

.loading-icon{
  font-size:40px;
  margin-bottom:7px;
}

.loading-box h2{
  margin:0 0 6px;
  color:var(--brown);
  font-size:19px;
}

.loading-box p{
  margin:0;
  color:#96715B;
  font-size:12px;
}

.spinner{
  width:24px;
  height:24px;
  margin:13px auto 0;
  border:3px solid #F0D8B9;
  border-top-color:var(--orange);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.footer{
  text-align:center;
  height:20px;
  padding-top:5px;
  color:#9A7661;
  font-size:9px;
  font-weight:700;
}

/* Layar penuh */
body.is-fullscreen .page{
  padding:0;
}

body.is-fullscreen .topbar,
body.is-fullscreen .viewer-head,
body.is-fullscreen .footer{
  display:none;
}

body.is-fullscreen .viewer{
  width:100vw;
  height:100vh;
  border:0;
  border-radius:0;
  box-shadow:none;
}

body.is-fullscreen .game-area{
  width:100vw;
  height:100vh;
}

/* Mobile */
@media(max-width:700px){
  .page{padding:7px}

  .topbar{
    padding:8px;
    border-radius:15px;
  }

  .logo{
    width:36px;
    height:36px;
    font-size:19px;
  }

  .title{font-size:14px}
  .subtitle{display:none}

  .btn{
    min-height:36px;
    padding:7px 9px;
    font-size:11px;
  }

  .label{display:none}

  .viewer{
    border-radius:17px;
  }

  .viewer-head{
    height:34px;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <div class="logo">🎲</div>
      <div>
        <p class="title">Monopoli Nusantara</p>
        <p class="subtitle">Jelajahi Budaya, Bangun Negeri!</p>
      </div>
    </div>

    <div class="actions">

      <!-- TOMBOL DOWNLOAD APK -->
      <a
        class="btn btn-download"
        href="./app-release.apk"
        download="app-release.apk"
        title="Download app-release.apk">
        📱 <span class="label">Download APK</span>
      </a>

      <button
        class="btn btn-full"
        id="fullscreenBtn"
        onclick="toggleFullscreen()"
        type="button">
        ⛶ <span class="label">Layar Penuh</span>
      </button>

      <button
        class="btn btn-back"
        onclick="goBack()"
        type="button">
        🏠 <span class="label">Kembali</span>
      </button>

      <button
        class="btn btn-close"
        onclick="closePage()"
        type="button">
        ✕ <span class="label">Tutup</span>
      </button>

    </div>
  </header>

  <main class="viewer">

    <div class="viewer-head">
      <span>🇮🇩 MONOPOLI NUSANTARA</span>
      <span>🎮 Game Edukasi Interaktif</span>
    </div>

    <div class="game-area">

      <div class="loading" id="loading">
        <div class="loading-box">
          <div class="loading-icon">🎲</div>
          <h2>Menyiapkan Petualangan...</h2>
          <p>Monopoli Nusantara sedang dimuat.</p>
          <div class="spinner"></div>
        </div>
      </div>

      <iframe
        id="gameFrame"
        src="https://monopoli-nusantara.netlify.app/"
        title="Monopoli Nusantara"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

    </div>

  </main>

  <div class="footer">
    UPT SDN 160 GRESIK • Belajar sambil bermain 🌟
  </div>

</div>

<script>
const gameFrame = document.getElementById("gameFrame");
const loading = document.getElementById("loading");
const fullscreenBtn = document.getElementById("fullscreenBtn");

gameFrame.addEventListener("load", function(){
  setTimeout(function(){
    loading.classList.add("hide");
  }, 300);
});

function goBack(){
  window.location.href = "petualangan.html";
}

function closePage(){
  if(document.fullscreenElement){
    document.exitFullscreen().catch(function(){});
  }

  window.close();

  setTimeout(function(){
    window.location.href = "petualangan.html";
  }, 250);
}

async function toggleFullscreen(){
  try{
    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(error){
    document.body.classList.toggle("is-fullscreen");
    updateFullscreenButton();
  }
}

function updateFullscreenButton(){
  const active =
    !!document.fullscreenElement ||
    document.body.classList.contains("is-fullscreen");

  if(active){
    fullscreenBtn.innerHTML = "⛶ <span class='label'>Keluar</span>";
    fullscreenBtn.title = "Keluar dari layar penuh";
  }else{
    fullscreenBtn.innerHTML = "⛶ <span class='label'>Layar Penuh</span>";
    fullscreenBtn.title = "Layar penuh";
  }
}

document.addEventListener("fullscreenchange", function(){
  document.body.classList.toggle(
    "is-fullscreen",
    !!document.fullscreenElement
  );
  updateFullscreenButton();
});

document.addEventListener("keydown", function(event){
  if(event.key === "Escape" && document.fullscreenElement){
    document.exitFullscreen().catch(function(){});
  }
});
</script>

</body>
</html>
