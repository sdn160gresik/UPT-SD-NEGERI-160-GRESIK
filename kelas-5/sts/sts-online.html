<script>

    /* =====================================================
       AUDIO KLIK
    ====================================================== */

    const clickSound =
        document.getElementById(
            "clickSound"
        );


    /* =====================================================
       FUNGSI SUARA KLIK
    ====================================================== */

    function playClickSound() {

        if (!clickSound) {
            return;
        }

        clickSound.currentTime = 0;

        clickSound
            .play()
            .catch(function () {
                /*
                 * Browser dapat memblokir audio
                 * jika aturan autoplay terpenuhi.
                 * Tidak menghentikan navigasi.
                 */
            });

    }


    /* =====================================================
       SUARA UNTUK NAVIGASI
    ====================================================== */

    document
        .querySelectorAll(
            "nav a"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    playClickSound();

                }
            );

        });


    /* =====================================================
       SUARA UNTUK TOMBOL MULAI
    ====================================================== */

    document
        .querySelectorAll(
            ".sts-button"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",
                function () {

                    playClickSound();

                }
            );

        });


    /* =====================================================
       SUARA UNTUK TOMBOL KEMBALI
    ====================================================== */

    document
        .querySelectorAll(
            ".back-button"
        )
        .forEach(function (button) {

            button.addEventListener(
                "click",

    /* =====================================================
       KEAMANAN KARTU STS
       
       Klik pada area kartu:
       - Tidak membuka halaman
       - Tidak melakukan navigasi
       - Tidak memainkan suara
       
       Klik tombol:
       - Tetap aktif
       - Membuka sts1.html / sts2.html
    ====================================================== */

    document
        .querySelectorAll(
            ".sts-card"
        )
        .forEach(function (card) {

            card.addEventListener(
                "click",
                function (event) {

                    /*
                     * Periksa apakah klik berasal
                     * dari tombol Mulai.
                     */

                    const tombol =
                        event.target.closest(
                            ".sts-button"
                        );


                    /*
                     * Jika bukan tombol Mulai,
                     * hentikan aksi.
                     */

                    if (!tombol) {

                        event.preventDefault();

                        event.stopPropagation();

                        return false;

                    }

                }
            );

        });

/* =====================================================
   SISTEM ONLINE SISWA - MENGIKUTI PETUALANGAN KELAS 5
   Halaman ini tetap mengirim heartbeat ke server sehingga
   siswa dapat terdeteksi sedang online pada halaman STS.
===================================================== */

const STS_API_URL =
    "https://script.google.com/macros/s/AKfycbw-SmLBX8bmBH98vNrWzQ5tS3GrMvujNARGqdE2PerdDuIrPHHrGD4Kg5PSlLPyOXJ3/exec";

const STS_HALAMAN_UTAMA =
    "STS";

const STS_HEARTBEAT_INTERVAL =
    20000;

const STS_SESSION_MAX_AGE =
    24 * 60 * 60 * 1000;

const STS_LOGIN_STORAGE_KEY =
    "identitasPetualanganKelas5";

let stsHeartbeatTimer =
    null;

let stsLastHeartbeat =
    0;

let stsSedangRedirect =
    false;


/* =====================================================
   BACA DATA LOGIN
===================================================== */

function stsGetLoginData(){

    const storages = [
        window.localStorage,
        window.sessionStorage
    ];

    for(
        const storage of storages
    ){

        try{

            const raw =
                storage.getItem(
                    STS_LOGIN_STORAGE_KEY
                );

            if(!raw){
                continue;
            }

            const data =
                JSON.parse(raw);

            if(
                data &&
                typeof data === "object"
            ){

                return data;

            }

        }catch(error){

            console.log(
                "STS: gagal membaca data login:",
                error
            );

        }

    }

    return null;

}


/* =====================================================
   SIMPAN DATA LOGIN
===================================================== */

function stsSaveLoginData(data){

    if(!data){
        return;
    }

    try{

        localStorage.setItem(
            STS_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.log(
            "STS: gagal menyimpan localStorage:",
            error
        );

    }

    try{

        sessionStorage.setItem(
            STS_LOGIN_STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.log(
            "STS: gagal menyimpan sessionStorage:",
            error
        );

    }

}


/* =====================================================
   HAPUS DATA LOGIN
===================================================== */

function stsClearLoginData(){

    try{

        localStorage.removeItem(
            STS_LOGIN_STORAGE_KEY
        );

    }catch(error){}

    try{

        sessionStorage.removeItem(
            STS_LOGIN_STORAGE_KEY
        );

    }catch(error){}

}


/* =====================================================
   CEK DATA LOGIN LENGKAP
===================================================== */

function stsLoginDataIsComplete(data){

    return Boolean(
        data &&
        data.nama &&
        data.kelas &&
        data.sessionId
    );

}


/* =====================================================
   CEK SESI MAKSIMAL 24 JAM
===================================================== */

function stsClientSessionExpired(data){

    if(
        !data ||
        !data.loginAt
    ){

        return true;

    }

    const loginTime =
        Number(
            data.loginAt
        );

    if(
        !Number.isFinite(
            loginTime
        )
    ){

        return true;

    }

    return (
        Date.now() -
        loginTime
    ) >= STS_SESSION_MAX_AGE;

}


/* =====================================================
   JSONP
   Mengikuti metode Petualangan Kelas 5 agar Apps Script
   tetap dapat menerima request walaupun ada redirect/CORS.
===================================================== */

function stsRequestJSONP(
    params,
    timeout
){

    return new Promise(
        function(resolve, reject){

            const callbackName =
                "stsOnlineCallback_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 8);

            let selesai =
                false;

            const script =
                document.createElement(
                    "script"
                );

            const query =
                new URLSearchParams(
                    params
                );

            query.set(
                "callback",
                callbackName
            );

            query.set(
                "t",
                Date.now()
            );


            const timer =
                setTimeout(
                    function(){

                        if(selesai){
                            return;
                        }

                        selesai =
                            true;

                        cleanup();

                        reject(
                            new Error(
                                "Request JSONP timeout"
                            )
                        );

                    },
                    timeout || 10000
                );


            function cleanup(){

                clearTimeout(
                    timer
                );

                try{

                    delete window[
                        callbackName
                    ];

                }catch(error){

                    window[
                        callbackName
                    ] = undefined;

                }

                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

            }


            window[
                callbackName
            ] =
                function(data){

                    if(selesai){
                        return;
                    }

                    selesai =
                        true;

                    cleanup();

                    resolve(
                        data
                    );

                };


            script.onerror =
                function(){

                    if(selesai){
                        return;
                    }

                    selesai =
                        true;

                    cleanup();

                    reject(
                        new Error(
                            "JSONP gagal dimuat"
                        )
                    );

                };


            script.src =
                STS_API_URL +
                "?" +
                query.toString();

            script.async =
                true;

            document
                .head
                .appendChild(
                    script
                );

        }
    );

}


/* =====================================================
   REDIRECT KE IDENTITAS
   Karena sts.html berada di folder /sts/,
   identitas.html berada satu tingkat di atas.
===================================================== */

function stsRedirectKeIdentitas(
    alasan
){

    if(stsSedangRedirect){
        return;
    }

    stsSedangRedirect =
        true;

    clearInterval(
        stsHeartbeatTimer
    );

    stsHeartbeatTimer =
        null;

    stsClearLoginData();

    let url =
        "../identitas.html";

    if(alasan){

        url +=
            "?alasan=" +
            encodeURIComponent(
                alasan
            );

    }

    window.location.replace(
        url
    );

}


/* =====================================================
   CEK SESI KE SERVER
===================================================== */

async function stsCheckSession(){

    const loginData =
        stsGetLoginData();

    if(
        !stsLoginDataIsComplete(
            loginData
        )
    ){

        stsRedirectKeIdentitas(
            "login"
        );

        return false;

    }


    if(
        stsClientSessionExpired(
            loginData
        )
    ){

        stsRedirectKeIdentitas(
            "expired"
        );

        return false;

    }


    try{

        const result =
            await stsRequestJSONP(
                {
                    action:
                        "checksession",

                    sessionId:
                        loginData.sessionId
                },
                10000
            );


        if(
            !result ||
            result.success !== true ||
            result.loggedIn !== true
        ){

            stsRedirectKeIdentitas(
                "invalid"
            );

            return false;

        }


        if(
            result.session
        ){

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );

            stsSaveLoginData(
                updated
            );

        }

        return true;

    }catch(error){

        /*
           Sama seperti Petualangan Kelas 5:
           kegagalan sementara API tidak langsung
           mengeluarkan siswa dari halaman.
        */

        console.log(
            "STS: cek sesi sementara gagal:",
            error
        );

        return true;

    }

}


/* =====================================================
   KIRIM HEARTBEAT STS
===================================================== */

async function stsSendHeartbeat(){

    if(stsSedangRedirect){
        return;
    }


    const loginData =
        stsGetLoginData();


    if(
        !stsLoginDataIsComplete(
            loginData
        )
    ){

        console.warn(
            "STS: heartbeat dihentikan karena data login tidak lengkap."
        );

        stsRedirectKeIdentitas(
            "login"
        );

        return;

    }


    if(
        stsClientSessionExpired(
            loginData
        )
    ){

        console.warn(
            "STS: sesi lokal sudah expired."
        );

        stsRedirectKeIdentitas(
            "expired"
        );

        return;

    }


    const now =
        Date.now();


    if(
        now -
        stsLastHeartbeat
        < 5000
    ){

        return;

    }


    stsLastHeartbeat =
        now;


    console.log(
        "========================================"
    );

    console.log(
        "📡 STS MENGIRIM HEARTBEAT"
    );

    console.log(
        "👤 Nama:",
        loginData.nama
    );

    console.log(
        "🏫 Kelas:",
        loginData.kelas
    );

    console.log(
        "🔢 Absen:",
        loginData.nomorAbsen ||
        loginData.absen ||
        "-"
    );

    console.log(
        "📄 Halaman:",
        STS_HALAMAN_UTAMA
    );


    try{

        const result =
            await stsRequestJSONP(
                {
                    action:
                        "heartbeat",

                    sessionId:
                        loginData.sessionId,

                    nama:
                        loginData.nama,

                    kelas:
                        loginData.kelas,

                    nomorAbsen:
                        loginData.nomorAbsen ||
                        loginData.absen ||
                        "",

                    halaman:
                        STS_HALAMAN_UTAMA,

                    sumber:
                        "Petualangan Kelas 5"
                },
                10000
            );


        console.log(
            "📥 RESPONS SERVER STS:",
            result
        );


        if(
            !result ||
            result.success !== true
        ){

            const status =
                String(
                    result &&
                    result.status ||
                    ""
                ).toLowerCase();


            console.warn(
                "STS: heartbeat tidak berhasil.",
                result
            );


            if(
                status === "expired" ||
                status === "not_logged_in" ||
                status === "invalid_session"
            ){

                stsRedirectKeIdentitas(
                    "expired"
                );

                return;

            }


            /*
               Error sementara tidak langsung
               menghapus sesi lokal.
            */

            return;

        }


        if(
            result.session
        ){

            const updated =
                Object.assign(
                    {},
                    loginData,
                    result.session
                );

            stsSaveLoginData(
                updated
            );

        }


        console.log(
            "🟢 STS ONLINE:",
            new Date().toLocaleTimeString()
        );

        console.log(
            "========================================"
        );


    }catch(error){

        /*
           Internet/API sementara gagal tidak
           langsung membuat siswa dianggap logout.
           Heartbeat berikutnya akan mencoba lagi.
        */

        console.warn(
            "STS: heartbeat gagal sementara:",
            error
        );

    }

}


/* =====================================================
   HEARTBEAT BERKALA
===================================================== */

function stsStartHeartbeat(){

    if(
        stsHeartbeatTimer
    ){

        clearInterval(
            stsHeartbeatTimer
        );

    }


    /*
       Kirim langsung ketika sts.html dibuka.
    */

    stsSendHeartbeat();


    /*
       Selanjutnya setiap 20 detik.
    */

    stsHeartbeatTimer =
        setInterval(
            function(){

                stsSendHeartbeat();

            },
            STS_HEARTBEAT_INTERVAL
        );

}


/* =====================================================
   AKTIVITAS SISWA
===================================================== */

let stsActivityTimer =
    null;


function stsRegisterActivity(){

    clearTimeout(
        stsActivityTimer
    );


    stsActivityTimer =
        setTimeout(
            function(){

                stsSendHeartbeat();

            },
            300
        );

}


/* =====================================================
   EVENT AKTIVITAS
===================================================== */

const stsActivityEvents = [
    "click",
    "keydown",
    "scroll",
    "touchstart",
    "pointerdown"
];


stsActivityEvents.forEach(
    function(eventName){

        document.addEventListener(
            eventName,
            stsRegisterActivity,
            {
                passive: true
            }
        );

    }
);


/* =====================================================
   TAB KEMBALI AKTIF
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            stsSendHeartbeat();

        }

    }
);


window.addEventListener(
    "focus",
    function(){

        stsSendHeartbeat();

    }
);


/* =====================================================
   SAAT HALAMAN AKAN DITINGGALKAN
   Tidak mengirim logout agar perpindahan halaman
   tetap mengikuti sistem heartbeat antarhalaman.
===================================================== */

window.addEventListener(
    "pagehide",
    function(){

        clearInterval(
            stsHeartbeatTimer
        );

        stsHeartbeatTimer =
            null;

    }
);


/* =====================================================
   INISIALISASI SISTEM ONLINE STS
===================================================== */

async function stsInitializeOnline(){

    console.log(
        "🚀 Sistem online STS dimulai."
    );

    const loginData =
        stsGetLoginData();


    if(
        !stsLoginDataIsComplete(
            loginData
        )
    ){

        stsRedirectKeIdentitas(
            "login"
        );

        return;

    }


    if(
        stsClientSessionExpired(
            loginData
        )
    ){

        stsRedirectKeIdentitas(
            "expired"
        );

        return;

    }


    /*
       Periksa sesi ke server terlebih dahulu.
    */

    const valid =
        await stsCheckSession();


    if(!valid){
        return;
    }


    /*
       Setelah sesi valid, langsung tandai
       siswa sedang berada di halaman STS.
    */

    stsStartHeartbeat();


    console.log(
        "🟢 STS aktif dan sedang dibaca online oleh server."
    );

    console.log(
        "📄 Halaman online:",
        STS_HALAMAN_UTAMA
    );

    console.log(
        "⏱️ Heartbeat:",
        STS_HEARTBEAT_INTERVAL / 1000,
        "detik"
    );

}


/* =====================================================
   JALANKAN
===================================================== */

stsInitializeOnline();

</script>
